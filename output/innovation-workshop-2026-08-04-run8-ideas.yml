    - claim: "Paid, credited trial rituals appeared independently in 4 of Run 8's top 20 — the judge panel's strongest convergent signal that ticketing filters intent and funds labor."
      source: "Run 8 Gate 1 panel, cross-cutting theme 3, 2026-07-18"
