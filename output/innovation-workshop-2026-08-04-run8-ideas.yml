      why: "Pure overlay on existing vignettes; no construction. All 29 stores addressable."
    - channel: "new-small-box"
      why: "Menu-first ordering lets a small box merchandise full rooms without back-stock."
  cost_model:
    capex: { range: "$40-90K per store", basis: "Menu system design/print (~$10K), QR room-cart build on existing e-comm + delivery-slot API (~$30-60K one-time, amortizes across fleet), tag hardware", source: "assumption (anchored to comparable: OneDine-class QR platform deployments at bartaco)" }
    labor_delta: { estimate: "-1 to -2 FTE per store (order-entry/quote-writing eliminated); 1-2 salaried stylists summoned for custom swaps only", basis: "bartaco service-leader transfer at furniture scale", source: "comparable: bartaco (Restaurant Dive 2023)" }
    revenue_mechanic: "Whole-room baskets replace single-item tickets; good/better/best swaps drive trade-up; delivery-week picker converts hesitation into a committed date."
    payback_logic: "If room-menu vignettes lift average basket even 10-15% on current vignette-adjacent sales, sub-$100K capex returns inside 12 months; labor savings alone (~$50-80K/yr/store) cover it independently."
