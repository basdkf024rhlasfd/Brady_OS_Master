    labor_delta: { estimate: "Net zero — one redeployed Host Concierge on per-delivered-bundle bonus", basis: "Self-serve lane per roster spec; no added headcount", source: "assumption" }
    revenue_mechanic: "Bundle AOV $1,500-4,000 at everyday price plus visible date-lock fee; zero discount leakage; near-zero CAC via the occasion itself."
    payback_logic: "At 2-3 bundles/store/week across 12 weeks and ~$2.5K AOV, a store books ~$60-90K incremental seasonal revenue against <$40K one-time setup — payback inside the first season."
