  one_liner: "$49 reservation-only evening test nights: 90 minutes, private mattress bay, robes, decaf wind-down bar, zero staff contact until the call button — fee credits purchase."
  pitch: |
    Two or three evenings a week, after the commissioned-floor hours end, the mattress department becomes a reservation-only slowroom. Couples book a $49 ticket, get a private curtained bay for 90 minutes with robes and a sensor pad under the sheet, wind down with decaf and sleepy mocktails, and test beds the way they will actually use them — at night, tired, together. No staff approach, ever; a call button summons the one Sleep Concierge on duty. The pressure readback prints at the end, and the $49 credits toward purchase.

    The Blue Ocean move eliminates the two things every mattress store shares — daytime fluorescent testing and a hovering closer — and raises the two things none offer: nighttime realism and privacy. The appetite is documented at both ends of the market: John Lewis's "The Residence" let shoppers book overnight stays inside its department stores and generated global press, and Hästens now runs an entire €500/night Sleep Spa hotel to sell $40K beds. The ticket mechanic (panel's convergent signal: paid, credited rituals in 4 survivors) filters for high-intent couples making a $2-5K decision.

