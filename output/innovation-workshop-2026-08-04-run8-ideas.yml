  pitch: |
    The No-Desk Store eliminates the three pieces of furniture no guest ever wanted to sit at: the sales desk, the cash wrap, and the finance office. Every tag is a QR that builds a cart; financing prequal and delivery-slot booking happen on the guest's phone; the 400-800 sqft those desks occupied becomes a self-serve coffee/sparkling-water lounge in the heart of the floor. Closer, cashier, and F&I roles disappear; headcount drops 40-50% while remaining hosts get paid more.

    Apple wrote the proof 20 years ago: no registers, transactions completed anywhere on the floor by roving staff — and it runs the most profitable square footage in retail. Tesla went further and removed the F&I office entirely; buyers complete financing themselves online with no negotiation. Furniture is the last big-ticket category still routing every purchase through a desk built for 1995 paperwork.

