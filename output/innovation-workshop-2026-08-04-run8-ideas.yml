    labor_delta: { estimate: "Net zero: 2-3 celebration hosts redeployed from existing floor hours; no commissioned role in the flow", basis: "roster labor spec", source: "assumption" }
    revenue_mechanic: "$10-30K whole-home baskets at near-zero CAC (realtor channel replaces promo ad spend); financing attach on large carts; delivery-date guarantee closes."
    payback_logic: "At ~$4K gross margin on a median $15K basket, ~15-20 closing-day baskets repay the full pilot; a 2-store pilot converting 2-3 passes/week clears that inside a quarter."
