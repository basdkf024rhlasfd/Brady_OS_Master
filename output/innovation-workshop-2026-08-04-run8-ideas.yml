    - claim: "Consumers will pay $25 for a 45-minute in-store nap — Casper's Dreamery ran exactly this price point with 9 nooks, fresh linens per napper, in NYC."
      source: "TIME, 'You Can Pay to Nap at Casper's New NYC Store,' 2018-07; Racked, 2018-07-11"
    - claim: "Booked private sleep-demo appointments are the current playbook of the category's hottest brand — Eight Sleep's House of Sleep runs reservation-only 30-min private pod sessions (2026)."
      source: "eightsleep.com/house-of-sleep, 2026"
