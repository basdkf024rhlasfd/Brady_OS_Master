    labor_delta: { estimate: "FOH -40-50%: 6-8 commissioned reps → 2-3 salaried geniuses + zone hosts on pooled bonus", basis: "roster labor spec; bartaco wage math", source: "comparable: bartaco (Restaurant Dive 2023)" }
    revenue_mechanic: "Free diagnostic monetizes through conversion and premium mix — data-backed recommendations trade shoppers up the ASP curve and into adjustable bases; appointments create a bookable pipeline."
    payback_logic: "Removing 2-3 commissioned FTEs (~$120-180K/yr fully loaded) covers the capex inside 12 months before any conversion lift is counted."
