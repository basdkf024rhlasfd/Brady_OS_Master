<title>Lantern</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

<style>
  :root {
    /* Deliberate single-theme design: a deep-sea arcade cabinet.
       Every colour is painted explicitly so the page holds on any host ground. */
    --abyss:      #05080f;
    --abyss-mid:  #0b1526;
    --slab:       rgba(6, 13, 22, 0.78);
    --lumen:      #6ff2d4;
    --lumen-dim:  rgba(111, 242, 212, 0.22);
    --mote:       #cffff4;
    --vent:       #ff8a4c;
    --reef:       #8a4636;
    --reef-lit:   #e0785c;
    --ink:        #dceef0;
    --muted:      #6b8790;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--abyss);
  }

  body {
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    background: var(--abyss);
  }

  /* ---- instrument strip ---------------------------------------------- */

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             0 calc(16px + env(safe-area-inset-left));
    pointer-events: none;
    z-index: 2;
  }

  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat.right { align-items: flex-end; }

  .lab {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    line-height: 1;
    font-weight: 600;
    color: var(--ink);
  }

  .stat.right .val { font-size: 16px; color: var(--muted); padding-top: 5px; }

  #centre {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding-top: 2px;
  }

  #combo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--lumen);
    opacity: 0;
    transition: opacity 140ms ease;
  }
  #combo.on { opacity: 1; }

  #shield {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mote);
    opacity: 0;
    transition: opacity 140ms ease;
  }
  #shield.on { opacity: 1; }

  #mute {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 5;
    pointer-events: auto;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--lumen-dim);
    background: rgba(6, 13, 22, 0.6);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
  }
  #mute:hover { color: var(--lumen); border-color: rgba(111, 242, 212, 0.45); }
  #mute:focus-visible { outline: 2px solid var(--lumen); outline-offset: 2px; }
  #mute.off { color: #4a5f66; }

  /* ---- overlay slabs -------------------------------------------------- */

  .veil {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: grid;
    align-items: end;      /* sit the slab low so the world stays visible above it */
    padding: 0;
  }
  .veil[hidden] { display: none; }

  .slab {
    width: 100%;
    box-sizing: border-box;
    padding: 34px 26px calc(34px + env(safe-area-inset-bottom));
    background: var(--slab);
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    backdrop-filter: blur(16px) saturate(115%);
    border-top: 1px solid var(--lumen-dim);
    border-bottom: 1px solid var(--lumen-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .marquee {
    margin: 0;
    font-size: clamp(28px, 9.6vw, 54px);
    font-weight: 800;
    letter-spacing: 0.28em;
    text-indent: 0.28em; /* balance the trailing tracking */
    text-transform: uppercase;
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 0 26px rgba(111, 242, 212, 0.4), 0 0 70px rgba(111, 242, 212, 0.14);
  }

  .tagline {
    margin: 0;
    max-width: 30ch;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
  }
  .tagline b { color: var(--lumen); font-weight: 600; }
  .tagline i { color: var(--reef-lit); font-style: normal; font-weight: 600; }

  .zones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: min(320px, 82vw);
  }

  .zone {
    padding: 13px 8px;
    border: 1px dashed rgba(111, 242, 212, 0.26);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lumen);
  }
  .zone span { display: block; margin-top: 5px; color: var(--muted); letter-spacing: 0.1em; }

  .prompt {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--lumen);
    animation: breathe 2.1s ease-in-out infinite;
  }

  @keyframes breathe { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }

  .final {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(52px, 20vw, 88px);
    font-weight: 600;
    line-height: 0.9;
    margin: 0;
    color: var(--lumen);
    text-shadow: 0 0 34px rgba(111, 242, 212, 0.32);
  }

  .rundown {
    display: flex;
    gap: 26px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rundown b { color: var(--ink); font-weight: 600; }

  .crown {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--abyss);
    background: var(--lumen);
    padding: 5px 11px;
  }
  .crown[hidden] { display: none; }

  @media (max-height: 560px) {
    .slab { padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); gap: 12px; }
    .zones { display: none; }
    .tagline { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .prompt { animation: none; opacity: 1; }
  }
</style>

<canvas id="stage"></canvas>

<div id="hud">
  <div class="stat">
    <span class="lab">Score</span>
    <span class="val" id="score">0</span>
  </div>
  <div id="centre">
    <span id="combo"></span>
    <span id="shield">Shielded</span>
  </div>
  <div class="stat right">
    <span class="lab">Best</span>
    <span class="val" id="best">0</span>
  </div>
</div>

<button id="mute" type="button" aria-label="Mute sound">◉</button>

<div class="veil" id="veil-start">
  <div class="slab">
    <p class="eyebrow">An orbit game for one thumb</p>
    <h1 class="marquee">Lantern</h1>
    <p class="tagline">
      You are the only light down here. Ride the three currents, swallow the
      <b>plankton</b>, never touch the <i>reef</i>.
    </p>
    <div class="zones">
      <div class="zone">◄ Dive<span>tap left</span></div>
      <div class="zone">Rise ►<span>tap right</span></div>
    </div>
    <p class="prompt" id="start-prompt">Tap to dive</p>
  </div>
</div>

<div class="veil" id="veil-over" hidden>
  <div class="slab">
    <p class="eyebrow">The dark took you</p>
    <p class="final" id="final">0</p>
    <span class="crown" id="crown" hidden>New best</span>
    <div class="rundown">
      <span>Best <b id="best2">0</b></span>
      <span>Depth <b id="depth">0</b>m</span>
    </div>
    <p class="prompt" id="again-prompt">Tap to dive again</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  const cvs = document.getElementById('stage');
  const ctx = cvs.getContext('2d');
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const el = {
    score:  document.getElementById('score'),
    best:   document.getElementById('best'),
    best2:  document.getElementById('best2'),
    combo:  document.getElementById('combo'),
    shield: document.getElementById('shield'),
    final:  document.getElementById('final'),
    depth:  document.getElementById('depth'),
    crown:  document.getElementById('crown'),
    start:  document.getElementById('veil-start'),
    over:   document.getElementById('veil-over'),
    mute:   document.getElementById('mute')
  };

  // ---- geometry ---------------------------------------------------------

  const LANES = [0.44, 0.63, 0.82];   // fractions of the play radius
  let W = 0, H = 0, CX = 0, CY = 0, R = 200;
  let VY = 0;                         // drawn centre — lifts when a card is up
  let booted = false;                 // radii below are absolute px, so a
                                      // resize has to re-derive them

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H / 2;
    VY = CY;
    R  = Math.max(96, Math.min(W, H) * 0.5 - Math.min(W, H) * 0.038);
    if (booted) {
      pr = LANES[lane] * R;
      wake.length = 0;
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rnd   = (a, b) => a + Math.random() * (b - a);
  const pick  = arr => arr[(Math.random() * arr.length) | 0];

  // ---- audio ------------------------------------------------------------

  let AC = null, muted = false;
  try { muted = localStorage.getItem('lantern.muted') === '1'; } catch (e) {}
  el.mute.classList.toggle('off', muted);
  el.mute.textContent = muted ? '○' : '◉';

  function audio() {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      try { AC = new Ctor(); } catch (e) { return null; }
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }

  function tone(freq, dur, type, vol, glide) {
    if (muted) return;
    const c = audio();
    if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(30, glide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  const sfxCollect = n => tone(520 + n * 110, 0.16, 'sine', 0.14);
  const sfxShield  = () => { tone(660, 0.22, 'triangle', 0.13); setTimeout(() => tone(990, 0.26, 'triangle', 0.1), 90); };
  const sfxSwitch  = () => tone(200, 0.06, 'sine', 0.045);
  const sfxDeath   = () => { tone(190, 0.55, 'sawtooth', 0.16, 40); tone(96, 0.7, 'sine', 0.12, 32); };

  // Keep the toggle from doubling as a "tap to dive" — both phases have to be
  // swallowed or the pointerup reaches the window handler and starts a run.
  el.mute.addEventListener('pointerdown', e => e.stopPropagation());
  el.mute.addEventListener('pointerup', e => e.stopPropagation());
  el.mute.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    el.mute.classList.toggle('off', muted);
    el.mute.textContent = muted ? '○' : '◉';
    el.mute.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    try { localStorage.setItem('lantern.muted', muted ? '1' : '0'); } catch (err) {}
    if (!muted) tone(700, 0.1, 'sine', 0.1);
  });

  // ---- state ------------------------------------------------------------

  let best = 0;
  try { best = parseInt(localStorage.getItem('lantern.best') || '0', 10) || 0; } catch (e) {}
  el.best.textContent = best;
  el.best2.textContent = best;

  let mode = 'ready';        // ready | play | over
  let ang, pr, lane, elapsed, score, streak, shield, frontier, lastFree, lockout;
  let obstacles, motes, gates, sparks, floaters, wake, pulses;
  let shake = 0, flash = 0, invuln = 0;

  const snow = Array.from({ length: 64 }, () => ({
    x: Math.random(), y: Math.random(),
    r: rnd(0.5, 1.7), s: rnd(0.004, 0.016), ph: rnd(0, 7)
  }));

  function reset() {
    ang = -Math.PI / 2;
    lane = 1;
    pr = LANES[1] * R;
    elapsed = 0; score = 0; streak = 0; shield = false;
    frontier = ang + 2.2;
    lastFree = [0, 1, 2];
    obstacles = []; motes = []; gates = []; sparks = []; floaters = []; wake = []; pulses = [];
    shake = 0; flash = 0; invuln = 1.1;
    paintHud();
  }

  function difficulty() { return clamp(elapsed / 70, 0, 1); }

  function paintHud() {
    el.score.textContent = score;
    const mult = multiplier();
    el.combo.textContent = '×' + mult;
    el.combo.classList.toggle('on', mult > 1 && mode === 'play');
    el.shield.classList.toggle('on', shield && mode === 'play');
  }

  const multiplier = () => Math.min(5, 1 + Math.floor(streak / 3));

  // ---- spawning ---------------------------------------------------------

  function spawn() {
    while (frontier < ang + 4.6) {
      const d    = difficulty();
      const span = 0.46 + 0.22 * d;
      const gap  = 1.26 - 0.54 * d;
      const mid  = frontier + span / 2;

      let blocked;
      if (Math.random() < 0.12 + 0.55 * d) {
        // Two lanes blocked. Keep the survivor within one lane of the last
        // guaranteed-open lane so the run is always physically clearable.
        const reachable = [0, 1, 2].filter(l => lastFree.some(p => Math.abs(p - l) <= 1));
        const free = pick(reachable);
        blocked = [0, 1, 2].filter(l => l !== free);
        lastFree = [free];
      } else {
        const b = (Math.random() * 3) | 0;
        blocked = [b];
        lastFree = [0, 1, 2].filter(l => l !== b);
      }

      for (const L of blocked) {
        obstacles.push({ lane: L, a0: mid - span / 2, a1: mid + span / 2, ph: rnd(0, 7) });
      }
      gates.push({ a: mid + span / 2, scored: false });

      const open = [0, 1, 2].filter(l => blocked.indexOf(l) === -1);
      if (Math.random() < 0.64) {
        motes.push({
          lane: pick(open), a: mid, ph: rnd(0, 7),
          pearl: !shield && score > 18 && Math.random() < 0.055
        });
      }

      frontier = mid + span / 2 + gap;
    }
  }

  // ---- effects ----------------------------------------------------------

  function burst(x, y, n, hue, speed) {
    if (REDUCED) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = rnd(speed * 0.35, speed);
      sparks.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: rnd(0.35, 0.95), max: 1, r: rnd(1, 2.9), c: hue
      });
    }
  }

  function floater(x, y, text) {
    floaters.push({ x, y, life: 0.85, text });
  }

  // ---- input ------------------------------------------------------------

  function move(dir) {
    const next = clamp(lane + dir, 0, 2);
    if (next !== lane) { lane = next; sfxSwitch(); }
  }

  function begin() {
    reset();
    mode = 'play';
    el.start.hidden = true;
    el.over.hidden = true;
    audio();
  }

  let downX = 0, downY = 0, downT = 0;

  function onDown(e) {
    const p = e.touches ? e.touches[0] : e;
    downX = p.clientX; downY = p.clientY; downT = performance.now();
  }

  function onUp(e) {
    const p = (e.changedTouches ? e.changedTouches[0] : e);
    const dx = p.clientX - downX;
    const dy = p.clientY - downY;

    if (mode === 'ready') { begin(); return; }
    if (mode === 'over')  { if (lockout <= 0) begin(); return; }

    if (Math.abs(dy) > 26 && Math.abs(dy) > Math.abs(dx)) {
      move(dy < 0 ? 1 : -1);            // swipe up rises outward
    } else {
      move(p.clientX < W / 2 ? -1 : 1); // left dives, right rises
    }
  }

  window.addEventListener('pointerdown', onDown, { passive: true });
  window.addEventListener('pointerup', onUp, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'w') { if (mode === 'play') move(1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 's') { if (mode === 'play') move(-1); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      if (mode === 'ready' || (mode === 'over' && lockout <= 0)) begin();
      e.preventDefault();
    }
  });

  document.addEventListener('visibilitychange', () => { last = 0; });

  // ---- death ------------------------------------------------------------

  function die() {
    mode = 'over';
    lockout = 0.7;
    shake = REDUCED ? 4 : 22;
    flash = 1;
    sfxDeath();
    if (navigator.vibrate) navigator.vibrate([40, 45, 90]);
    burst(CX + Math.cos(ang) * pr, VY + Math.sin(ang) * pr, 46, 'lumen', 340);
    burst(CX + Math.cos(ang) * pr, VY + Math.sin(ang) * pr, 18, 'reef', 210);

    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('lantern.best', String(best)); } catch (e) {}
    }
    el.final.textContent = score;
    el.best.textContent = best;
    el.best2.textContent = best;
    el.depth.textContent = Math.round(elapsed * 7.4);
    el.crown.hidden = !isBest || score === 0;
    el.combo.classList.remove('on');
    el.shield.classList.remove('on');
    setTimeout(() => { el.over.hidden = false; }, 420);
  }

  // ---- simulation -------------------------------------------------------

  function step(dt) {
    const d = difficulty();

    if (mode === 'play') {
      elapsed += dt;
      ang += (1.10 + 1.05 * d) * dt;
      invuln = Math.max(0, invuln - dt);
    } else {
      ang += 0.34 * dt;   // idle drift on the menu
    }

    // lane easing
    pr += (LANES[lane] * R - pr) * (1 - Math.exp(-dt / 0.072));

    // camera lifts the world clear of the card when one is showing
    const vTarget = mode === 'play' ? CY : CY - H * 0.15;
    VY += (vTarget - VY) * (1 - Math.exp(-dt / 0.26));

    // wake — stops feeding once you're gone, then drains itself
    if (mode !== 'over') wake.push({ a: ang, r: pr });
    else if (wake.length) wake.shift();
    if (wake.length > 26) wake.shift();

    if (mode === 'play') {
      spawn();

      const playerR = R * 0.042;
      const thick   = R * 0.095;

      // reef collision
      if (invuln <= 0) {
        for (const o of obstacles) {
          const orad = LANES[o.lane] * R;
          if (Math.abs(pr - orad) >= thick / 2 + playerR * 0.86) continue;
          const pad = playerR / Math.max(pr, 1);
          if (ang > o.a0 - pad && ang < o.a1 + pad) {
            if (shield) {
              shield = false;
              invuln = 0.85;
              streak = 0;
              flash = 0.6;
              shake = REDUCED ? 3 : 12;
              sfxShield();
              if (navigator.vibrate) navigator.vibrate(25);
              burst(CX + Math.cos(ang) * pr, VY + Math.sin(ang) * pr, 22, 'mote', 220);
              paintHud();
            } else {
              die();
            }
            break;
          }
        }
      }

      // plankton
      const mrad = m => LANES[m.lane] * R;
      for (let i = motes.length - 1; i >= 0; i--) {
        const m = motes[i];
        const rr = mrad(m);
        const reach = playerR + R * 0.034;
        if (Math.abs(pr - rr) < reach && Math.abs(ang - m.a) < reach / Math.max(pr, 1) + 0.055) {
          const x = CX + Math.cos(m.a) * rr;
          const y = VY + Math.sin(m.a) * rr;
          if (m.pearl) {
            shield = true;
            sfxShield();
            floater(x, y, 'SHIELD');
            burst(x, y, 20, 'mote', 190);
          } else {
            streak++;
            const gain = 5 * multiplier();
            score += gain;
            sfxCollect(Math.min(4, multiplier() - 1));
            floater(x, y, '+' + gain);
            burst(x, y, 9, 'lumen', 130);
            if (navigator.vibrate) navigator.vibrate(8);
          }
          motes.splice(i, 1);
          paintHud();
          continue;
        }
        if (ang - m.a > 0.16) { motes.splice(i, 1); if (!m.pearl) { streak = 0; paintHud(); } }
      }

      // cleared gates
      for (let i = gates.length - 1; i >= 0; i--) {
        if (ang > gates[i].a) { score += 1; gates.splice(i, 1); paintHud(); }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (ang - obstacles[i].a1 > 0.62) obstacles.splice(i, 1);
      }
    }

    if (mode === 'over') lockout = Math.max(0, lockout - dt);

    // ambience + effects
    for (const s of snow) {
      s.y += s.s * dt * 12;
      if (s.y > 1.05) { s.y = -0.05; s.x = Math.random(); }
    }

    if (pulses.length === 0 || pulses[pulses.length - 1].r > R * 0.13) {
      pulses.push({ r: R * 0.05, a: 0.5 });
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.r += R * 0.16 * dt;
      p.a -= 0.42 * dt;
      if (p.a <= 0) pulses.splice(i, 1);
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= 0.94; s.vy *= 0.94;
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= 34 * dt;
      f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }

    shake *= Math.pow(0.0015, dt);
    flash = Math.max(0, flash - dt * 2.4);
  }

  // ---- rendering --------------------------------------------------------

  function draw(t) {
    const CY = VY;   // shadows the true centre; everything below draws in view space
    ctx.save();
    if (shake > 0.4) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));

    // abyss ground
    const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.72);
    bg.addColorStop(0, '#0b1526');
    bg.addColorStop(0.55, '#070d18');
    bg.addColorStop(1, '#05080f');
    ctx.fillStyle = bg;
    ctx.fillRect(-60, -60, W + 120, H + 120);

    // marine snow
    for (const s of snow) {
      const sway = Math.sin(t * 0.6 + s.ph) * 6;
      ctx.globalAlpha = 0.10 + 0.16 * Math.sin(t * 1.4 + s.ph) * 0.5 + 0.1;
      ctx.fillStyle = '#9fd8dd';
      ctx.beginPath();
      ctx.arc(s.x * W + sway, s.y * H, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // thermal vent
    const beat = 0.86 + 0.14 * Math.sin(t * 1.6);
    const vg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 0.46 * beat);
    vg.addColorStop(0.00, 'rgba(255, 214, 168, 0.95)');
    vg.addColorStop(0.16, 'rgba(255, 138, 76, 0.62)');
    vg.addColorStop(0.44, 'rgba(196, 72, 44, 0.20)');
    vg.addColorStop(1.00, 'rgba(150, 50, 40, 0)');
    ctx.fillStyle = vg;
    ctx.beginPath();
    ctx.arc(CX, CY, R * 0.46 * beat, 0, 6.2832);
    ctx.fill();

    for (const p of pulses) {
      ctx.globalAlpha = clamp(p.a, 0, 1) * 0.34;
      ctx.strokeStyle = '#ff8a4c';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(CX, CY, p.r, 0, 6.2832);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // currents
    ctx.setLineDash([2, 9]);
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const active = i === lane;
      ctx.strokeStyle = active ? 'rgba(111,242,212,0.46)' : 'rgba(120,190,205,0.10)';
      ctx.beginPath();
      ctx.arc(CX, CY, LANES[i] * R, 0, 6.2832);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // reef
    const thick = R * 0.095;
    ctx.lineCap = 'round';
    for (const o of obstacles) {
      const rr = LANES[o.lane] * R;
      const lead = o.a0 - ang;
      const trail = ang - o.a1;
      let a = 1;
      if (lead > 3.1) a = clamp(1 - (lead - 3.1) / 1.4, 0, 1);
      if (trail > 0)  a = Math.min(a, clamp(1 - trail / 0.55, 0, 1));
      if (a <= 0.01) continue;
      const shimmer = 0.9 + 0.1 * Math.sin(t * 2.2 + o.ph);

      ctx.globalAlpha = a * 0.20 * shimmer;
      ctx.strokeStyle = '#e0785c';
      ctx.lineWidth = thick * 1.85;
      ctx.beginPath(); ctx.arc(CX, CY, rr, o.a0, o.a1); ctx.stroke();

      ctx.globalAlpha = a;
      ctx.strokeStyle = '#7e3b2e';
      ctx.lineWidth = thick;
      ctx.beginPath(); ctx.arc(CX, CY, rr, o.a0, o.a1); ctx.stroke();

      ctx.globalAlpha = a * 0.62 * shimmer;
      ctx.strokeStyle = '#e0785c';
      ctx.lineWidth = thick * 0.15;
      ctx.beginPath(); ctx.arc(CX, CY, rr - thick * 0.33, o.a0 + 0.02, o.a1 - 0.02); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // plankton + pearls
    for (const m of motes) {
      const rr = LANES[m.lane] * R;
      const lead = m.a - ang;
      let a = 1;
      if (lead > 3.1) a = clamp(1 - (lead - 3.1) / 1.4, 0, 1);
      if (a <= 0.01) continue;
      const bob = Math.sin(t * 3 + m.ph) * R * 0.008;
      const x = CX + Math.cos(m.a) * (rr + bob);
      const y = CY + Math.sin(m.a) * (rr + bob);
      const size = R * (m.pearl ? 0.036 : 0.024);

      const g = ctx.createRadialGradient(x, y, 0, x, y, size * 3.4);
      g.addColorStop(0, m.pearl ? 'rgba(207,255,244,0.85)' : 'rgba(111,242,212,0.6)');
      g.addColorStop(1, 'rgba(111,242,212,0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, size * 3.4, 0, 6.2832); ctx.fill();

      if (m.pearl) {
        ctx.strokeStyle = '#cffff4';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.arc(x, y, size, t * 1.5, t * 1.5 + 6.2832); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.fillStyle = '#cffff4';
        ctx.beginPath(); ctx.arc(x, y, size * 0.5, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // wake
    for (let i = 0; i < wake.length; i++) {
      const w = wake[i];
      const f = i / wake.length;
      ctx.globalAlpha = f * f * 0.42;
      ctx.fillStyle = '#6ff2d4';
      ctx.beginPath();
      ctx.arc(CX + Math.cos(w.a) * w.r, CY + Math.sin(w.a) * w.r, R * 0.042 * f * 0.8, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // the lantern
    if (mode !== 'over') {
      const px = CX + Math.cos(ang) * pr;
      const py = CY + Math.sin(ang) * pr;
      const pRad = R * 0.042;
      const blink = invuln > 0 && Math.floor(t * 14) % 2 === 0 ? 0.35 : 1;

      // tendrils streaming behind
      ctx.globalAlpha = 0.55 * blink;
      ctx.strokeStyle = '#6ff2d4';
      ctx.lineWidth = Math.max(1, pRad * 0.2);
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        for (let s = 0; s <= 6; s++) {
          const aa = ang - s * 0.032;
          const rr = pr + k * pRad * 0.7 + Math.sin(t * 5.5 + s * 0.7 + k * 2) * pRad * 0.2 * (s / 6);
          const x = CX + Math.cos(aa) * rr;
          const y = CY + Math.sin(aa) * rr;
          s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const halo = ctx.createRadialGradient(px, py, 0, px, py, pRad * 4.6);
      halo.addColorStop(0, 'rgba(111,242,212,0.55)');
      halo.addColorStop(0.4, 'rgba(111,242,212,0.16)');
      halo.addColorStop(1, 'rgba(111,242,212,0)');
      ctx.globalAlpha = blink;
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(px, py, pRad * 4.6, 0, 6.2832); ctx.fill();

      if (shield) {
        ctx.globalAlpha = 0.7 * blink;
        ctx.strokeStyle = '#cffff4';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(px, py, pRad * 2.1, 0, 6.2832); ctx.stroke();
      }

      ctx.globalAlpha = blink;
      ctx.fillStyle = '#8ffbe2';
      ctx.beginPath(); ctx.arc(px, py, pRad, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, pRad * 0.44, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // sparks
    for (const s of sparks) {
      ctx.globalAlpha = clamp(s.life / s.max, 0, 1) * 0.9;
      ctx.fillStyle = s.c === 'reef' ? '#e0785c' : s.c === 'mote' ? '#cffff4' : '#6ff2d4';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floating gains
    ctx.font = '600 12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'center';
    for (const f of floaters) {
      ctx.globalAlpha = clamp(f.life / 0.85, 0, 1);
      ctx.fillStyle = '#cffff4';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    ctx.restore();

    if (flash > 0.01) {
      ctx.globalAlpha = flash * 0.42;
      ctx.fillStyle = '#ffb388';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---- loop -------------------------------------------------------------

  let last = 0;
  function frame(now) {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    step(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  reset();
  mode = 'ready';
  booted = true;
  requestAnimationFrame(frame);
})();
</script>
