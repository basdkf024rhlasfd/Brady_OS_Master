# ─── Secrets Inventory ───
secrets:
  telly_archive:
    - name: NOTION_API_KEY
      source: ~/telly-bot/.env.production.local
      provisioning: "cd ~/telly-bot && npx vercel env pull .env.production.local --environment production"
    - name: BLOB_READ_WRITE_TOKEN
      source: ~/telly-bot/.env.production.local
      provisioning: "cd ~/telly-bot && npx vercel env pull .env.production.local --environment production"

  email_classifier_gas:
    - name: ANTHROPIC_API_KEY
      source: PropertiesService (GAS editor)
      provisioning: "Run in GAS console: PropertiesService.getScriptProperties().setProperty('ANTHROPIC_API_KEY', '...')"
    - name: NOTION_API_KEY
      source: PropertiesService (GAS editor)
      provisioning: "Run in GAS console: PropertiesService.getScriptProperties().setProperty('NOTION_API_KEY', '...')"
    - name: NOTION_SYNC_ENABLED
      source: PropertiesService (GAS editor)
      provisioning: "Run in GAS console: PropertiesService.getScriptProperties().setProperty('NOTION_SYNC_ENABLED', 'true')"

  pauletteai_sync_drive:
    - name: GOOGLE_API_KEY
      source: 1-execution/.../Project - PauletteAI/viewer/.env (local, gitignored)
      provisioning: "Create .env file with GOOGLE_API_KEY=..."

# ─── Cross-Repo Dependencies ───
cross_repo_dependencies:
  telly_archive:
    depends_on: ~/telly-bot/.env.production.local
    repo: telly-bot (Vercel project, separate GitHub repo)
    note: Must exist before running telly-archive.mjs. Pull with vercel env pull.

  os_recap_mailer:
    depends_on: Google Drive "OS-Recaps" folder
    repo: N/A (Google Drive)
    note: Weekly recap must be uploaded to this folder before Friday 7:15 AM CT.

  email_classifier:
    depends_on: GAS project with clasp link
    repo: N/A (Google Apps Script)
    note: Deploy changes via "cd 3-reference/scripts/gas && ./build.sh && clasp push"
