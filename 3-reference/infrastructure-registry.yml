# Brady OS — Infrastructure Registry
# Canonical source for all external service IDs, secrets, and cross-repo dependencies.
# Referenced by TRANSPARENCY.md and CLAUDE.md.
# Last updated: 2026-04-16

# ─── Notion Databases ───
notion:
  streaming_notes_db:
    id: "2e9ed43b-89c5-800d-acc7-d9e4e9ea1b83"
    purpose: Telly captures, sweep notes, pipeline intake
    used_by:
      - 3-reference/scripts/telly-archive.mjs
      - skills/morning-sweep
      - skills/evening-sweep
      - skills/pipeline-dashboard

  routing_log_db:
    id: "344ed43b-89c5-816a-ab54-ca49ca239748"
    purpose: Canonical action log. Every sweep/skill that routes, dispositions, or publishes appends a row.
    schema:
      - date          # YYYY-MM-DD of the routing action
      - original_title # the item being routed (email subject, note title, etc.)
      - destination   # where it was routed to (page title, DB, file path, URL)
      - reason        # why this destination (one clause)
      - summary       # one-line description of the content or outcome
    sop: 3-reference/skills/_shared/routing-log.md
    used_by:
      - skills/morning-sweep
      - skills/evening-sweep
      - skills/weekly-sweep
      - skills/daily-whitepaper
      - skills/exec-intel-brief
      - skills/pipeline-dashboard

  email_hub_db:
    id: "9b63f611b5744195b18e9f122579d4e2"
    purpose: Email classification results from GAS email-classifier
    used_by:
      - 3-reference/scripts/gas/scripts/email-classifier/notion-sync.js

  client_projects_db:
    id: "c8a6b2d70d9343839a16c950c95a6066"
    purpose: Shareable client project pages (workspace root)
    used_by:
      - skills/client-project-cleanup
      - CLAUDE.md (agent reference)

  internal_projects_db:
    id: "2c2ed43b-89c5-80af-ac9b-ededd48b98e7"
    purpose: Private internal project tracking (OS > Execution)
    used_by:
      - skills/project-creator
      - CLAUDE.md (agent reference)

  consulting_practice_wiki:
    url: "https://www.notion.so/333ed43b89c58123b019d1d108c53c11"
    purpose: Consulting methodology, templates, SOPs
    used_by:
      - CLAUDE.md (agent reference)

  life_events_db:
    id: "c5ce4840162c4702a629081d66492760"  # created 2026-04-22 by Code agent
    purpose: Brady's major life events (travel, milestones, financial meetings, school, medical) with prep checklist, countdown, and owner
    used_by:
      - skills/life-events-review
      - skills/weekly-sweep

