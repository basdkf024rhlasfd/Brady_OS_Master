  dtc_resources:
    fedex_calculator: references/fedex_calc.py
    fedex_rates_raw: references/raw/fedex-rates.jsonl
    fedex_rates_last_updated: 2025-02-11
    fedex_notes: |
      Calculator exposes fedex_cost(schedule, zone, weight) and higher-level
      helpers zone_for_state(), quote(), all_options(), cheapest_ground(),
      and dtc_landed_model() for a full vendor-cost → suggested-retail pass.
      Artisan's negotiated rate card — treat as a floor for their origin
      (Broadview, IL → zone 2). Other origins should flag as assumption.
      Schedules available: 2-Day, 3-Day, Ground, Home, Priority, Standard.
      Zones: 2-8 plus 13 (AK/HI/PR).

