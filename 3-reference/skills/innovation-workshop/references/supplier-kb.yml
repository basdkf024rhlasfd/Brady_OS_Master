# Supplier Knowledge Base — Innovation Workshop
#
# Feeds the Cost Model section in Stage 2 idea generation (SKILL.md Step 5).
# When the Cost Model cites `source: supplier-kb:<slug>:<sku>`, the generator
# MUST reference a real entry in the catalog. If no matching entry exists,
# flag the cost line as `source: assumption` and do NOT fabricate numbers.
#
# Schema (per supplier):
#   slug:
#     name:             # legal / trade name
#     kind:             # distributor | co-manufacturer | producer | broker
#     location:         # city, state
#     channels: []      # airline | foodservice | retail | DTC | B2B
#     capabilities:
#       retail_packaging, copack, moq_notes
#     catalog_file:     # path to raw/<supplier>-catalog.jsonl (full SKU table)
#     brands_file:      # path to raw/<supplier>-brands.jsonl (brand rollup)
#     catalog_summary:  # derived stats + category/brand rollups
#     dtc_resources:    # ship calculator if applicable
#     brady_relationship, sources, last_updated, confidence

artisan-specialty-foods:
  name: Artisan Specialty Foods
  kind: distributor
  location: Broadview, IL
  channels:
    - foodservice
    - airline  # zoned pricing maps to airline-hub geographies
  capabilities:
    retail_packaging: unknown
    copack: false
    moq_notes: |
      Sold by CASE (CS) or EACH (EA). Zoned pricing across 4 airline-hub
      geographies:
        Zone 1: LGA, EWR, IAD, BOS
        Zone 2: JFK, LAX, MIA, LAS, SFO, SEA, ORD, ATL, DFW
        Zone 3: SAN, FLL, MCO, CVG, MSY, SAT, DTW, STL, DEN, TPA, IND
        Zone 4: HNL, OGG (Hawaii — highest cost)
      Shipping methods on pricing calc: Ground, 2-Day, Priority.

  catalog_file: references/raw/artisan-catalog.jsonl
  brands_file: references/raw/artisan-brands.jsonl

