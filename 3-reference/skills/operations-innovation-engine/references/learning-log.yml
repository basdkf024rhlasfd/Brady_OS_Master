      - "General QSR untouched — natural next extension"
      - "Retail/grocery ops untouched — high margin, high complexity, strong Brady network (Walmart, Kroger)"
      - "Fast casual untouched — throughput + hospitality hybrid (Chipotle, Sweetgreen, CAVA)"
      - "Foodservice/contract dining untouched (Aramark, Sodexo, Compass) — B2B margin structure"
    learnings:
      - "Problem-first framing (P1-P10) is load-bearing. Without it, ideas drift to tech wish-lists. The Panda run worked because P1-P10 were defined before idea generation began."
      - "Analogous Inspiration (#15) is the most productive method for ops — 5 ideas, all survived. Cross-industry transfer (Japanese counter service, manufacturing line balancing, Amazon lockers, Subway-in-Walmart) dominates ops innovation."
      - "Platform Thinking (#32) and Copy and Improve (#79) are both 100% hit-rate workhorses for ops — they produce high-feasibility, precedented ideas."
      - "Tier 1 (≥4.0) at 8/32 = 25% is within target band (target 20-30%). Good calibration."
      - "All methods hit 100% in Run 0 — retrospective scoring may have been lenient. Future runs with strict quality-floor (any 1 on Feasibility or Labor = auto-cut) will show real method differentiation."
      - "Operator wisdom cards anchored heavily: Toyota + Chipotle + CFA provided the throughput/labor reference architectures; Walton + Foran provided retail doctrine for site/format decisions; JTBD provided the internal stakeholder lens."
      - "Precedent-heavy RTBs (specific companies, specific numbers) dramatically more credible than trend claims."
      - "Partnership-angle ideas (DoorDash via Fuad Hannon, Walmart via James Ku's RE relationships) hit high-feasibility — warm introductions are a real asset for ops innovation."
      - "Format innovation (Panda Counter, Vertical Kitchen, Modular Kit) is the most bold category and also the most capital-intensive. Pair with lighter-weight tech ideas (scorecard, dynamic menu, voice AI) to balance the portfolio."
      - "The absence of Canva/Midjourney images was not felt — ops ideas work as text. Future runs formalize no-visuals default."
    calibration_signals:
      tier_1_count: 8             # Within target (6-10)
