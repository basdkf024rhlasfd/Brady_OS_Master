<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Recap — {{WEEK_RANGE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0C0F14;
    --bg-card: #13161D;
    --bg-card-alt: #181C25;
    --gold: #D4A843;
    --gold-dim: #9A7B32;
    --blue: #4A7FB5;
    --dark-blue: #1E3A5F;
    --white: #F0EDE6;
    --gray: #8A8D94;
    --gray-light: #B0B3BA;
    --red: #C45C5C;
    --red-dim: #8B3A3A;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    max-width: 816px;
    margin: 0 auto;
    padding: 40px 48px 36px;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(212,168,67,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,168,67,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  /* ─── HEADER ─── */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--gold-dim);
  }
  .header-left { max-width: 480px; }
  .header-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--gold);
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .header-tag::before { content: ''; width: 18px; height: 2px; background: var(--gold); }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700;
    line-height: 1.1; letter-spacing: -0.5px; margin-bottom: 6px;
  }
  h1 span { color: var(--gold); }
  .header-sub { font-size: 14px; color: var(--gray-light); line-height: 1.5; }
  .header-right { text-align: right; padding-top: 4px; }
  .header-stats { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .header-stat {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--gray-light); letter-spacing: 0.5px;
  }
  .header-stat strong {
    font-family: 'Space Grotesk', sans-serif; font-size: 20px;
    font-weight: 700; color: var(--gold); margin-right: 4px;
  }

  /* ─── THESIS ─── */
  .thesis {
    background: linear-gradient(135deg, rgba(212,168,67,0.12), rgba(212,168,67,0.04));
    border: 1px solid rgba(212,168,67,0.25); border-radius: 8px;
    padding: 14px 24px; margin-bottom: 24px; text-align: center;
  }
  .thesis p {
    font-family: 'Space Grotesk', sans-serif; font-size: 15px;
    font-weight: 600; line-height: 1.5;
  }
  .thesis em { color: var(--gold); font-style: normal; }

  /* ─── STAT CARDS ─── */
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-card); border-radius: 8px; padding: 14px 12px;
    border: 1px solid rgba(255,255,255,0.06); text-align: center;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif; font-size: 28px;
    font-weight: 700; color: var(--gold); line-height: 1; margin-bottom: 4px;
  }
  .stat-desc { font-size: 11px; color: var(--gray-light); line-height: 1.3; }

  /* ─── CATEGORY SECTIONS ─── */
  .section-header {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-header::after { content: ''; flex: 1; height: 1px; background: rgba(212,168,67,0.2); }

  .category-card {
    background: var(--bg-card); border-radius: 8px; padding: 18px 20px;
    border: 1px solid rgba(255,255,255,0.06); margin-bottom: 16px;
  }
  .category-card--gold { border-top: 3px solid var(--gold); }
  .category-card--blue { border-top: 3px solid var(--blue); }
  .category-card--red { border-top: 3px solid var(--red-dim); }
  .category-card--gray { border-top: 3px solid var(--gray); }
  .category-card--gold-dim { border-top: 3px solid var(--gold-dim); }

  .category-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 16px;
    font-weight: 700; margin-bottom: 10px;
  }
  .category-card--gold .category-title { color: var(--gold); }
  .category-card--blue .category-title { color: var(--blue); }
  .category-card--red .category-title { color: var(--red); }
  .category-card--gray .category-title { color: var(--gray-light); }
  .category-card--gold-dim .category-title { color: var(--gold-dim); }

  .category-list { list-style: none; padding: 0; }
  .category-list li {
    font-size: 13px; line-height: 1.55; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--gray-light);
  }
  .category-list li:last-child { border-bottom: none; }
  .category-list li strong { color: var(--white); font-weight: 600; }

  /* ─── TIMELINE ─── */
  .timeline { margin-bottom: 24px; }
  .timeline-row {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 0;
  }
  .timeline-day {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--gray); width: 52px; text-align: right; flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .timeline-bar-track {
    flex: 1; height: 18px; background: var(--bg-card);
    border-radius: 4px; overflow: hidden;
  }
  .timeline-bar {
    height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 4px; min-width: 2px;
    display: flex; align-items: center; padding-left: 8px;
  }
  .timeline-bar span {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--bg); font-weight: 600; letter-spacing: 0.5px;
  }
  .timeline-count {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--gray-light); width: 24px; text-align: right; flex-shrink: 0;
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--gray);
    font-family: 'Space Grotesk', sans-serif; font-size: 16px;
  }

  /* ─── FOOTER ─── */
  .bottom-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .bottom-bar-left {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 1px; color: var(--gray);
  }
  .bottom-bar-right {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px;
    font-weight: 600; color: var(--gold);
  }

  /* ─── LIGHT MODE (Print / PDF) ─── */
  @media print {
    :root {
      --bg: #FFFFFF;
      --bg-card: #F5F5F3;
      --bg-card-alt: #EEEEE9;
      --gold: #9A7B32;
      --gold-dim: #B8975A;
      --white: #1A1A1A;
      --gray: #6B6B6B;
      --gray-light: #4A4A4A;
      --red: #A04040;
      --red-dim: #8B3A3A;
      --blue: #2B5F8F;
    }
    body { padding: 36px 44px; }
    body::before { display: none; }
    .timeline-bar span { color: var(--bg-card); }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-tag">Weekly OS Recap</div>
      <h1>Week <span>{{WEEK_NUMBER}}</span></h1>
      <p class="header-sub">{{WEEK_RANGE}} &middot; {{YEAR}}</p>
    </div>
    <div class="header-right">
      <div class="header-stats">
        <div class="header-stat"><strong>{{TOTAL_COMMITS}}</strong> commits</div>
        <div class="header-stat"><strong>{{TOTAL_LINES}}</strong> lines</div>
        <div class="header-stat"><strong>{{TOTAL_FILES}}</strong> files</div>
      </div>
    </div>
  </div>

  <!-- THESIS -->
  <div class="thesis">
    <p>{{HEADLINE}}</p>
  </div>

  <!-- STAT CARDS -->
  <div class="stats-row">
    {{STAT_CARDS}}
    <!-- Example stat card structure:
    <div class="stat-card">
      <div class="stat-num">8</div>
      <div class="stat-desc">New Skills</div>
    </div>
    -->
  </div>

  <!-- CATEGORY CARDS -->
  <div class="section-header">What moved</div>

  {{CATEGORY_CARDS}}
  <!-- Example category card structure:
  <div class="category-card category-card--gold">
    <div class="category-title">New Skills</div>
    <ul class="category-list">
      <li><strong>Cascading Accountability</strong> — AI-native management system for CEO daily briefings with OKR scoring</li>
      <li><strong>Config Sync</strong> — Detects drift between Conductor workspace and CLI checkout</li>
    </ul>
  </div>
  -->

  <!-- TIMELINE -->
  <div class="section-header">Daily activity</div>
  <div class="timeline">
    {{TIMELINE_BARS}}
    <!-- Example timeline row structure:
    <div class="timeline-row">
      <div class="timeline-day">Mon 4/7</div>
      <div class="timeline-bar-track">
        <div class="timeline-bar" style="width: 80%"><span>10</span></div>
      </div>
      <div class="timeline-count">10</div>
    </div>
    -->
  </div>

  <!-- FOOTER -->
  <div class="bottom-bar">
    <div class="bottom-bar-left">Generated {{GENERATED_DATE}} &middot; Brady OS</div>
    <div class="bottom-bar-right">mception.ai</div>
  </div>

</body>
</html>
