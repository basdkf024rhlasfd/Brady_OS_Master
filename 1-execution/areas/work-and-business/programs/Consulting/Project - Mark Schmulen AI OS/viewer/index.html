<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI OS — Mark Schmulen</title>
<meta name="description" content="Private AI operating system project brief for Mark Schmulen — agents, skills, memory, and tool connections.">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; height: 100vh; }

  /* Sidebar */
  nav {
    width: 280px; min-width: 280px; background: #111; border-right: 1px solid #222;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  nav .brand { padding: 20px 16px 16px; border-bottom: 1px solid #222; }
  nav .brand .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 2.2px; color: #555; }
  nav .brand .title { font-size: 18px; font-weight: 600; color: #fff; margin-top: 6px; }
  nav h2 { font-size: 11px; padding: 16px 16px 6px; color: #555; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: color 0.15s; user-select: none; }
  nav h2:hover { color: #888; }
  nav h2 .chevron { display: inline-block; font-size: 8px; margin-right: 4px; transition: transform 0.15s; }
  nav h2 .chevron.collapsed { transform: rotate(-90deg); }
  nav .nav-group.collapsed { display: none; }
  nav .nav-group.collapsed-inner a { display: none; }
  nav a {
    display: block; padding: 8px 16px; color: #aaa; text-decoration: none;
    font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s;
  }
  nav a:hover { background: #1a1a1a; color: #fff; }
  nav a.active { background: #0d0d1a; color: #818cf8; border-left-color: #818cf8; }
  nav .search-box { padding: 12px 16px; }
  nav input {
    width: 100%; padding: 8px 10px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 6px; color: #ccc; font-size: 13px; outline: none;
  }
  nav input:focus { border-color: #818cf8; }
  nav input::placeholder { color: #555; }
  nav a.special-link { display: flex; justify-content: space-between; align-items: center; }

  /* Sub-section headers inside Example Project */
  nav .sub-section-header {
    font-size: 10px; padding: 12px 16px 4px 20px; color: #444; font-weight: 600;
    letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer;
    transition: color 0.15s; user-select: none;
  }
  nav .sub-section-header:hover { color: #666; }
  nav .sub-section-header .chevron { display: inline-block; font-size: 7px; margin-right: 3px; transition: transform 0.15s; }
  nav .sub-section-header .chevron.collapsed { transform: rotate(-90deg); }
  nav .sub-inner-group.collapsed a { display: none; }
  nav .sub-inner-group a { padding-left: 24px; }

  /* Illustrative badge in nav */
  .illustrative-badge {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px;
    color: #b45309; background: #1a1508; border: 1px solid #92400e33;
    padding: 1px 5px; border-radius: 3px; margin-left: 6px; font-weight: 600;
    vertical-align: middle;
  }

  /* Main content */
  main { flex: 1; overflow-y: auto; padding: 0; }
  .content-wrap { max-width: 820px; margin: 0 auto; padding: 40px 48px 80px; }

  /* SOW two-column layout */
  .sow-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; max-width: 1100px; margin: 0 auto; padding: 40px 48px 80px; }
  .sow-content { min-width: 0; }
  .sow-sidebar { position: sticky; top: 40px; align-self: start; }

  /* Feedback form */
  .feedback-form {
    background: #111; border: 1px solid #222; border-radius: 10px; padding: 20px 24px;
  }
  .feedback-form h3 {
    font-size: 14px; color: #fff; margin: 0 0 4px; font-weight: 600;
  }
  .feedback-form .subtitle {
    font-size: 12px; color: #555; margin-bottom: 16px; line-height: 1.5;
  }
  .feedback-form textarea {
    width: 100%; min-height: 160px; padding: 12px 14px; background: #0a0a0a;
    border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 13px;
    outline: none; font-family: inherit; line-height: 1.6; resize: vertical;
    margin-bottom: 12px;
  }
  .feedback-form textarea:focus { border-color: #818cf8; }
  .feedback-form textarea::placeholder { color: #555; }
  .feedback-form .submit-btn {
    width: 100%; background: #818cf8; border: none; color: #000; font-size: 13px;
    font-weight: 600; padding: 10px 20px; border-radius: 20px; cursor: pointer;
    transition: background 0.15s;
  }
  .feedback-form .submit-btn:hover { background: #a5b4fc; }
  .feedback-form .status { font-size: 12px; color: #555; text-align: center; margin-top: 8px; }

  .feedback-history { margin-top: 20px; }
  .feedback-history h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #444; margin-bottom: 10px; }
  .feedback-card {
    background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 12px; color: #888; line-height: 1.5;
  }
  .feedback-card .date { font-size: 10px; color: #444; margin-top: 4px; }

  /* Illustrative banner on content pages */
  .illustrative-banner {
    background: #1a1508; border: 1px solid #92400e44; border-radius: 8px;
    padding: 10px 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px;
  }
  .illustrative-banner .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; flex-shrink: 0;
  }
  .illustrative-banner .text {
    font-size: 12px; color: #b45309; line-height: 1.5;
  }

  /* Markdown styles */
  .sow-content h1, .content-wrap h1 { font-size: 28px; color: #fff; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 1px solid #222; }
  .sow-content h2, .content-wrap h2 { font-size: 22px; color: #c7d2fe; margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #0d0d1a; }
  .sow-content h3, .content-wrap h3 { font-size: 17px; color: #a5b4fc; margin: 28px 0 12px; }
  .sow-content h4, .content-wrap h4 { font-size: 15px; color: #818cf8; margin: 20px 0 8px; }
  .sow-content p, .content-wrap p { line-height: 1.7; margin: 0 0 14px; color: #bbb; font-size: 14.5px; }
  .sow-content ul, .sow-content ol, .content-wrap ul, .content-wrap ol { margin: 0 0 14px; padding-left: 24px; }
  .sow-content li, .content-wrap li { line-height: 1.7; margin: 4px 0; color: #bbb; font-size: 14.5px; }
  .sow-content strong, .content-wrap strong { color: #e0e0e0; }
  .sow-content hr, .content-wrap hr { border: none; border-top: 1px solid #222; margin: 32px 0; }
  .sow-content code, .content-wrap code { background: #0d0d1a; padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #818cf8; }
  .sow-content pre, .content-wrap pre { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 0 0 16px; }
  .sow-content pre code, .content-wrap pre code { background: none; padding: 0; }
  .sow-content blockquote, .content-wrap blockquote { border-left: 3px solid #818cf8; padding: 8px 16px; margin: 0 0 14px; background: #0a0a12; border-radius: 0 6px 6px 0; }
  .sow-content blockquote p, .content-wrap blockquote p { color: #a5b4fc; }
  .sow-content a, .content-wrap a { color: #818cf8; text-decoration: none; }
  .sow-content a:hover, .content-wrap a:hover { text-decoration: underline; }

  /* Tables */
  .sow-content table, .content-wrap table { width: 100%; border-collapse: collapse; margin: 0 0 20px; font-size: 13.5px; }
  .sow-content th, .content-wrap th { text-align: left; padding: 10px 12px; background: #0d0d1a; color: #818cf8; font-weight: 600; border: 1px solid #222; }
  .sow-content td, .content-wrap td { padding: 8px 12px; border: 1px solid #1a1a1a; color: #bbb; }
  .sow-content tr:hover td, .content-wrap tr:hover td { background: #111; }

  /* Search results */
  .search-results { padding: 0 16px; }
  .search-result { padding: 6px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
  .search-result:hover { background: #1a1a1a; }
  .search-result .file { font-size: 11px; color: #818cf8; }
  .search-result .line { font-size: 12px; color: #888; margin-top: 2px; }
  .search-result mark { background: #a5b4fc; color: #000; padding: 0 2px; border-radius: 2px; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #555; font-size: 14px; }

  /* Request Inbox */
  .request-form { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; }
  .request-form label { display: block; margin-bottom: 16px; }
  .request-form .label-text { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; color: #555; margin-bottom: 6px; }
  .request-form select, .request-form textarea {
    width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #333;
    border-radius: 8px; color: #e0e0e0; font-size: 13px; outline: none; font-family: inherit;
  }
  .request-form select:focus, .request-form textarea:focus { border-color: #818cf8; }
  .request-form textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  .request-form .actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .request-form .submit-btn {
    background: #818cf8; border: none; color: #000; font-size: 13px; font-weight: 600;
    padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: background 0.15s;
  }
  .request-form .submit-btn:hover { background: #a5b4fc; }
  .request-form .status { font-size: 13px; color: #555; }
  .prompt-btn {
    display: block; width: 100%; text-align: left; background: #0a0a0a; border: 1px solid #222;
    border-radius: 8px; padding: 10px 14px; color: #bbb; font-size: 13px; line-height: 1.6;
    cursor: pointer; transition: all 0.15s; margin-bottom: 8px; font-family: inherit;
  }
  .prompt-btn:hover { border-color: #818cf8; color: #fff; }
  .request-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; }
  .request-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .request-card .cat { font-size: 13px; font-weight: 600; color: #fff; }
  .request-card .timing { font-size: 11px; color: #555; }
  .request-card .summary { font-size: 13px; color: #888; line-height: 1.6; }
  .request-card .date { font-size: 11px; color: #555; margin-top: 8px; }

  /* Nav separator */
  nav .nav-separator { border: none; border-top: 1px solid #1a1a1a; margin: 8px 16px; }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="eyebrow">AI Operating System</div>
    <div class="title">Mark Schmulen</div>
  </div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search..." />
  </div>
  <div id="search-results" class="search-results" style="display:none"></div>
  <div id="nav-links"></div>
</nav>

<main>
  <div class="content-wrap" id="content">
    <div class="loading">Loading...</div>
  </div>
</main>

<script>

// ─── File definitions ───
const files = [
  { id: 'statement-of-work', file: '../kb/08-statement-of-work.md', label: 'Statement of Work' },
  { id: 'scope-of-work', file: '../kb/07-scope-of-work.md', label: 'Deliverables & Timeline' },
  { id: 'overview', file: '../kb/00-overview.md', label: 'Overview' },
  { id: 'executive-assistant', file: '../kb/01-executive-assistant.md', label: 'Executive Assistant' },
  { id: 'cmo-agent', file: '../kb/02-cmo-agent.md', label: 'CMO Agent' },
  { id: 'cfo-agent', file: '../kb/03-cfo-agent.md', label: 'CFO Agent' },
  { id: 'skills-library', file: '../kb/04-skills-library.md', label: 'Skills Library' },
  { id: 'how-it-works', file: '../kb/05-how-it-works.md', label: 'How It Works' },
  { id: 'timeline', file: '../kb/06-timeline.md', label: 'Timeline & Status' },
];

// IDs that belong to the "Example Project" section
const exampleProjectIds = new Set([
  'overview', 'timeline', 'executive-assistant', 'cmo-agent', 'cfo-agent',
  'skills-library', 'how-it-works', 'requests'
]);

const exampleSubSections = [
  { name: 'Project', ids: ['overview', 'timeline'] },
  { name: 'Agents', ids: ['executive-assistant', 'cmo-agent', 'cfo-agent'] },
  { name: 'System', ids: ['skills-library', 'how-it-works'] },
];

const fileMap = {};
files.forEach(f => fileMap[f.id] = f);

const cache = {};
let currentFile = null;

// ─── Request data ───
const requestCategories = ['New skill', 'Agent change', 'MCP connection', 'Context update', 'Bug fix', 'Question'];
const requestPrompts = [
  'Build a skill that drafts weekly investor updates from my latest metrics.',
  'Connect my CMO agent to my Twitter/X account for content scheduling.',
  'Add a meeting debrief skill that summarizes action items from Granola transcripts.',
  'Update my executive assistant context with my new scheduling preferences.',
  'Create a skill that generates LinkedIn posts from my meeting notes.',
];

// ─── Feedback localStorage ───
const FEEDBACK_STORAGE_KEY = 'mschmulen-sow-feedback';

function getFeedback() {
  try { return JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || '[]'); }
  catch { localStorage.removeItem(FEEDBACK_STORAGE_KEY); return []; }
}

function saveFeedbackEntry(text) {
  const items = getFeedback();
  items.unshift({ text, createdAt: new Date().toLocaleString() });
  localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(items.slice(0, 20)));
}

// ─── Build nav ───
const navLinks = document.getElementById('nav-links');
const collapsedGroups = JSON.parse(localStorage.getItem('mschmulen-navCollapsed') || '{}');

function buildNavSection(name, buildLinks, defaultOpen, extraHTML) {
  const isCollapsed = collapsedGroups.hasOwnProperty(name) ? collapsedGroups[name] : !defaultOpen;

  const h2 = document.createElement('h2');
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  h2.appendChild(chevron);
  h2.appendChild(document.createTextNode(' ' + name));
  if (extraHTML) {
    const span = document.createElement('span');
    span.innerHTML = extraHTML;
    h2.appendChild(span);
  }

  const group = document.createElement('div');
  group.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');

  h2.addEventListener('click', () => {
    const nowCollapsed = group.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[name] = nowCollapsed;
    localStorage.setItem('mschmulen-navCollapsed', JSON.stringify(collapsedGroups));
  });

  navLinks.appendChild(h2);
  buildLinks(group);
  navLinks.appendChild(group);
  return { h2, group, chevron };
}

function buildSubSection(parent, name, ids) {
  const subKey = 'sub-' + name;
  const isCollapsed = collapsedGroups.hasOwnProperty(subKey) ? collapsedGroups[subKey] : false;

  const header = document.createElement('div');
  header.className = 'sub-section-header';
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  header.appendChild(chevron);
  header.appendChild(document.createTextNode(' ' + name));

  const innerGroup = document.createElement('div');
  innerGroup.className = 'sub-inner-group' + (isCollapsed ? ' collapsed' : '');

  header.addEventListener('click', () => {
    const nowCollapsed = innerGroup.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[subKey] = nowCollapsed;
    localStorage.setItem('mschmulen-navCollapsed', JSON.stringify(collapsedGroups));
  });

  ids.forEach(id => {
    const f = fileMap[id];
    if (!f) return;
    const a = document.createElement('a');
    a.href = '#' + f.id;
    a.textContent = f.label;
    a.dataset.id = f.id;
    a.addEventListener('click', e => {
      e.preventDefault();
      loadFile(f.id);
    });
    innerGroup.appendChild(a);
  });

  parent.appendChild(header);
  parent.appendChild(innerGroup);
}

// ─── 1. Scope of Work section ───
buildNavSection('Scope of Work', group => {
  const a = document.createElement('a');
  a.href = '#statement-of-work';
  a.textContent = 'Statement of Work';
  a.dataset.id = 'statement-of-work';
  a.addEventListener('click', e => {
    e.preventDefault();
    renderSOW();
  });
  group.appendChild(a);

  const a2 = document.createElement('a');
  a2.href = '#scope-of-work';
  a2.textContent = 'Deliverables & Timeline';
  a2.dataset.id = 'scope-of-work';
  a2.addEventListener('click', e => {
    e.preventDefault();
    loadFile('scope-of-work');
  });
  group.appendChild(a2);
}, true);

// Separator
navLinks.appendChild(Object.assign(document.createElement('hr'), { className: 'nav-separator' }));

// ─── 2. Example Project section ───
buildNavSection('Example Project', group => {
  // Sub-sections for KB files
  exampleSubSections.forEach(sub => {
    buildSubSection(group, sub.name, sub.ids);
  });

  // Requests link
  const reqHeader = document.createElement('div');
  reqHeader.className = 'sub-section-header';
  reqHeader.style.cursor = 'default';
  reqHeader.textContent = 'Requests';
  group.appendChild(reqHeader);

  const reqGroup = document.createElement('div');
  reqGroup.className = 'sub-inner-group';
  const a = document.createElement('a');
  a.href = '#requests';
  a.className = 'special-link';
  a.dataset.id = 'requests';
  a.innerHTML = '<span>Request Inbox</span>';
  a.addEventListener('click', e => {
    e.preventDefault();
    renderRequestInbox();
  });
  reqGroup.appendChild(a);
  group.appendChild(reqGroup);
}, false, '<span class="illustrative-badge">Illustrative</span>');

// Separator
navLinks.appendChild(Object.assign(document.createElement('hr'), { className: 'nav-separator' }));

// ─── 3. Saved section ───
const savedNavLink = document.createElement('a');
function updateSavedCount() {
  const items = JSON.parse(localStorage.getItem('mschmulen-savedItems') || '[]');
  savedNavLink.innerHTML = `<span>All Saved</span><span class="saved-count">${items.length}</span>`;
}
buildNavSection('Saved', group => {
  savedNavLink.href = '#saved';
  savedNavLink.className = 'special-link';
  savedNavLink.dataset.id = 'saved';
  updateSavedCount();
  savedNavLink.addEventListener('click', e => {
    e.preventDefault();
    renderSaved();
  });
  group.appendChild(savedNavLink);
});

// ─── SOW Render ───
async function renderSOW() {
  currentFile = 'statement-of-work';
  setActiveNav('statement-of-work');
  history.replaceState(null, '', '#statement-of-work');

  const mainEl = document.querySelector('main');
  const md = await fetchFile('statement-of-work');
  const renderedMd = marked.parse(md);
  const feedback = getFeedback();

  const feedbackCards = feedback.length === 0
    ? ''
    : `<div class="feedback-history">
        <h4>Sent</h4>
        ${feedback.map(f => `<div class="feedback-card">${f.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}<div class="date">${f.createdAt}</div></div>`).join('')}
      </div>`;

  mainEl.innerHTML = `
    <div class="sow-layout">
      <div class="sow-content">${renderedMd}</div>
      <div class="sow-sidebar">
        <div class="feedback-form">
          <h3>Notes & Feedback</h3>
          <div class="subtitle">Questions, changes, or comments on the scope. Submitting opens an email to Brady.</div>
          <textarea id="sow-feedback" placeholder="Any questions about the scope? Things you'd add, remove, or change? Write your notes here..."></textarea>
          <button class="submit-btn" id="sow-submit">Send Feedback</button>
          <div class="status" id="sow-status"></div>
        </div>
        ${feedbackCards}
      </div>
    </div>
  `;
  mainEl.scrollTop = 0;

  document.getElementById('sow-submit').addEventListener('click', () => {
    const text = document.getElementById('sow-feedback').value.trim();
    if (!text) return;

    // Save locally
    saveFeedbackEntry(text);

    // Open mailto
    const subject = encodeURIComponent('SOW Feedback — AI OS');
    const body = encodeURIComponent(text);
    window.open(`mailto:brady.smallwood@gmail.com?subject=${subject}&body=${body}`, '_self');

    // UI feedback
    const status = document.getElementById('sow-status');
    status.textContent = 'Email client opened. Feedback saved locally.';
    status.style.color = '#9ece6a';
    document.getElementById('sow-feedback').value = '';
    setTimeout(() => {
      status.textContent = '';
      status.style.color = '';
      renderSOW();
    }, 2000);
  });
}

// ─── Saved items localStorage ───
function getSavedItems() {
  return JSON.parse(localStorage.getItem('mschmulen-savedItems') || '[]');
}

function saveSavedItems(items) {
  localStorage.setItem('mschmulen-savedItems', JSON.stringify(items));
  updateSavedCount();
}

function addSavedItem(item) {
  const items = getSavedItems();
  item.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  item.createdAt = new Date().toISOString();
  items.unshift(item);
  saveSavedItems(items);
  return item;
}

function deleteSavedItem(id) {
  const items = getSavedItems().filter(i => i.id !== id);
  saveSavedItems(items);
}

function updateSavedItem(id, updates) {
  const items = getSavedItems();
  const idx = items.findIndex(i => i.id === id);
  if (idx !== -1) { Object.assign(items[idx], updates); saveSavedItems(items); }
}

function renderSaved() {
  setActiveNav('saved');
  history.replaceState(null, '', '#saved');
  const mainEl = document.querySelector('main');
  const items = getSavedItems();

  const typeOptions = `<option value="note">Note</option><option value="template">Template</option><option value="snippet">Snippet</option>`;

  let html = `
    <h1>Saved</h1>
    <p style="color:#888;font-size:14.5px;line-height:1.7;margin-bottom:24px">
      Save templates, notes, and snippets from across the project brief. Everything is stored locally in your browser.
    </p>
    <div class="save-form" id="save-form">
      <h3>New Item</h3>
      <input type="text" id="save-title" placeholder="Title" />
      <div class="form-row" style="margin-bottom:10px">
        <select id="save-type" style="width:auto;margin-bottom:0">${typeOptions}</select>
      </div>
      <textarea id="save-body" placeholder="Content — paste a snippet, write a note, or draft a template..."></textarea>
      <button id="save-submit">Save</button>
    </div>
  `;

  if (items.length === 0) {
    html += `<div class="saved-empty"><p>No saved items yet.</p><p style="font-size:12px">Use the form above or the save button when viewing pages.</p></div>`;
  } else {
    html += items.map(item => {
      const date = new Date(item.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const sourceLabel = item.source ? ` &middot; from ${item.source}` : '';
      const preview = (item.body || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<div class="saved-item" data-id="${item.id}">
        <div class="saved-item-header">
          <span class="saved-item-title" data-id="${item.id}">${(item.title || 'Untitled').replace(/</g, '&lt;')}</span>
          <div class="saved-item-actions">
            <button class="saved-item-btn expand-btn" data-id="${item.id}">expand</button>
            <button class="saved-item-btn edit-btn" data-id="${item.id}">edit</button>
            <button class="saved-item-btn delete" data-id="${item.id}">delete</button>
          </div>
        </div>
        <div class="saved-item-meta">
          <span class="saved-item-type ${item.type || 'note'}">${item.type || 'note'}</span>
          ${date}${sourceLabel}
        </div>
        <div class="saved-item-preview">${preview}</div>
      </div>`;
    }).join('');
  }

  mainEl.innerHTML = `<div class="content-wrap">${html}</div>`;
  mainEl.scrollTop = 0;

  const content = mainEl.querySelector('.content-wrap');

  document.getElementById('save-submit').addEventListener('click', () => {
    const title = document.getElementById('save-title').value.trim();
    const type = document.getElementById('save-type').value;
    const body = document.getElementById('save-body').value.trim();
    if (!title && !body) return;
    addSavedItem({ title: title || 'Untitled', type, body });
    renderSaved();
  });

  content.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.saved-item');
      const isExpanded = card.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'collapse' : 'expand';
    });
  });

  content.querySelectorAll('.delete').forEach(btn => {
    btn.addEventListener('click', () => {
      deleteSavedItem(btn.dataset.id);
      renderSaved();
    });
  });

  content.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const item = getSavedItems().find(i => i.id === id);
      if (!item) return;
      const card = btn.closest('.saved-item');
      card.innerHTML = `
        <div class="save-form" style="margin:0;border:none;padding:0;background:none">
          <input type="text" value="${(item.title || '').replace(/"/g, '&quot;')}" class="edit-title" />
          <div class="form-row" style="margin-bottom:10px">
            <select class="edit-type" style="width:auto;margin-bottom:0">
              <option value="note" ${item.type === 'note' ? 'selected' : ''}>Note</option>
              <option value="template" ${item.type === 'template' ? 'selected' : ''}>Template</option>
              <option value="snippet" ${item.type === 'snippet' ? 'selected' : ''}>Snippet</option>
            </select>
          </div>
          <textarea class="edit-body">${(item.body || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          <div class="form-row">
            <button class="edit-save">Save</button>
            <button class="cancel-btn edit-cancel">Cancel</button>
          </div>
        </div>
      `;
      card.querySelector('.edit-save').addEventListener('click', () => {
        updateSavedItem(id, {
          title: card.querySelector('.edit-title').value.trim() || 'Untitled',
          type: card.querySelector('.edit-type').value,
          body: card.querySelector('.edit-body').value.trim(),
        });
        renderSaved();
      });
      card.querySelector('.edit-cancel').addEventListener('click', () => renderSaved());
    });
  });
}

// ─── Request Inbox ───
const REQUEST_STORAGE_KEY = 'mschmulen-request-inbox';

function getRequests() {
  try { return JSON.parse(localStorage.getItem(REQUEST_STORAGE_KEY) || '[]'); }
  catch { localStorage.removeItem(REQUEST_STORAGE_KEY); return []; }
}

function saveRequests(items) {
  localStorage.setItem(REQUEST_STORAGE_KEY, JSON.stringify(items));
}

function renderRequestInbox() {
  setActiveNav('requests');
  history.replaceState(null, '', '#requests');
  const mainEl = document.querySelector('main');
  const saved = getRequests();

  const categoryOptions = requestCategories.map(c => `<option value="${c}">${c}</option>`).join('');
  const promptButtons = requestPrompts.map(p =>
    `<button class="prompt-btn" data-prompt="${p.replace(/"/g, '&quot;')}">${p}</button>`
  ).join('');

  const requestCards = saved.length === 0
    ? '<div style="border:1px dashed #222;border-radius:8px;padding:24px;text-align:center;color:#555;font-size:13px;">No requests saved yet in this browser.</div>'
    : saved.map(item => `<div class="request-card">
        <div class="top"><span class="cat">${item.category}</span><span class="timing">${item.urgency}</span></div>
        <div class="summary">${item.summary.replace(/</g, '&lt;')}</div>
        <div class="date">${item.createdAt}</div>
      </div>`).join('');

  mainEl.innerHTML = `
    <div class="content-wrap">
      <div class="illustrative-banner">
        <div class="dot"></div>
        <div class="text">Illustrative — based on initial conversation. This will be refined as we align on the scope of work.</div>
      </div>
      <h1>Request Inbox</h1>
      <p style="color:#888;font-size:14.5px;line-height:1.7;margin-bottom:24px">
        Request new skills, agent changes, MCP connections, or context updates. Requests are reviewed within one business day.
      </p>

      <div style="display:grid;gap:24px;grid-template-columns:1.1fr 0.9fr;">
        <div>
          <div class="request-form">
            <h3 style="font-size:16px;color:#fff;margin:0 0 16px;">New request</h3>
            <div style="display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px;">
              <label>
                <span class="label-text">Category</span>
                <select id="req-category">${categoryOptions}</select>
              </label>
              <label>
                <span class="label-text">Timing</span>
                <select id="req-timing">
                  <option>Today</option>
                  <option selected>This week</option>
                  <option>Next check-in</option>
                </select>
              </label>
            </div>
            <label>
              <span class="label-text">Request</span>
              <textarea id="req-summary" placeholder="Example: Build a skill that generates weekly investor updates from my latest QuickBooks data."></textarea>
            </label>
            <div class="actions">
              <button class="submit-btn" id="req-submit">Save request</button>
              <span class="status" id="req-status">Requests are reviewed within one business day.</span>
            </div>
          </div>
        </div>
        <div>
          <div style="margin-bottom:24px;">
            <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#555;margin-bottom:12px;">Suggested asks</h3>
            ${promptButtons}
          </div>
          <div>
            <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#555;margin-bottom:12px;">Recent saved requests</h3>
            ${requestCards}
          </div>
        </div>
      </div>
    </div>
  `;
  mainEl.scrollTop = 0;

  const content = mainEl.querySelector('.content-wrap');

  content.querySelectorAll('.prompt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('req-summary').value = btn.dataset.prompt;
    });
  });

  document.getElementById('req-submit').addEventListener('click', () => {
    const summary = document.getElementById('req-summary').value.trim();
    if (!summary) return;
    const entry = {
      id: crypto.randomUUID(),
      category: document.getElementById('req-category').value,
      summary,
      urgency: document.getElementById('req-timing').value,
      createdAt: new Date().toLocaleString(),
    };
    const next = [entry, ...getRequests()].slice(0, 6);
    saveRequests(next);
    const status = document.getElementById('req-status');
    status.textContent = 'Request saved.';
    status.style.color = '#9ece6a';
    setTimeout(() => {
      status.textContent = 'Requests are reviewed within one business day.';
      status.style.color = '#555';
    }, 1800);
    renderRequestInbox();
  });
}

// ─── Save page button on content views ───
function addSaveButton(pageTitle, sourceLabel) {
  const content = document.getElementById('content');
  if (!content) return;
  const h1 = content.querySelector('h1');
  if (!h1) return;
  const btn = document.createElement('button');
  btn.className = 'save-page-btn';
  btn.innerHTML = '+ Save snippet';
  btn.addEventListener('click', () => {
    const selection = window.getSelection().toString().trim();
    if (selection) {
      addSavedItem({ title: pageTitle + ' — snippet', type: 'snippet', body: selection, source: sourceLabel || pageTitle });
      btn.textContent = 'Saved!';
      btn.style.borderColor = '#9ece6a';
      btn.style.color = '#9ece6a';
      setTimeout(() => { btn.innerHTML = '+ Save snippet'; btn.style.borderColor = ''; btn.style.color = ''; }, 1500);
    } else {
      const form = document.createElement('div');
      form.className = 'save-form';
      form.style.marginTop = '16px';
      form.innerHTML = `
        <h3>Save from "${pageTitle}"</h3>
        <input type="text" placeholder="Title" value="${pageTitle.replace(/"/g, '&quot;')}" class="inline-save-title" />
        <textarea placeholder="Paste or type content to save..." class="inline-save-body"></textarea>
        <div class="form-row">
          <select class="inline-save-type" style="width:auto;margin-bottom:0">
            <option value="snippet">Snippet</option>
            <option value="note">Note</option>
            <option value="template">Template</option>
          </select>
          <button class="inline-save-submit">Save</button>
          <button class="cancel-btn inline-save-cancel">Cancel</button>
        </div>
      `;
      h1.after(form);
      btn.style.display = 'none';
      form.querySelector('.inline-save-submit').addEventListener('click', () => {
        const t = form.querySelector('.inline-save-title').value.trim() || pageTitle;
        const b = form.querySelector('.inline-save-body').value.trim();
        if (!b) return;
        addSavedItem({ title: t, type: form.querySelector('.inline-save-type').value, body: b, source: sourceLabel || pageTitle });
        form.remove();
        btn.style.display = '';
        btn.textContent = 'Saved!';
        btn.style.borderColor = '#9ece6a';
        btn.style.color = '#9ece6a';
        setTimeout(() => { btn.innerHTML = '+ Save snippet'; btn.style.borderColor = ''; btn.style.color = ''; }, 1500);
      });
      form.querySelector('.inline-save-cancel').addEventListener('click', () => {
        form.remove();
        btn.style.display = '';
      });
    }
  });
  h1.appendChild(btn);
}

// ─── File loading ───
async function fetchFile(id) {
  if (cache[id]) return cache[id];
  const entry = fileMap[id];
  if (!entry) return '';
  const res = await fetch(entry.file);
  const text = await res.text();
  cache[id] = text;
  return text;
}

async function loadFile(id) {
  currentFile = id;
  const mainEl = document.querySelector('main');
  mainEl.innerHTML = '<div class="content-wrap" id="content"><div class="loading">Loading...</div></div>';
  const content = document.getElementById('content');

  setActiveNav(id);

  const md = await fetchFile(id);

  // Add illustrative banner for example project pages
  let bannerHTML = '';
  if (exampleProjectIds.has(id)) {
    bannerHTML = `<div class="illustrative-banner">
      <div class="dot"></div>
      <div class="text">Illustrative — based on initial conversation. This will be refined as we align on the scope of work.</div>
    </div>`;
  }

  content.innerHTML = bannerHTML + marked.parse(md);

  content.querySelectorAll('code').forEach(code => {
    const text = code.textContent.trim();
    const match = text.match(/^kb\/(.+\.md)$/);
    if (!match) return;
    const entry = files.find(f => f.file.endsWith('kb/' + match[1]));
    if (!entry) return;
    const link = document.createElement('a');
    link.href = '#' + entry.id;
    link.style.cssText = 'color:#818cf8;cursor:pointer;text-decoration:none;';
    link.textContent = entry.label;
    link.addEventListener('click', e => { e.preventDefault(); loadFile(entry.id); });
    code.replaceWith(link);
  });

  window.scrollTo(0, 0);
  mainEl.scrollTop = 0;

  history.replaceState(null, '', '#' + id);

  const fileEntry = fileMap[id];
}

async function loadFileWithAnchor(id, anchorText) {
  await loadFile(id);
  if (anchorText) {
    setTimeout(() => {
      const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4');
      for (const h of headings) {
        if (h.textContent.includes(anchorText)) {
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          h.style.background = '#0d0d1a';
          h.style.borderRadius = '4px';
          h.style.padding = '4px 8px';
          setTimeout(() => { h.style.background = ''; h.style.padding = ''; }, 2000);
          break;
        }
      }
    }, 50);
  }
}

function setActiveNav(id) {
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
}

// ─── Search ───
let searchTimeout;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  const query = this.value.trim().toLowerCase();
  const resultsDiv = document.getElementById('search-results');
  const navDiv = document.getElementById('nav-links');

  if (!query) {
    resultsDiv.style.display = 'none';
    navDiv.style.display = '';
    return;
  }

  searchTimeout = setTimeout(async () => {
    await Promise.all(files.map(f => fetchFile(f.id)));

    const results = [];
    for (const f of files) {
      const text = cache[f.id] || '';
      const lines = text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().includes(query)) {
          const snippet = lines[i].trim().substring(0, 120);
          const highlighted = snippet.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), match => `<mark>${match}</mark>`);
          results.push({ fileId: f.id, label: f.label, line: highlighted });
          if (results.length >= 30) break;
        }
      }
      if (results.length >= 30) break;
    }

    navDiv.style.display = 'none';
    resultsDiv.style.display = '';

    if (results.length === 0) {
      resultsDiv.innerHTML = '<div style="padding:12px 0;color:#555;font-size:12px;">No results found.</div>';
    } else {
      resultsDiv.innerHTML = results.map(r =>
        `<div class="search-result" data-id="${r.fileId}">
          <div class="file">${r.label}</div>
          <div class="line">${r.line}</div>
        </div>`
      ).join('');

      resultsDiv.querySelectorAll('.search-result').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById('search').value = '';
          resultsDiv.style.display = 'none';
          navDiv.style.display = '';
          if (el.dataset.id === 'statement-of-work') {
            renderSOW();
          } else {
            loadFile(el.dataset.id);
          }
        });
      });
    }
  }, 200);
});

// ─── Hash routing ───
function handleHash() {
  const hash = location.hash.replace('#', '');
  if (!hash || hash === 'statement-of-work') {
    renderSOW();
    return;
  }
  if (hash === 'requests') { renderRequestInbox(); return; }

  if (fileMap[hash]) { loadFile(hash); return; }
  renderSOW();
}

window.addEventListener('hashchange', handleHash);
handleHash();
