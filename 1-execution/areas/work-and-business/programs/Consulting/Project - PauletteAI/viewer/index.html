<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAHS — Your Files</title>
<meta name="description" content="Danville Area Humane Society — file portal.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; height: 100vh; }

  /* Sidebar */
  nav {
    width: 280px; min-width: 280px; background: #111; border-right: 1px solid #222;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  nav .brand { padding: 20px 16px 16px; border-bottom: 1px solid #222; }
  nav .brand .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 2.2px; color: #555; }
  nav .brand .title { font-size: 18px; font-weight: 600; color: #fff; margin-top: 6px; }
  nav a {
    display: block; padding: 10px 16px; color: #aaa; text-decoration: none;
    font-size: 14px; border-left: 3px solid transparent; transition: all 0.15s;
  }
  nav a:hover { background: #1a1a1a; color: #fff; }
  nav a.active { background: #1a1400; color: #f59e0b; border-left-color: #f59e0b; }
  nav .nav-links { padding-top: 8px; }

  /* Main content */
  main { flex: 1; overflow-y: auto; padding: 0; }
  .content-wrap { max-width: 820px; margin: 0 auto; padding: 40px 48px 80px; }

  /* Typography */
  .content-wrap h1 { font-size: 30px; color: #fff; margin: 0 0 16px; }
  .content-wrap .subtitle { font-size: 16px; color: #888; line-height: 1.7; margin-bottom: 32px; }
  .content-wrap h2 { font-size: 22px; color: #fde68a; margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #1a1400; }
  .content-wrap p { line-height: 1.7; margin: 0 0 14px; color: #bbb; font-size: 15px; }
  .content-wrap hr { border: none; border-top: 1px solid #222; margin: 32px 0; }

  /* Section card */
  .section-card {
    background: #111; border: 1px solid #222; border-radius: 10px;
    padding: 24px 28px; margin-bottom: 20px; transition: border-color 0.15s;
  }
  .section-card:hover { border-color: #333; }
  .section-card h2 {
    font-size: 20px; color: #fff; margin: 0 0 8px; padding: 0; border: none;
  }
  .section-card p { font-size: 15px; color: #999; margin: 0 0 16px; line-height: 1.6; }
  .section-card .open-btn {
    display: inline-block; background: #1a1400; border: 1px solid #f59e0b; color: #f59e0b;
    font-size: 14px; font-weight: 600; padding: 10px 24px; border-radius: 8px;
    text-decoration: none; transition: all 0.15s;
  }
  .section-card .open-btn:hover { background: #f59e0b; color: #0a0a0a; }

  /* Drive embed */
  .drive-embed {
    width: 100%; border: 1px solid #333; border-radius: 10px; overflow: hidden;
    background: #fff; margin-top: 20px;
  }
  .drive-embed iframe {
    width: 100%; height: calc(100vh - 200px); min-height: 400px;
    border: none; display: block;
  }

  /* Welcome quick links */
  .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .quick-link {
    display: block; background: #111; border: 1px solid #222; border-radius: 8px;
    padding: 16px 20px; text-decoration: none; transition: all 0.15s;
  }
  .quick-link:hover { border-color: #f59e0b; }
  .quick-link .ql-label { font-size: 15px; color: #fff; font-weight: 600; margin-bottom: 4px; }
  .quick-link .ql-desc { font-size: 13px; color: #777; }

  /* Mobile nav */
  .mobile-header { display: none; }
  .mobile-dropdown { display: none; }

  @media (max-width: 768px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    nav { display: none !important; }
    .mobile-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #111; border-bottom: 1px solid #222;
      padding: 14px 16px; position: sticky; top: 0; z-index: 50;
    }
    .mobile-header .brand-text { font-size: 16px; font-weight: 600; color: #fff; }
    .mobile-header .eyebrow-text { font-size: 9px; text-transform: uppercase; letter-spacing: 1.8px; color: #555; }
    .mobile-header button {
      background: none; border: 1px solid #333; color: #aaa;
      padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .mobile-header button:hover { border-color: #f59e0b; color: #f59e0b; }
    .mobile-dropdown {
      background: #111; border-bottom: 1px solid #222;
      padding: 8px 0; position: sticky; top: 53px; z-index: 49;
    }
    .mobile-dropdown.open { display: block; }
    .mobile-dropdown a {
      display: block; padding: 12px 16px; color: #aaa;
      text-decoration: none; font-size: 15px; border-left: 3px solid transparent;
    }
    .mobile-dropdown a:hover { color: #fff; background: #1a1a1a; }
    .mobile-dropdown a.active { color: #f59e0b; background: #1a1400; border-left-color: #f59e0b; }
    main { overflow-y: visible; }
    .content-wrap { padding: 24px 16px 60px; }
    .quick-links { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="eyebrow">Your Files</div>
    <div class="title">DAHS</div>
  </div>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="mobile-header">
  <div>
    <div class="eyebrow-text">Your Files</div>
    <div class="brand-text">DAHS</div>
  </div>
  <button onclick="toggleMobileNav()">Menu &#x25BE;</button>
</div>
<div class="mobile-dropdown" id="mobileDropdown"></div>

<main>
  <div class="content-wrap" id="content"></div>
</main>

<script>
// ─── Section definitions ───
const sections = [
  {
    id: 'welcome',
    label: 'Welcome',
    description: '',
    driveUrl: ''
  },
  {
    id: 'services-plan',
    label: 'Services Plan',
    description: 'Overview of our work together — what we set out to do and where things stand.',
    driveUrl: 'https://drive.google.com/drive/folders/1Dd1MIKGa1B8tMHIzHM7y_1r5-jbBjepR'
  },
  {
    id: 'cleaning',
    label: 'Cleaning & Disinfection',
    description: 'Protocols, products, dilution rates, and contact times — everything your team needs for daily cleaning.',
    driveUrl: 'https://drive.google.com/drive/folders/1mztP0dfr-DvtPXHxMBH-KkQjhzSXzaL0'
  },
  {
    id: 'wall-cards',
    label: 'Wall Cards',
    description: 'Printable quick-reference cards to post around the shelter — cleaning steps, handling reminders, and more.',
    driveUrl: 'https://drive.google.com/drive/folders/1B7_Aa6bw60irNQ0sSe9X9NBmtZs2zKS9'
  },
  {
    id: 'employee-manual',
    label: 'Employee Manual',
    description: 'The employee policy manual — current draft, previous versions, and gap analysis documents.',
    driveUrl: 'https://drive.google.com/drive/folders/1cIFtEBhrqdjkerzo-5fA1hdkdZzl302p'
  },
  {
    id: 'talking-points',
    label: 'Talking Points',
    description: 'Talking points, narrative framing, and prepared responses — for media, board meetings, and public conversations.',
    driveUrl: 'https://drive.google.com/drive/folders/1JeI_ve7AkLASoIWLUkVHRcViJ1w2CIaN'
  },
  {
    id: 'fundraising',
    label: 'Fundraising',
    description: 'Fundraising appeals, donor communications, and campaign materials.',
    driveUrl: 'https://drive.google.com/drive/folders/1jF2Ec6U9a6vBRuFTKnfxigHm2qem9Ieq'
  },
  {
    id: 'transfer-partners',
    label: 'Transfer Partners',
    description: 'Transfer partner outreach, agreements, and coordination documents.',
    driveUrl: 'https://drive.google.com/drive/folders/1PWbSkXBfKJkg1Kd437WQo1gwjS3_8QwG'
  },
  {
    id: 'strategic-plan',
    label: 'Strategic Plan',
    description: 'Long-term planning documents — where DAHS is headed and how to get there.',
    driveUrl: 'https://drive.google.com/drive/folders/1kayBwYYdhlDoCkHpXbFrHZTwbb_ohqJl'
  },
  {
    id: 'pauletteai',
    label: 'PauletteAI',
    description: 'Information about your AI assistant — what it can do and how to use it.',
    driveUrl: 'https://drive.google.com/drive/folders/1kQRu_t0eCsmIoSKITrm-OOCoIM8SbL7q'
  },
  {
    id: 'social-media',
    label: 'Social Media',
    description: 'Post templates, formatting guides, and hashtag sets for Facebook and Instagram.',
    driveUrl: 'https://drive.google.com/drive/folders/1jJKa-oWluCA6W9V4JN-mjbClJvLeJBDN'
  },
  {
    id: 'grants',
    label: 'Grants',
    description: 'Grant applications, funder information, and submission tracking.',
    driveUrl: 'https://drive.google.com/drive/folders/1ZNMepjLjhM1pSrUeRufo-xlZ3k8DeLjZ'
  }
];

const sectionMap = {};
sections.forEach(s => sectionMap[s.id] = s);

// ─── Build sidebar nav ───
const navEl = document.getElementById('nav-links');
sections.forEach(s => {
  const a = document.createElement('a');
  a.href = '#' + s.id;
  a.textContent = s.label;
  a.dataset.id = s.id;
  a.addEventListener('click', e => {
    e.preventDefault();
    showSection(s.id);
  });
  navEl.appendChild(a);
});

// ─── Render sections ───
function setActiveNav(id) {
  document.querySelectorAll('nav a, .mobile-dropdown a').forEach(a =>
    a.classList.toggle('active', a.dataset.id === id)
  );
}

function showSection(id) {
  setActiveNav(id);
  history.replaceState(null, '', '#' + id);
  const content = document.getElementById('content');
  document.querySelector('main').scrollTop = 0;

  if (id === 'welcome') {
    renderWelcome(content);
    return;
  }

  const s = sectionMap[id];
  if (!s) return;

  const folderId = s.driveUrl.split('/folders/')[1];
  content.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
      <div>
        <h1 style="font-size:28px;color:#fff;margin-bottom:8px;">${s.label}</h1>
        <p style="font-size:15px;color:#999;line-height:1.7;margin:0;">${s.description}</p>
      </div>
      <a class="open-btn" href="${s.driveUrl}" target="_top" rel="noopener" style="flex-shrink:0;margin-left:20px;margin-top:4px;">
        Open in Drive
      </a>
    </div>
    <div class="drive-embed">
      <iframe
        src="https://drive.google.com/embeddedfolderview?id=${folderId}#list"
        sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-top-navigation"
        loading="lazy"
      ></iframe>
    </div>
  `;
}

function renderWelcome(el) {
  const quickLinkSections = ['employee-manual', 'talking-points', 'cleaning', 'wall-cards'];
  const quickLinksHtml = quickLinkSections.map(id => {
    const s = sectionMap[id];
    return `<a class="quick-link" href="#${s.id}" onclick="event.preventDefault(); showSection('${s.id}')">
      <div class="ql-label">${s.label}</div>
      <div class="ql-desc">${s.description.split(' — ')[0]}</div>
    </a>`;
  }).join('');

  el.innerHTML = `
    <h1>Welcome, Paulette</h1>
    <p class="subtitle">
      This is where all your files live. Pick a section on the left (or below on your phone)
      to find what you need. Each section shows your Google Drive folder right here — you can
      click any file to view, download, or print it.
    </p>
    <hr>
    <h2 style="font-size:18px;color:#fde68a;margin:0 0 16px;padding:0;border:none;">Quick Links</h2>
    <div class="quick-links">${quickLinksHtml}</div>
  `;
}

// ─── Mobile nav ───
function buildMobileDropdown() {
  const dd = document.getElementById('mobileDropdown');
  dd.innerHTML = sections.map(s =>
    `<a href="#${s.id}" data-id="${s.id}" onclick="event.preventDefault(); document.getElementById('mobileDropdown').classList.remove('open'); showSection('${s.id}');">${s.label}</a>`
  ).join('');
}

function toggleMobileNav() {
  document.getElementById('mobileDropdown').classList.toggle('open');
}

buildMobileDropdown();

// ─── Hash routing ───
function handleHash() {
  const hash = location.hash.slice(1) || 'welcome';
  if (sectionMap[hash]) { showSection(hash); return; }
  showSection('welcome');
}

window.addEventListener('hashchange', handleHash);
handleHash();
</script>
</body>
</html>
