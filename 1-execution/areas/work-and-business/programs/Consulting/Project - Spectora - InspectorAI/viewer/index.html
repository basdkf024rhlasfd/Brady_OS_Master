<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baden Bagley — Client Files</title>
<meta name="description" content="Private client file portal for Baden Bagley.">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; height: 100vh; }

  /* Sidebar */
  nav {
    width: 280px; min-width: 280px; background: #111; border-right: 1px solid #222;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  nav .brand { padding: 20px 16px 16px; border-bottom: 1px solid #222; }
  nav .brand .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 2.2px; color: #555; }
  nav .brand .title { font-size: 18px; font-weight: 600; color: #fff; margin-top: 6px; }
  nav h2 { font-size: 11px; padding: 16px 16px 6px; color: #555; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: color 0.15s; user-select: none; }
  nav h2:hover { color: #888; }
  nav h2 .chevron { display: inline-block; font-size: 8px; margin-right: 4px; transition: transform 0.15s; }
  nav h2 .chevron.collapsed { transform: rotate(-90deg); }
  nav .nav-group.collapsed a { display: none; }
  nav a {
    display: block; padding: 8px 16px; color: #aaa; text-decoration: none;
    font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s;
  }
  nav a:hover { background: #1a1a1a; color: #fff; }
  nav a.active { background: #0a1a2a; color: #38bdf8; border-left-color: #38bdf8; }
  nav .search-box { padding: 12px 16px; }
  nav input {
    width: 100%; padding: 8px 10px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 6px; color: #ccc; font-size: 13px; outline: none;
  }
  nav input:focus { border-color: #38bdf8; }
  nav input::placeholder { color: #555; }
  nav a .saved-count { font-size: 10px; opacity: 0.5; }
  nav a.special-link { display: flex; justify-content: space-between; align-items: center; }

  /* Main content */
  main { flex: 1; overflow-y: auto; padding: 0; }
  .content-wrap { max-width: 820px; margin: 0 auto; padding: 40px 48px 80px; }

  /* Markdown styles */
  .content-wrap h1 { font-size: 28px; color: #fff; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 1px solid #222; }
  .content-wrap h2 { font-size: 22px; color: #bae6fd; margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #0a1a2a; }
  .content-wrap h3 { font-size: 17px; color: #7dd3fc; margin: 28px 0 12px; }
  .content-wrap h4 { font-size: 15px; color: #38bdf8; margin: 20px 0 8px; }
  .content-wrap p { line-height: 1.7; margin: 0 0 14px; color: #bbb; font-size: 14.5px; }
  .content-wrap ul, .content-wrap ol { margin: 0 0 14px; padding-left: 24px; }
  .content-wrap li { line-height: 1.7; margin: 4px 0; color: #bbb; font-size: 14.5px; }
  .content-wrap strong { color: #e0e0e0; }
  .content-wrap hr { border: none; border-top: 1px solid #222; margin: 32px 0; }
  .content-wrap code { background: #0a1a2a; padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #38bdf8; }
  .content-wrap pre { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 0 0 16px; }
  .content-wrap pre code { background: none; padding: 0; }
  .content-wrap blockquote { border-left: 3px solid #38bdf8; padding: 8px 16px; margin: 0 0 14px; background: #050d1a; border-radius: 0 6px 6px 0; }
  .content-wrap blockquote p { color: #7dd3fc; }
  .content-wrap a { color: #38bdf8; text-decoration: none; }
  .content-wrap a:hover { text-decoration: underline; }

  /* Tables */
  .content-wrap table { width: 100%; border-collapse: collapse; margin: 0 0 20px; font-size: 13.5px; }
  .content-wrap th { text-align: left; padding: 10px 12px; background: #0a1a2a; color: #38bdf8; font-weight: 600; border: 1px solid #222; }
  .content-wrap td { padding: 8px 12px; border: 1px solid #1a1a1a; color: #bbb; }
  .content-wrap tr:hover td { background: #111; }

  /* Search results */
  .search-results { padding: 0 16px; }
  .search-result { padding: 6px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
  .search-result:hover { background: #1a1a1a; }
  .search-result .file { font-size: 11px; color: #38bdf8; }
  .search-result .line { font-size: 12px; color: #888; margin-top: 2px; }
  .search-result mark { background: #7dd3fc; color: #000; padding: 0 2px; border-radius: 2px; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #555; font-size: 14px; }

  /* Saved items */
  .saved-item { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; position: relative; }
  .saved-item:hover { border-color: #333; }
  .saved-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 12px; }
  .saved-item-title { font-size: 15px; color: #e0e0e0; font-weight: 600; cursor: pointer; flex: 1; min-width: 0; }
  .saved-item-title:hover { color: #38bdf8; }
  .saved-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .saved-item-btn { background: none; border: 1px solid #333; color: #888; font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .saved-item-btn:hover { border-color: #555; color: #ccc; }
  .saved-item-btn.delete:hover { border-color: #f7768e; color: #f7768e; }
  .saved-item-meta { font-size: 11px; color: #555; margin-bottom: 8px; }
  .saved-item-type { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 3px; font-weight: 600; margin-right: 8px; }
  .saved-item-type.snippet { background: #0a1a2a; color: #38bdf8; }
  .saved-item-type.note { background: #1a2a1a; color: #9ece6a; }
  .saved-item-preview { font-size: 13px; color: #888; line-height: 1.6; white-space: pre-wrap; max-height: 80px; overflow: hidden; }
  .saved-item.expanded .saved-item-preview { max-height: none; }
  .saved-empty { color: #555; font-size: 14px; text-align: center; padding: 48px 24px; }

  .save-form { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; }
  .save-form h3 { font-size: 14px; color: #7dd3fc; margin: 0 0 12px; }
  .save-form input, .save-form textarea, .save-form select {
    width: 100%; padding: 8px 10px; background: #0a0a0a; border: 1px solid #333;
    border-radius: 6px; color: #ccc; font-size: 13px; outline: none; margin-bottom: 10px;
    font-family: inherit;
  }
  .save-form input:focus, .save-form textarea:focus { border-color: #38bdf8; }
  .save-form textarea { min-height: 100px; resize: vertical; }
  .save-form .form-row { display: flex; gap: 10px; align-items: center; }
  .save-form button {
    background: #0a1a2a; border: 1px solid #38bdf8; color: #38bdf8; font-size: 13px;
    padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.15s;
  }
  .save-form button:hover { background: #38bdf8; color: #0a0a0a; }
  .save-form button.cancel-btn { border-color: #555; color: #888; background: none; }
  .save-form button.cancel-btn:hover { border-color: #888; color: #ccc; background: #1a1a1a; }

  /* Save page button */
  .save-page-btn {
    display: inline-flex; align-items: center; gap: 6px; background: #1a1a1a; border: 1px solid #333;
    color: #888; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; float: right; margin-top: -4px;
  }
  .save-page-btn:hover { border-color: #38bdf8; color: #38bdf8; }

  /* Mobile nav */
  .mobile-header { display: none; }
  .mobile-dropdown { display: none; }

  @media (max-width: 768px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    nav { display: none !important; }
    .mobile-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #111; border-bottom: 1px solid #222;
      padding: 12px 16px; position: sticky; top: 0; z-index: 50;
    }
    .mobile-header .brand-text { font-size: 15px; font-weight: 600; color: #fff; }
    .mobile-header .eyebrow-text { font-size: 9px; text-transform: uppercase; letter-spacing: 1.8px; color: #555; }
    .mobile-header button {
      background: none; border: 1px solid #333; color: #aaa;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .mobile-header button:hover { border-color: #38bdf8; color: #38bdf8; }
    .mobile-dropdown {
      background: #111; border-bottom: 1px solid #222;
      padding: 8px 0; position: sticky; top: 49px; z-index: 49;
    }
    .mobile-dropdown.open { display: block; }
    .mobile-dropdown a {
      display: block; padding: 10px 16px; color: #aaa;
      text-decoration: none; font-size: 14px; border-left: 3px solid transparent;
    }
    .mobile-dropdown a:hover { color: #fff; background: #1a1a1a; }
    .mobile-dropdown a.active { color: #38bdf8; background: #0a1a2a; border-left-color: #38bdf8; }
    .mobile-dropdown .section-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
      color: #555; padding: 12px 16px 4px; font-weight: 600;
    }
    main { overflow-y: visible; }
    .content-wrap { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="eyebrow">Client Files</div>
    <div class="title">Baden Bagley</div>
  </div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search files..." />
  </div>
  <div id="search-results" class="search-results" style="display:none"></div>
  <div id="nav-links"></div>
</nav>

<div class="mobile-header">
  <div>
    <div class="eyebrow-text">Client Files</div>
    <div class="brand-text">Baden Bagley</div>
  </div>
  <button onclick="toggleMobileNav()">Menu &#x25BE;</button>
</div>
<div class="mobile-dropdown" id="mobileDropdown"></div>

<main>
  <div class="content-wrap" id="content">
    <div class="loading">Loading...</div>
  </div>
</main>

<script>
// ─── File definitions ───
const files = [
  { id: 'welcome', file: '../kb/00-welcome.md', label: 'Welcome' },
];

const sections = [
  { name: 'Files', ids: ['welcome'], defaultOpen: true },
];

const fileMap = {};
files.forEach(f => fileMap[f.id] = f);

const cache = {};
let currentFile = null;

// ─── Build nav ───
const navLinks = document.getElementById('nav-links');
const STORAGE_PREFIX = 'baden-bagley-';
const collapsedGroups = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'navCollapsed') || '{}');

function buildNavSection(name, buildLinks, defaultOpen) {
  const isCollapsed = collapsedGroups.hasOwnProperty(name) ? collapsedGroups[name] : !defaultOpen;

  const h2 = document.createElement('h2');
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  h2.appendChild(chevron);
  h2.appendChild(document.createTextNode(' ' + name));

  const group = document.createElement('div');
  group.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');

  h2.addEventListener('click', () => {
    const nowCollapsed = group.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[name] = nowCollapsed;
    localStorage.setItem(STORAGE_PREFIX + 'navCollapsed', JSON.stringify(collapsedGroups));
  });

  navLinks.appendChild(h2);
  buildLinks(group);
  navLinks.appendChild(group);
  return { h2, group, chevron };
}

// KB sections
sections.forEach(section => {
  buildNavSection(section.name, group => {
    section.ids.forEach(id => {
      const f = fileMap[id];
      if (!f) return;
      const a = document.createElement('a');
      a.href = '#' + f.id;
      a.textContent = f.label;
      a.dataset.id = f.id;
      a.addEventListener('click', e => {
        e.preventDefault();
        loadFile(f.id);
      });
      group.appendChild(a);
    });
  }, section.defaultOpen);
});

// Saved section
const savedNavLink = document.createElement('a');
function updateSavedCount() {
  const items = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'savedItems') || '[]');
  savedNavLink.innerHTML = `<span>All Saved</span><span class="saved-count">${items.length}</span>`;
}
buildNavSection('Saved', group => {
  savedNavLink.href = '#saved';
  savedNavLink.className = 'special-link';
  savedNavLink.dataset.id = 'saved';
  updateSavedCount();
  savedNavLink.addEventListener('click', e => {
    e.preventDefault();
    renderSaved();
  });
  group.appendChild(savedNavLink);
});

// ─── Saved items localStorage ───
function getSavedItems() {
  return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'savedItems') || '[]');
}

function saveSavedItems(items) {
  localStorage.setItem(STORAGE_PREFIX + 'savedItems', JSON.stringify(items));
  updateSavedCount();
}

function addSavedItem(item) {
  const items = getSavedItems();
  item.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  item.createdAt = new Date().toISOString();
  items.unshift(item);
  saveSavedItems(items);
  return item;
}

function deleteSavedItem(id) {
  const items = getSavedItems().filter(i => i.id !== id);
  saveSavedItems(items);
}

function updateSavedItem(id, updates) {
  const items = getSavedItems();
  const idx = items.findIndex(i => i.id === id);
  if (idx !== -1) { Object.assign(items[idx], updates); saveSavedItems(items); }
}

function renderSaved() {
  setActiveNav('saved');
  history.replaceState(null, '', '#saved');
  const content = document.getElementById('content');
  const items = getSavedItems();

  const typeOptions = `<option value="note">Note</option><option value="snippet">Snippet</option>`;

  let html = `
    <h1>Saved</h1>
    <p style="color:#888;font-size:14.5px;line-height:1.7;margin-bottom:24px">
      Save notes and snippets from your files. Everything is stored locally in your browser.
    </p>
    <div class="save-form" id="save-form">
      <h3>New Item</h3>
      <input type="text" id="save-title" placeholder="Title" />
      <div class="form-row" style="margin-bottom:10px">
        <select id="save-type" style="width:auto;margin-bottom:0">${typeOptions}</select>
      </div>
      <textarea id="save-body" placeholder="Content — paste a snippet or write a note..."></textarea>
      <button id="save-submit">Save</button>
    </div>
  `;

  if (items.length === 0) {
    html += `<div class="saved-empty"><p>No saved items yet.</p><p style="font-size:12px">Use the form above or the save button when viewing files.</p></div>`;
  } else {
    html += items.map(item => {
      const date = new Date(item.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const sourceLabel = item.source ? ` &middot; from ${item.source}` : '';
      const preview = (item.body || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<div class="saved-item" data-id="${item.id}">
        <div class="saved-item-header">
          <span class="saved-item-title" data-id="${item.id}">${(item.title || 'Untitled').replace(/</g, '&lt;')}</span>
          <div class="saved-item-actions">
            <button class="saved-item-btn expand-btn" data-id="${item.id}">expand</button>
            <button class="saved-item-btn edit-btn" data-id="${item.id}">edit</button>
            <button class="saved-item-btn delete" data-id="${item.id}">delete</button>
          </div>
        </div>
        <div class="saved-item-meta">
          <span class="saved-item-type ${item.type || 'note'}">${item.type || 'note'}</span>
          ${date}${sourceLabel}
        </div>
        <div class="saved-item-preview">${preview}</div>
      </div>`;
    }).join('');
  }

  content.innerHTML = html;
  document.querySelector('main').scrollTop = 0;

  document.getElementById('save-submit').addEventListener('click', () => {
    const title = document.getElementById('save-title').value.trim();
    const type = document.getElementById('save-type').value;
    const body = document.getElementById('save-body').value.trim();
    if (!title && !body) return;
    addSavedItem({ title: title || 'Untitled', type, body });
    renderSaved();
  });

  content.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.saved-item');
      const isExpanded = card.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'collapse' : 'expand';
    });
  });

  content.querySelectorAll('.delete').forEach(btn => {
    btn.addEventListener('click', () => {
      deleteSavedItem(btn.dataset.id);
      renderSaved();
    });
  });

  content.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const item = getSavedItems().find(i => i.id === id);
      if (!item) return;
      const card = btn.closest('.saved-item');
      card.innerHTML = `
        <div class="save-form" style="margin:0;border:none;padding:0;background:none">
          <input type="text" value="${(item.title || '').replace(/"/g, '&quot;')}" class="edit-title" />
          <div class="form-row" style="margin-bottom:10px">
            <select class="edit-type" style="width:auto;margin-bottom:0">
              <option value="note" ${item.type === 'note' ? 'selected' : ''}>Note</option>
              <option value="snippet" ${item.type === 'snippet' ? 'selected' : ''}>Snippet</option>
            </select>
          </div>
          <textarea class="edit-body">${(item.body || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          <div class="form-row">
            <button class="edit-save">Save</button>
            <button class="cancel-btn edit-cancel">Cancel</button>
          </div>
        </div>
      `;
      card.querySelector('.edit-save').addEventListener('click', () => {
        updateSavedItem(id, {
          title: card.querySelector('.edit-title').value.trim() || 'Untitled',
          type: card.querySelector('.edit-type').value,
          body: card.querySelector('.edit-body').value.trim(),
        });
        renderSaved();
      });
      card.querySelector('.edit-cancel').addEventListener('click', () => renderSaved());
    });
  });
}

// ─── File loading ───
function setActiveNav(id) {
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  currentFile = id;
  if (typeof updateMobileActiveState === 'function') updateMobileActiveState(id);
}

async function loadFile(id) {
  const f = fileMap[id];
  if (!f) return;
  setActiveNav(id);
  history.replaceState(null, '', '#' + id);
  const content = document.getElementById('content');

  if (cache[id]) {
    renderMarkdown(content, cache[id], f);
    return;
  }

  content.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(f.file);
    if (!res.ok) throw new Error('Not found');
    const md = await res.text();
    cache[id] = md;
    renderMarkdown(content, md, f);
  } catch (e) {
    content.innerHTML = `<h1>${f.label}</h1><p style="color:#f7768e;">Could not load file.</p>`;
  }
}

function renderMarkdown(el, md, f) {
  const saveBtn = `<button class="save-page-btn" onclick="saveCurrentPage()">Save page</button>`;
  el.innerHTML = saveBtn + marked.parse(md);
  document.querySelector('main').scrollTop = 0;
  window._currentPageSource = f;
  window._currentPageMd = md;
}

function saveCurrentPage() {
  if (!window._currentPageSource) return;
  const f = window._currentPageSource;
  addSavedItem({
    title: f.label,
    type: 'snippet',
    body: window._currentPageMd || '',
    source: f.label,
  });
  const btn = document.querySelector('.save-page-btn');
  if (btn) { btn.textContent = 'Saved!'; btn.style.borderColor = '#38bdf8'; btn.style.color = '#38bdf8'; }
}

// ─── Search ───
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
let searchTimeout = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = 'none'; return; }
  searchTimeout = setTimeout(async () => {
    const results = [];
    for (const f of files) {
      if (!cache[f.id]) {
        try {
          const res = await fetch(f.file);
          if (res.ok) cache[f.id] = await res.text();
        } catch {}
      }
      if (cache[f.id]) {
        const lines = cache[f.id].split('\n');
        lines.forEach((line, i) => {
          if (line.toLowerCase().includes(q)) {
            results.push({ file: f, line: line.trim(), lineNum: i + 1 });
          }
        });
      }
    }
    if (results.length === 0) {
      searchResults.innerHTML = '<div style="padding:8px 0;color:#555;font-size:12px;">No results</div>';
    } else {
      searchResults.innerHTML = results.slice(0, 20).map(r => {
        const highlighted = r.line.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
        return `<div class="search-result" data-id="${r.file.id}">
          <div class="file">${r.file.label} : ${r.lineNum}</div>
          <div class="line">${highlighted}</div>
        </div>`;
      }).join('');
      searchResults.querySelectorAll('.search-result').forEach(el => {
        el.addEventListener('click', () => {
          loadFile(el.dataset.id);
          searchInput.value = '';
          searchResults.style.display = 'none';
        });
      });
    }
    searchResults.style.display = '';
  }, 200);
});

// ─── Mobile nav ───
function buildMobileDropdown() {
  const dd = document.getElementById('mobileDropdown');
  let html = '';
  sections.forEach(s => {
    html += `<div class="section-label">${s.name}</div>`;
    s.ids.forEach(id => {
      const f = fileMap[id];
      if (f) html += `<a href="#${f.id}" data-id="${f.id}" onclick="mobileNavClick(event, '${f.id}')">${f.label}</a>`;
    });
  });
  html += `<div class="section-label">Saved</div>`;
  html += `<a href="#saved" data-id="saved" onclick="mobileNavClick(event, 'saved')">All Saved</a>`;
  dd.innerHTML = html;
}

function toggleMobileNav() {
  document.getElementById('mobileDropdown').classList.toggle('open');
}

function mobileNavClick(e, id) {
  e.preventDefault();
  document.getElementById('mobileDropdown').classList.remove('open');
  if (id === 'saved') { renderSaved(); }
  else { loadFile(id); }
  updateMobileActiveState(id);
}

function updateMobileActiveState(id) {
  document.querySelectorAll('.mobile-dropdown a').forEach(a => {
    a.classList.toggle('active', a.dataset.id === id);
  });
}

buildMobileDropdown();

// ─── Hash routing ───
function handleHash() {
  const hash = location.hash.slice(1) || files[0]?.id;
  if (hash === 'saved') { renderSaved(); return; }
  if (fileMap[hash]) { loadFile(hash); return; }
  if (files[0]) loadFile(files[0].id);
}

window.addEventListener('hashchange', handleHash);
handleHash();
</script>
</body>
