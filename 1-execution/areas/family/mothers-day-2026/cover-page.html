<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Karissa — Mother's Day 2026</title>
<link rel="stylesheet" href="shared/mothers-day.css">
<style>
  body.cover-page {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .cover-frame {
    margin: auto;
    padding: 40px 40px;
    max-width: 5.6in;
    position: relative;
  }
  .cover-frame::before, .cover-frame::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 1px;
    background: var(--gold);
    opacity: 0.45;
  }
  .cover-frame::before { top: 0; }
  .cover-frame::after  { bottom: 0; }
  .cover-eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 36px;
  }
  .cover-for {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .cover-name {
    font-family: 'Caveat', cursive;
    font-size: 120px;
    color: var(--rose-deep);
    line-height: 1;
    margin-bottom: 24px;
  }
  .cover-divider {
    width: 80px;
    height: 1px;
    background: var(--gold);
    opacity: 0.55;
    margin: 0 auto 28px;
  }
  .cover-tribute {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    line-height: 1.85;
    color: var(--ink);
    margin-bottom: 36px;
    font-style: italic;
  }
  .cover-from {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .cover-names {
    font-family: 'Caveat', cursive;
    font-size: 36px;
    color: var(--gold-deep);
    line-height: 1.25;
  }
  .cover-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 36px;
    opacity: 0.65;
  }
</style>
</head>
<body class="cover-page">

  <div class="cover-frame">
    <div class="cover-eyebrow">Mother's Day · 2026</div>
    <div class="cover-for">for</div>
    <div class="cover-name">Karissa</div>
    <div class="cover-divider"></div>
    <div class="cover-tribute">
      A keepsake of small things —<br>
      a hug in the middle of lunch,<br>
      a kitchen on an ordinary day,<br>
      a drawing made just for you.
    </div>
    <div class="cover-from">with love from your five</div>
    <div class="cover-names">Lily &nbsp;·&nbsp; Faith &nbsp;·&nbsp; Isla<br>Luke &nbsp;·&nbsp; Quinn</div>
    <div class="cover-date">May 10, 2026</div>
  </div>

</body>
</html>
