<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>From Isla — For Mommy</title>
<link rel="stylesheet" href="../shared/mothers-day.css">
<style>
  /* Isla-specific tightening — top row keeps drawing + photo compact so the poem still gets the full canvas below. */
  .isla-top { max-width: 6.0in; margin-bottom: 12px; }
  .isla-top .drawing-card img,
  .isla-top .photo-card-large img { max-height: 2.5in; height: 2.5in; }
  .hero.tilt-counter { transform: rotate(0.9deg); margin-top: 4px; }
  .hero.hero-portrait { width: 3.3in; }
  .hero.hero-portrait img { max-height: 4.0in; }
</style>
</head>
<body>

  <div class="ribbon">
    <span class="ribbon-tag">From the Kids · Mother's Day 2026</span>
  </div>
  <h1>For Mommy</h1>
  <div class="subtitle">a letter and a poem from <span class="name">Isla</span></div>

  <div class="top-row isla-top">
    <div class="drawing-card">
      <img src="isla-i-love-you-mommy.jpeg" alt="Isla's drawing — I LOVE YOU MOMMY">
    </div>
    <div class="photo-card-large">
      <img src="isla-with-mom-hug.png" alt="Isla hugging Karissa at the booth">
      <div class="top-row-caption">a long hug, right in the middle of lunch.</div>
    </div>
  </div>

  <div class="hero hero-portrait tilt-counter">
    <img src="isla-how-much-i-love-you-poem.jpeg" alt="Isla's poem — How Much I Love You">
    <div class="hero-caption">"How Much I Love You" — by Isla</div>
  </div>

  <div class="footer">
    <div class="footer-line">
      love love love
      <span class="footer-heart">♥</span>
      Isla
    </div>
    <div class="footer-date">Mother's Day · May 10, 2026</div>
  </div>

</body>
</html>
