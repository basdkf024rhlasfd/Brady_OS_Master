<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brady OS — Cockpit</title>
<style>
  :root {
    --bg: #0C0F14;
    --surface: #141820;
    --surface-2: #1a1f2a;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-muted: #8b919e;
    --accent: #4ade80;
    --accent-dim: rgba(74, 222, 128, 0.12);
    --yellow: #facc15;
    --yellow-dim: rgba(250, 204, 21, 0.12);
    --red: #f87171;
    --red-dim: rgba(248, 113, 113, 0.12);
    --blue: #60a5fa;
    --blue-dim: rgba(96, 165, 250, 0.12);
    --orange: #fb923c;
    --orange-dim: rgba(251, 146, 60, 0.12);
    --purple: #c084fc;
    --purple-dim: rgba(192, 132, 252, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .logo span { color: var(--text-muted); font-weight: 400; }
  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .timestamp { font-size: 11px; color: var(--text-muted); }

  /* ── Health Score Banner ── */
  .health-banner {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 24px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .score-ring {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .score-ring svg { width: 120px; height: 120px; }
  .score-ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
  }
  .score-ring .track { stroke: var(--border); }
  .score-ring .fill { stroke: var(--accent); stroke-dasharray: 314; stroke-dashoffset: 63; transition: stroke-dashoffset 1s ease; }
  .score-value {
    position: absolute;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }
  .score-label {
    position: absolute;
    bottom: 8px;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .health-dimensions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    align-content: center;
  }
  .dimension {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface-2);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .dimension-indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dimension-indicator.green { background: var(--accent); }
  .dimension-indicator.yellow { background: var(--yellow); }
  .dimension-indicator.red { background: var(--red); }
  .dimension-info { flex: 1; min-width: 0; }
  .dimension-name { font-size: 11px; color: var(--text-muted); }
  .dimension-value { font-size: 13px; font-weight: 600; }
  .dimension-score {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ── Main Grid ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    min-height: calc(100vh - 200px);
  }

  /* ── Lane (Inbound / Processing / Outbound) ── */
  .lane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .lane-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .lane-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lane-title .icon { font-size: 14px; }
  .lane-count {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .lane:nth-child(1) .lane-title { color: var(--blue); }
  .lane:nth-child(1) .lane-count { background: var(--blue-dim); color: var(--blue); }
  .lane:nth-child(2) .lane-title { color: var(--orange); }
  .lane:nth-child(2) .lane-count { background: var(--orange-dim); color: var(--orange); }
  .lane:nth-child(3) .lane-title { color: var(--accent); }
  .lane:nth-child(3) .lane-count { background: var(--accent-dim); color: var(--accent); }

  .lane-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Section inside a lane ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .section-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .section-header:hover { background: var(--surface-2); }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 700;
  }
  .badge-green { background: var(--accent-dim); color: var(--accent); }
  .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
  .badge-red { background: var(--red-dim); color: var(--red); }
  .badge-blue { background: var(--blue-dim); color: var(--blue); }
  .badge-purple { background: var(--purple-dim); color: var(--purple); }
  .badge-muted { background: var(--surface-2); color: var(--text-muted); }

  .section-body { padding: 10px 14px; }

  /* ── Items ── */
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.5;
  }
  .item:last-child { border-bottom: none; }
  .item-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .item-content { flex: 1; min-width: 0; }
  .item-label { color: var(--text); font-weight: 500; }
  .item-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .item-tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── Stat row ── */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-muted); }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── Progress bar ── */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
  }

  /* ── Footer ── */
  .footer {
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .main { grid-template-columns: 1fr; }
    .health-banner { grid-template-columns: 1fr; }
    .score-ring { justify-self: center; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">BRADY OS <span>cockpit</span></div>
    <div class="header-status">
      <div class="pulse"></div>
      <span>System Active</span>
    </div>
  </div>
  <div class="header-right">
    <div class="timestamp" id="clock"></div>
  </div>
</div>

<!-- Health Score Banner -->
<div class="health-banner">
  <div class="score-ring">
    <svg viewBox="0 0 120 120">
      <circle class="track" cx="60" cy="60" r="50" />
      <circle class="fill" cx="60" cy="60" r="50" />
    </svg>
    <div class="score-value" id="overall-score">8.0</div>
    <div class="score-label">System Health</div>
  </div>
  <div class="health-dimensions" id="dimensions">
    <!-- populated by JS -->
  </div>
</div>

<!-- Main 3-Lane Grid -->
<div class="main">

  <!-- INBOUND LANE -->
  <div class="lane">
    <div class="lane-header">
      <div class="lane-title"><span class="icon">&#x2193;</span> Inbound</div>
      <div class="lane-count" id="inbound-count">0</div>
    </div>
    <div class="lane-body" id="inbound-body">
      <!-- Rendered by data.js -->
    </div>
  </div>

  <!-- PROCESSING LANE -->
  <div class="lane">
    <div class="lane-header">
      <div class="lane-title"><span class="icon">&#x2699;</span> Processing</div>
      <div class="lane-count" id="processing-count">0</div>
    </div>
    <div class="lane-body" id="processing-body">
      <!-- Rendered by data.js -->
    </div>
  </div>

  <!-- OUTBOUND LANE -->
  <div class="lane">
    <div class="lane-header">
      <div class="lane-title"><span class="icon">&#x2191;</span> Outbound</div>
      <div class="lane-count" id="outbound-count">0</div>
    </div>
    <div class="lane-body" id="outbound-body">
      <!-- Rendered by data.js -->
    </div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <span>Brady OS v2.0 &middot; GitHub canonical &middot; Notion operational</span>
  <span>Built with <a href="#">mception.ai</a></span>
</div>

<script src="data.js"></script>
<script>
const D = window.COCKPIT_DATA || {};

// Clock
function updateClock() {
  const now = new Date();
  const opts = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'America/Chicago' };
  document.getElementById('clock').textContent = now.toLocaleString('en-US', opts) + ' CT';
}
updateClock();
setInterval(updateClock, 1000);

// Show last refresh
if (D.generated) {
  const gen = new Date(D.generated);
  const ago = Math.round((Date.now() - gen.getTime()) / 60000);
  const label = ago < 60 ? ago + 'm ago' : Math.round(ago/60) + 'h ago';
  document.querySelector('.header-status span').textContent = 'Data: ' + label;
}

// ── Helpers ──
function colorVar(status) {
  return status === 'green' || status === 'on-track' ? 'var(--accent)' :
         status === 'yellow' || status === 'watch' ? 'var(--yellow)' :
         status === 'red' ? 'var(--red)' :
         status === 'in-flight' ? 'var(--blue)' : 'var(--text-muted)';
}
function badgeClass(status) {
  return status === 'green' || status === 'on-track' || status === 'shipped' ? 'badge-green' :
         status === 'yellow' || status === 'watch' || status === 'draft' || status === 'review' ? 'badge-yellow' :
         status === 'red' ? 'badge-red' :
         status === 'in-flight' ? 'badge-blue' : 'badge-muted';
}
function statusLabel(s) {
  return s === 'on-track' ? 'On Track' : s === 'in-flight' ? 'In Flight' :
         s === 'watch' ? 'Watch' : s === 'shipped' ? 'Shipped' :
         s === 'draft' ? 'Draft' : s === 'review' ? 'Review' : s;
}

// ── Health Dimensions ──
const dims = D.health || [];
const dimContainer = document.getElementById('dimensions');
dims.forEach(d => {
  dimContainer.innerHTML += `
    <div class="dimension">
      <div class="dimension-indicator ${d.status}"></div>
      <div class="dimension-info">
        <div class="dimension-name">${d.name}</div>
        <div class="dimension-value">${d.value}</div>
      </div>
      <div class="dimension-score" style="color:${colorVar(d.status)}">${d.score}</div>
    </div>`;
});
const avg = dims.length ? dims.reduce((s, d) => s + d.score, 0) / dims.length : 0;
document.getElementById('overall-score').textContent = avg.toFixed(1);
const offset = 314 - (314 * (avg / 10));
document.querySelector('.score-ring .fill').style.strokeDashoffset = offset;
const ringColor = avg >= 8 ? 'var(--accent)' : avg >= 6 ? 'var(--yellow)' : 'var(--red)';
document.querySelector('.score-ring .fill').style.stroke = ringColor;
document.getElementById('overall-score').style.color = ringColor;

// ── Inbound: Email ──
const ib = document.getElementById('inbound-body');
ib.innerHTML = '';

// Email section
const em = D.email || {};
let emailHtml = `<div class="section"><div class="section-header">
  <div class="section-title">Email Inbox</div>
  <span class="section-badge badge-blue">Gmail</span>
</div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Inbox threads</span><span class="stat-value" style="color:var(--blue)">${em.inbox_threads || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Action Required</span><span class="stat-value" style="color:var(--yellow)">${em.action_required || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Starred</span><span class="stat-value">${em.starred || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Last Triage</span><span class="stat-value">${em.last_triage || '—'}</span></div>`;
if (em.flagged && em.flagged.length) {
  emailHtml += '<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">';
  em.flagged.forEach(f => {
    emailHtml += `<div class="item"><div class="item-dot" style="background:var(--yellow)"></div><div class="item-content"><div class="item-label">${f.subject}</div><div class="item-meta">${f.from} &middot; ${f.age}</div></div></div>`;
  });
  emailHtml += '</div>';
}
emailHtml += '</div></div>';
ib.innerHTML += emailHtml;

// Calendar section
const cal = D.calendar || {};
let calHtml = `<div class="section"><div class="section-header">
  <div class="section-title">Calendar — Today</div>
  <span class="section-badge ${(cal.conflicts||[]).length ? 'badge-red' : 'badge-green'}">${(cal.conflicts||[]).length ? cal.conflicts.length + ' conflict' : 'Clear'}</span>
</div><div class="section-body">`;
(cal.today || []).forEach(e => {
  const dotColor = e.color === 'green' ? 'var(--accent)' : e.color === 'red' ? 'var(--red)' : e.color === 'orange' ? 'var(--orange)' : e.color === 'blue' ? 'var(--blue)' : 'var(--purple)';
  calHtml += `<div class="item"><div class="item-dot" style="background:${dotColor}"></div><div class="item-content"><div class="item-label">${e.title}</div><div class="item-meta">${e.time} CT</div></div></div>`;
});
if ((cal.conflicts||[]).length) {
  calHtml += '<div style="margin-top:8px;padding:8px;background:var(--red-dim);border-radius:4px;font-size:11px;color:var(--red)">';
  cal.conflicts.forEach(c => { calHtml += `<strong>CONFLICT:</strong> ${c.a} vs ${c.b}<br><em>${c.resolution}</em>`; });
  calHtml += '</div>';
}
calHtml += '</div></div>';
ib.innerHTML += calHtml;

// Tomorrow preview
if ((cal.tomorrow||[]).length) {
  let tomHtml = `<div class="section"><div class="section-header"><div class="section-title">Tomorrow</div><span class="section-badge badge-muted">${cal.tomorrow.length} events</span></div><div class="section-body">`;
  cal.tomorrow.forEach(e => {
    const dotColor = e.color === 'orange' ? 'var(--orange)' : 'var(--purple)';
    tomHtml += `<div class="item"><div class="item-dot" style="background:${dotColor}"></div><div class="item-content"><div class="item-label">${e.title}</div><div class="item-meta">${e.time} CT</div></div></div>`;
  });
  tomHtml += '</div></div>';
  ib.innerHTML += tomHtml;
}

// Capture surfaces
const cap = D.capture || {};
ib.innerHTML += `<div class="section"><div class="section-header"><div class="section-title">Capture Surfaces</div><span class="section-badge badge-muted">Notion</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Unprocessed Notes</span><span class="stat-value">${cap.unprocessed_notes || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Voice Notes (pending)</span><span class="stat-value">${cap.pending_voice_notes || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Pending Transcripts</span><span class="stat-value">${cap.pending_transcripts || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Diary Last Entry</span><span class="stat-value">${cap.diary_last_entry || '—'}</span></div>
</div></div>`;

// ── Processing Lane ──
const pb = document.getElementById('processing-body');
pb.innerHTML = '';

// Projects
const proj = D.projects || [];
let projHtml = `<div class="section"><div class="section-header"><div class="section-title">Active Projects</div><span class="section-badge badge-orange">${proj.length}</span></div><div class="section-body">`;
proj.forEach(p => {
  projHtml += `<div class="item"><div class="item-dot" style="background:${colorVar(p.status)}"></div><div class="item-content"><div class="item-label">${p.name}</div><div class="item-meta">${p.program} &middot; ${p.note}</div></div><span class="item-tag ${badgeClass(p.status)}">${statusLabel(p.status)}</span></div>`;
});
projHtml += '</div></div>';
pb.innerHTML += projHtml;

// Action items
const acts = D.actions || [];
const done = acts.filter(a => a.done).length;
const pct = acts.length ? Math.round(done/acts.length*100) : 0;
let actHtml = `<div class="section"><div class="section-header"><div class="section-title">Action Items</div><span class="section-badge badge-orange">${done}/${acts.length}</span></div><div class="section-body">`;
acts.filter(a => !a.done).forEach(a => {
  const dotColor = a.priority === 'high' ? 'var(--red)' : a.priority === 'medium' ? 'var(--yellow)' : 'var(--text-muted)';
  actHtml += `<div class="item"><div class="item-dot" style="background:${dotColor}"></div><div class="item-content"><div class="item-label">${a.text}</div><div class="item-meta">${a.due} &middot; ${a.priority}</div></div></div>`;
});
if (done > 0) {
  actHtml += `<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">${done} completed</div>`;
}
actHtml += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div></div></div></div>`;
pb.innerHTML += actHtml;

// Conductor
const cond = D.conductor || {};
pb.innerHTML += `<div class="section"><div class="section-header"><div class="section-title">Conductor Agents</div><span class="section-badge badge-purple">Active</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Morning Sweep</span><span class="stat-value" style="color:${cond.morning_sweep?.ran ? 'var(--accent)' : 'var(--text-muted)'}">${cond.morning_sweep?.ran ? '&#10003; '+cond.morning_sweep.time : 'Pending'}</span></div>
  <div class="stat-row"><span class="stat-label">Daily Whitepaper</span><span class="stat-value" style="color:${cond.daily_whitepaper?.ran ? 'var(--accent)' : 'var(--text-muted)'}">${cond.daily_whitepaper?.ran ? '&#10003; '+cond.daily_whitepaper.time : 'Pending'}</span></div>
  <div class="stat-row"><span class="stat-label">Evening Sweep</span><span class="stat-value" style="color:${cond.evening_sweep?.ran ? 'var(--accent)' : 'var(--text-muted)'}">${cond.evening_sweep?.ran ? '&#10003; '+cond.evening_sweep.time : cond.evening_sweep?.scheduled || '—'}</span></div>
  <div class="stat-row"><span class="stat-label">Active Workspaces</span><span class="stat-value">${cond.active_workspaces || 0}</span></div>
</div></div>`;

// Finances
const fin = D.finances || {};
pb.innerHTML += `<div class="section"><div class="section-header"><div class="section-title">Finances</div><span class="section-badge badge-muted">${fin.last_reviewed || '—'}</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Arvest Balance</span><span class="stat-value">${fin.arvest_balance || '—'}</span></div>
  <div class="stat-row"><span class="stat-label">Alerts</span><span class="stat-value" style="color:${fin.pending_alerts ? 'var(--yellow)' : 'var(--accent)'}">${fin.pending_alerts || 0}</span></div>
  ${fin.alert_detail ? `<div class="stat-row"><span class="stat-label">Detail</span><span class="stat-value" style="font-size:11px">${fin.alert_detail}</span></div>` : ''}
</div></div>`;

// ── Outbound Lane ──
const ob = document.getElementById('outbound-body');
ob.innerHTML = '';

// Deliverables
const dels = D.deliverables || [];
let delHtml = `<div class="section"><div class="section-header"><div class="section-title">Deliverables</div><span class="section-badge badge-green">${dels.length}</span></div><div class="section-body">`;
dels.forEach(d => {
  delHtml += `<div class="item"><div class="item-dot" style="background:${colorVar(d.status)}"></div><div class="item-content"><div class="item-label">${d.name}</div><div class="item-meta">${d.detail}</div></div><span class="item-tag ${badgeClass(d.status)}">${statusLabel(d.status)}</span></div>`;
});
delHtml += '</div></div>';
ob.innerHTML += delHtml;

// mception.ai
const live = D.live_projects || [];
let liveHtml = `<div class="section"><div class="section-header"><div class="section-title">mception.ai</div><span class="section-badge badge-green">${live.length} live</span></div><div class="section-body">`;
live.forEach(p => {
  liveHtml += `<div class="stat-row"><span class="stat-label">${p}</span><span class="stat-value" style="color:var(--accent)">&#9679; Live</span></div>`;
});
liveHtml += '</div></div>';
ob.innerHTML += liveHtml;

// Email outbound
const eo = D.email_outbound || {};
let eoHtml = `<div class="section"><div class="section-header"><div class="section-title">Email Outbound</div><span class="section-badge badge-blue">Gmail</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Drafts pending</span><span class="stat-value" style="color:var(--yellow)">${eo.drafts_pending || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Sent today</span><span class="stat-value">${eo.sent_today || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Awaiting reply</span><span class="stat-value">${eo.awaiting_reply || 0}</span></div>`;
(eo.key_threads||[]).forEach(t => {
  eoHtml += `<div class="item"><div class="item-dot" style="background:var(--yellow)"></div><div class="item-content"><div class="item-label">${t.subject}</div><div class="item-meta">To: ${t.to} &middot; ${t.status}</div></div></div>`;
});
eoHtml += '</div></div>';
ob.innerHTML += eoHtml;

// GitHub
const gh = D.github || {};
let ghHtml = `<div class="section"><div class="section-header"><div class="section-title">GitHub</div><span class="section-badge badge-purple">Today</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Commits today</span><span class="stat-value">${gh.commits_today || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Open PRs</span><span class="stat-value">${gh.open_prs || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Active branch</span><span class="stat-value" style="font-size:11px">${gh.active_branch || '—'}</span></div>`;
(gh.recent||[]).forEach(c => {
  ghHtml += `<div class="item"><div class="item-dot" style="background:var(--purple)"></div><div class="item-content"><div class="item-label" style="font-size:11px">${c}</div></div></div>`;
});
ghHtml += '</div></div>';
ob.innerHTML += ghHtml;

// Content
const ct = D.content || {};
ob.innerHTML += `<div class="section"><div class="section-header"><div class="section-title">Content Pipeline</div><span class="section-badge badge-muted">Substack</span></div><div class="section-body">
  <div class="stat-row"><span class="stat-label">Drafts in progress</span><span class="stat-value">${ct.drafts_in_progress || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Published this week</span><span class="stat-value">${ct.published_this_week || 0}</span></div>
  <div class="stat-row"><span class="stat-label">Daily Whitepaper</span><span class="stat-value" style="color:${ct.whitepaper_today ? 'var(--accent)' : 'var(--text-muted)'}">${ct.whitepaper_today ? '&#10003; Today' : 'Pending'}</span></div>
</div></div>`;

// ── Lane counts ──
document.getElementById('inbound-count').textContent = document.querySelectorAll('#inbound-body .item').length + ' items';
document.getElementById('processing-count').textContent = document.querySelectorAll('#processing-body .item').length + ' items';
document.getElementById('outbound-count').textContent = document.querySelectorAll('#outbound-body .item').length + ' items';
</script>

</body>
</html>
