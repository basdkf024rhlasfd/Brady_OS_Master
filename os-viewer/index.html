// ─── Build lookup ───
const fileMap = {};

// ─── Build nav ───
const navLinks = document.getElementById('nav-links');
const collapsedGroups = JSON.parse(localStorage.getItem('bradyos-navCollapsed') || '{}');

function buildNavSection(section) {
  const { name, ids, subSections, badge, defaultOpen } = section;
  const isCollapsed = collapsedGroups.hasOwnProperty(name) ? collapsedGroups[name] : !defaultOpen;

  const h2 = document.createElement('h2');
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  h2.appendChild(chevron);
  h2.appendChild(document.createTextNode(' ' + name));

  if (badge) {
    const span = document.createElement('span');
    span.className = 'layer-badge ' + badge;
    span.textContent = badge.toUpperCase();
    h2.appendChild(span);
  }

  // Count total files
  let count = 0;
  if (ids) count = ids.length;
  if (subSections) subSections.forEach(s => count += s.ids.length);
  if (count > 0) {
    const countSpan = document.createElement('span');
    countSpan.className = 'file-count';
    countSpan.textContent = '(' + count + ')';
    h2.appendChild(countSpan);
  }

  const group = document.createElement('div');
  group.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');

  h2.addEventListener('click', () => {
    const nowCollapsed = group.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[name] = nowCollapsed;
    localStorage.setItem('bradyos-navCollapsed', JSON.stringify(collapsedGroups));
  });

  // Build links
  if (ids) {
    ids.forEach(id => {
      const f = fileMap[id];
      if (!f) return;
      const a = document.createElement('a');
      a.href = '#' + f.id;
      a.textContent = f.label;
      a.dataset.id = f.id;
      a.addEventListener('click', e => { e.preventDefault(); loadFile(f.id); });
      group.appendChild(a);
    });
  }

  // Build sub-sections
  if (subSections) {
    subSections.forEach(sub => buildSubSection(group, sub.name, sub.ids));
  }

  navLinks.appendChild(h2);
  navLinks.appendChild(group);
}

function buildSubSection(parent, name, ids) {
  const subKey = 'sub-' + name;
  const isCollapsed = collapsedGroups.hasOwnProperty(subKey) ? collapsedGroups[subKey] : true;

  const header = document.createElement('div');
  header.className = 'sub-section-header';
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  header.appendChild(chevron);
  header.appendChild(document.createTextNode(' ' + name));

  const countSpan = document.createElement('span');
  countSpan.className = 'file-count';
  countSpan.textContent = ' (' + ids.length + ')';
  header.appendChild(countSpan);

  const innerGroup = document.createElement('div');
  innerGroup.className = 'sub-inner-group' + (isCollapsed ? ' collapsed' : '');

  header.addEventListener('click', () => {
    const nowCollapsed = innerGroup.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[subKey] = nowCollapsed;
    localStorage.setItem('bradyos-navCollapsed', JSON.stringify(collapsedGroups));
  });

  ids.forEach(id => {
    const f = fileMap[id];
    if (!f) return;
    const a = document.createElement('a');
    a.href = '#' + f.id;
    a.textContent = f.label;
    a.dataset.id = f.id;
    a.addEventListener('click', e => { e.preventDefault(); loadFile(f.id); });
    innerGroup.appendChild(a);
  });

  parent.appendChild(header);
  parent.appendChild(innerGroup);
}

// Build all sections with separators between layer groups
let lastBadge = null;
sections.forEach((section, i) => {
  const currentBadge = section.badge || 'system';
  if (lastBadge && currentBadge !== lastBadge) {
    navLinks.appendChild(Object.assign(document.createElement('hr'), { className: 'nav-separator' }));

  lastBadge = currentBadge;
  buildNavSection(section);
});

// ─── File loading ───
async function fetchFile(id) {
  if (cache[id]) return cache[id];
  const entry = fileMap[id];
  if (!entry) return '';
  try {
    const res = await fetch(entry.file);
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    cache[id] = text;
    return text;
  } catch (e) {
    return `*Could not load file: ${entry.file}*`;
  }
}

async function loadFile(id) {
  currentFile = id;
  const mainEl = document.querySelector('main');
  mainEl.innerHTML = '<div class="content-wrap" id="content"><div class="loading">Loading...</div></div>';

  setActiveNav(id);
  history.replaceState(null, '', '#' + id);

  const md = await fetchFile(id);
  const content = document.getElementById('content');
  content.innerHTML = marked.parse(md);

  mainEl.scrollTop = 0;
}

function setActiveNav(id) {
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
}

// ─── Search ───
let searchTimeout;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  const query = this.value.trim().toLowerCase();
  const resultsDiv = document.getElementById('search-results');
  const navDiv = document.getElementById('nav-links');

  if (!query) {
    resultsDiv.style.display = 'none';
    navDiv.style.display = '';
    return;
  }

  searchTimeout = setTimeout(async () => {
    // Also search labels
    const labelMatches = files.filter(f => f.label.toLowerCase().includes(query));

    // Search cached content
    const contentResults = [];
    for (const f of files) {
      const text = cache[f.id] || '';
      if (!text) continue;
      const lines = text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().includes(query)) {
          const snippet = lines[i].trim().substring(0, 120);
          const highlighted = snippet.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), match => `<mark>${match}</mark>`);
          contentResults.push({ fileId: f.id, label: f.label, line: highlighted });
          if (contentResults.length >= 20) break;
        }
      }
      if (contentResults.length >= 20) break;
    }

    // Combine: label matches first, then content
    const allResults = [];
    const seen = new Set();
    labelMatches.forEach(f => {
      if (!seen.has(f.id)) {
        allResults.push({ fileId: f.id, label: f.label, line: `<span style="color:#4ade80">Navigate to ${f.label}</span>` });
        seen.add(f.id);
      }
    });
    contentResults.forEach(r => {
      if (!seen.has(r.fileId + r.line)) {
        allResults.push(r);
        seen.add(r.fileId + r.line);
      }
    });

    navDiv.style.display = 'none';
    resultsDiv.style.display = '';

    if (allResults.length === 0) {
      resultsDiv.innerHTML = '<div style="padding:12px 0;color:#555;font-size:12px;">No results. Try loading pages first to enable content search.</div>';
    } else {
      resultsDiv.innerHTML = allResults.slice(0, 30).map(r =>
        `<div class="search-result" data-id="${r.fileId}">
          <div class="file">${r.label}</div>
          <div class="line">${r.line}</div>
        </div>`
      ).join('');

      resultsDiv.querySelectorAll('.search-result').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById('search').value = '';
          resultsDiv.style.display = 'none';
          navDiv.style.display = '';
          loadFile(el.dataset.id);
        });
      });
    }
  }, 200);
});

// ─── Hash routing ───
function handleHash() {
  const hash = location.hash.replace('#', '');
  if (!hash) { renderLanding(); return; }
  if (fileMap[hash]) { loadFile(hash); return; }
  renderLanding();
}

window.addEventListener('hashchange', handleHash);
handleHash();
