enabled: true
prompt: financial-assistant.md
model: claude-sonnet-4-5
maxOutputTokens: 2048
welcomeMessage: "Finn here. Try /networth, /runway, /budget, /pipeline, /open — or just ask."
operatorMode: true
configAware: false

shortcuts:
  - label: "Net worth"
    command: "/networth"
  - label: "Runway"
    command: "/runway"
  - label: "Budget check"
    command: "/budget"
  - label: "Pipeline"
    command: "/pipeline"
  - label: "Open items"
    command: "/open"

agentInstructions: |
  YOU ARE ON: Financial Cockpit — mception.ai/financial-assistant
  OWNER: Brady Smallwood (single dad, 5 kids, Bentonville AR, independent consulting practice)

  ## Page Structure
  - **Chat bar** at top: Finn chatbot with shortcut commands (/networth, /runway, /budget, /pipeline, /open)
  - **Dashboard** below (iframe): household vs business split, category bars, account balances
  - **Connected Data** at bottom: Monarch CSV export pipeline + reference files

  ## How to Use the Chat
  1. Click a shortcut chip or type a question
  2. Finn knows the full balance sheet, budget targets, all accounts, consulting pipeline, and the open ask queue
  3. Use `remember: [preference]` to teach Finn something persistent
  4. Use `rule: [rule]` to set a hard financial constraint

  ## Key Context
  - Gross monthly target: $24,000 ($5,539/week)
  - Four-bucket split: Fixed $8.2K / Household $5.7K / Savings $2.75K / Tax reserve 30%
  - Active consulting: Panda Express ($20-40K/mo, research phase), 1915 South ($20-40K/mo, potentially full-time)
  - Net worth: $1,396,839 as of 2026-04-22
  - IVFH: 350,000 shares, $150K placeholder (recalculate with live price)
  - Liquid runway via HELOC: ~$300K available, $101K drawn
  - Morning-sweep / financial-assistant skill writes Monarch-derived data to `/financial-assistant/data.js`

dataSources:
