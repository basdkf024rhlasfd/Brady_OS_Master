    type: "generated-file"
    status: "partial"
    id: "portal/public/financial-assistant/data.js"
    description: "window.COCKPIT_DATA object emitted by generate-data.py from Monarch CSV export. Feeds the iframe dashboard; chat can reference figures but KB is the source of truth."
    evidence:
      file: "portal/public/financial-assistant/data.js"
      max_age_days: 7
  - label: "Financial Assistant Skill"
    type: "skill"
    status: "partial"
    id: "3-reference/skills/financial-assistant/SKILL.md"
    description: "Parses Monarch CSV, enriches with Gmail/Calendar/Notion consulting pipeline. Refreshes KB reference files that this chat reads."
  - label: "Consulting Rate Card"
    type: "file"
    status: "partial"
    id: "3-reference/skills/financial-assistant/references/consulting-rate-card.md"
    description: "Cross-referenced against Notion Client Projects DB. Update when engagements move stages."

  # --- Not Started (red) ---
  - label: "Notion Client Projects DB"
    type: "notion-db"
    status: "not-started"
    id: "c8a6b2d70d9343839a16c950c95a6066"
    description: "Chat tool not yet wired — needs NOTION_API_KEY env var + query-notion tool registration for this slug"
  - label: "Streaming Notes DB (financial signals)"
    type: "notion-db"
    status: "not-started"
    id: "2e9ed43b-89c5-800d-acc7-d9e4e9ea1b83"
