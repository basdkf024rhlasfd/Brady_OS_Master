kb:
  enabled: true
  directory: public/financial-assistant/kb
  maxFiles: 4
  routing: keyword
  routes:
    - keywords: [networth, net worth, balance sheet, assets, liabilities, equity, investments, real estate, ivfh, fidelity, 529, mortgage, heloc, liquid]
      files: [01-balance-sheet.md, 03-accounts.md]
    - keywords: [budget, spend, monthly, weekly, target, bucket, fixed, household, food, grocery, walmart, survive, stabilize, thrive, tax reserve]
      files: [02-budget-targets.md, 01-balance-sheet.md]
    - keywords: [account, bank, card, credit, debit, sofi, arvest, amex, citi, capital one, venmo, betterment, kids account]
      files: [03-accounts.md]
    - keywords: [consulting, pipeline, client, revenue, invoice, panda, 1915, ashley, justin, james ku, kroger, harmon, stihl, jeff, ffh, schmulen, rate]
      files: [04-consulting-pipeline.md]
    - keywords: [open, ask, pending, gap, question, todo, outstanding, unknown, unanswered, follow up]
      files: [05-open-items.md]
    - keywords: [runway, liquidity, cash, burn, months, cover, afford]
      files: [01-balance-sheet.md, 02-budget-targets.md]
    - keywords: [tax, estimate, quarterly, self-employed, se tax, butler, reserve, 30%, 38%]
      files: [02-budget-targets.md, 04-consulting-pipeline.md]
