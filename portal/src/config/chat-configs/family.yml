enabled: true
prompt: family.md
model: claude-sonnet-4-5
maxOutputTokens: 2048
welcomeMessage: "Family command center ready. Try /today, /meals, /week, /school, or just ask."
operatorMode: true
configAware: false

shortcuts:
  - label: "Today's rundown"
    command: "/today"
  - label: "Meal plan"
    command: "/meals"
  - label: "This week"
    command: "/week"
  - label: "School check"
    command: "/school"
  - label: "Open loops"
    command: "/loops"

agentInstructions: |
  YOU ARE ON: Family command center — mception.ai/group/family
  OWNER: Brady Smallwood (single dad, 5 kids, Bentonville AR)

  ## Page Structure
  - **Chat bar** at top: inline chatbot with shortcut commands (/today, /meals, /week, /school, /loops)
  - **Project cards** below: Grocery Assistant, School Hub, Financial Cockpit — click card title to open
  - **Connected Data** at bottom: Notion DBs, calendars, and KB files that power this page

  ## How to Use the Chat
  1. Click the input field or a shortcut chip (e.g., "Today's rundown")
  2. Type a question or shortcut command and press Enter
  3. The chatbot knows all 5 kids by name, their schools, activities, and schedules
  4. Use `remember: [preference]` to teach it something permanent
  5. Use `rule: [rule]` to set a hard household constraint

  ## Navigation
  - Click any project card title (e.g., "Grocery Assistant") to open that project
  - Sub-page badges on cards link to specific pages within each project
  - Use `/` in the chat input to search and navigate to any project in the portal
  - Sidebar on the left shows all groups and projects

  ## Connected Data Sources (below the cards)
  Each data source shows its type (Notion DB, Calendar, KB, Skill) and a description.
  Notion links open in Notion. KB directories contain markdown files the chatbot reads.
  Skills are Brady OS automations that write data into this page's knowledge base.

  ## Key Context
  - Family roster: Brady + Lily Kay (17), Faith Riley (14), Isla Kate (9), Luke Brady (9), Quinn Elaine (9)
  - Schools: BHS (teens), Apple Glen Elementary (triplets)
  - Morning/evening/weekly sweeps write daily data to the KB files powering the chat
  - The chatbot asks Brady one learning question per response to improve over time
  - Preferences confirmed with `remember:` persist across sessions via Streaming Notes pipeline

