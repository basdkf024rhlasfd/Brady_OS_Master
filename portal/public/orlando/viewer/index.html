// Helper: build a collapsible nav section (collapsed by default unless user toggled)
function buildNavSection(name, buildLinks) {
  const isCollapsed = collapsedGroups.hasOwnProperty(name) ? collapsedGroups[name] : true;

  const h2 = document.createElement('h2');
  const chevron = document.createElement('span');
  chevron.className = 'chevron' + (isCollapsed ? ' collapsed' : '');
  chevron.textContent = '\u25BC';
  h2.appendChild(chevron);
  h2.appendChild(document.createTextNode(' ' + name));

  const group = document.createElement('div');
  group.className = 'nav-group' + (isCollapsed ? ' collapsed' : '');

  h2.addEventListener('click', () => {
    const nowCollapsed = group.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed', nowCollapsed);
    collapsedGroups[name] = nowCollapsed;
    localStorage.setItem('navCollapsed', JSON.stringify(collapsedGroups));
  });

  navLinks.appendChild(h2);
  buildLinks(group);
  navLinks.appendChild(group);
  return { h2, group, chevron };
}

async function fetchFile(id) {
  if (cache[id]) return cache[id];
  const entry = files.find(f => f.id === id);
  const res = await fetch(entry.file);
  const text = await res.text();
  cache[id] = text;
  return text;
}

async function loadFile(id) {
  currentFile = id;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading...</div>';

  // Update active nav and expand group if collapsed
  document.querySelectorAll('nav a').forEach(a => {
    const isActive = a.dataset.id === id;
    a.classList.toggle('active', isActive);
    if (isActive) {
      const group = a.closest('.nav-group');
      if (group && group.classList.contains('collapsed')) {
        group.classList.remove('collapsed');
        const chevron = group.previousElementSibling?.querySelector('.chevron');
        if (chevron) chevron.classList.remove('collapsed');
      }
    }
  });

  const md = await fetchFile(id);
  content.innerHTML = marked.parse(md);

  // Make kb/ file references clickable
  content.querySelectorAll('code').forEach(code => {
    const text = code.textContent.trim();
    const match = text.match(/^kb\/(.+\.md)$/);
    if (!match) return;
    const entry = files.find(f => f.file.endsWith('kb/' + match[1]));
    if (!entry) return;
    const link = document.createElement('a');
    link.href = '#' + entry.id;
    link.style.cssText = 'color:#6b8cae;cursor:pointer;text-decoration:none;';
    link.textContent = text;
    link.addEventListener('click', e => { e.preventDefault(); loadFile(entry.id); });
    code.replaceWith(link);
  });

  window.scrollTo(0, 0);
  document.querySelector('main').scrollTop = 0;

  // Update hash
  history.replaceState(null, '', '#' + id);

}

async function loadFileWithAnchor(id, anchorText) {
  await loadFile(id);
  if (anchorText) {
    setTimeout(() => {
      const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4');
      for (const h of headings) {
        if (h.textContent.includes(anchorText)) {
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          h.style.background = '#1a1a2a';
          h.style.borderRadius = '4px';
          h.style.padding = '4px 8px';
          setTimeout(() => { h.style.background = ''; h.style.padding = ''; }, 2000);
          break;
        }
      }
    }, 50);
  }
}

function renderFlow(flowId) {
  const flow = flows.find(f => f.id === flowId);
  if (!flow) return;
  setActiveNav(flowId);
  history.replaceState(null, '', '#' + flowId);
  const content = document.getElementById('content');
  const typeColors = { strategic: '#6b8cae', operational: '#6b9e5a', relationship: '#c45c5c' };
  const color = typeColors[flow.type] || '#888';

  let stepsHtml = flow.steps.map((s, i) => {
    let refHtml = '';
    if (s.status === 'link') {
      const fileLabel = (files.find(f => f.id === s.linkId) || {}).label || s.linkId;
      refHtml = `<a class="flow-step-ref" data-link-id="${s.linkId}" ${s.anchor ? `data-anchor="${s.anchor}"` : ''}>&rarr; ${fileLabel}</a>`;
    }
    let tbdHtml = '';
    if (s.status === 'tbd' && s.tbd) {
      tbdHtml = `<div class="flow-step-tbd"><strong>What to build:</strong> ${s.tbd}</div>`;
    }
    return `<div class="flow-step">
      <div class="flow-step-rail">
        <div class="flow-step-dot ${s.status}"></div>
        ${i < flow.steps.length - 1 ? '<div class="flow-step-line"></div>' : ''}
      </div>
      <div class="flow-step-body">
        <div class="flow-step-label">${s.label}</div>
        <div class="flow-step-desc">${s.desc}</div>
        ${refHtml}${tbdHtml}
      </div>
    </div>`;
  }).join('');

  const linked = flow.steps.filter(s => s.status === 'link').length;
  const tbd = flow.steps.filter(s => s.status === 'tbd').length;
  const trigger = flow.steps.filter(s => s.status === 'trigger').length;

  content.innerHTML = `
    <h1>${flow.label}</h1>
    <div class="flow-meta">
      <span class="flow-type ${flow.type}">${flow.type}</span>
      <div class="flow-bar"><div class="flow-bar-fill" style="width:${flow.complete}%;background:${color}"></div></div>
      <span class="flow-pct-label">${flow.complete}%</span>
    </div>
    <p style="color:#888;font-size:13px;margin-bottom:24px">${linked} steps linked to KB &middot; ${tbd} steps to build &middot; ${flow.steps.length} total</p>
    <div class="flow-steps">${stepsHtml}</div>
  `;
  document.querySelector('main').scrollTop = 0;

  // Wire up step links
  content.querySelectorAll('.flow-step-ref').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const lid = a.dataset.linkId;
      const anchor = a.dataset.anchor;
      if (anchor) { loadFileWithAnchor(lid, anchor); }
      else { loadFile(lid); }
    });
  });
}

function renderClientPage(profileId) {
  const profiles = getProfiles();
  const activeId = profileId || getActiveId();
  const profile = profiles[activeId];
  setActiveNav('client-page');
  history.replaceState(null, '', '#client-page');
  const content = document.getElementById('content');

  function field(key, label, placeholder, linkId) {
    const val = profile ? (profile.data[key] || '') : '';
    const escaped = val.replace(/"/g, '&quot;');
    const linkHtml = linkId ? `<a class="client-field-link" data-link-id="${linkId}">\u2192 ${(files.find(f => f.id === linkId) || {}).label}</a>` : '';
    return `<div class="client-field"><span class="client-field-label">${label}</span><input type="text" data-key="${key}" value="${escaped}" placeholder="${placeholder}" ${!profile ? 'disabled' : ''} />${linkHtml}</div>`;
  }
  function sel(key, label, options, linkId) {
    const val = profile ? (profile.data[key] || '') : '';
    const linkHtml = linkId ? `<a class="client-field-link" data-link-id="${linkId}">\u2192 ${(files.find(f => f.id === linkId) || {}).label}</a>` : '';
    const opts = options.map(o => `<option value="${o.value}" ${val === o.value ? 'selected' : ''}>${o.label}</option>`).join('');
    return `<div class="client-field"><span class="client-field-label">${label}</span><select data-key="${key}" ${!profile ? 'disabled' : ''}><option value="">\u2014 select \u2014</option>${opts}</select>${linkHtml}</div>`;
  }
  function ta(key, label, placeholder) {
    const val = profile ? (profile.data[key] || '') : '';
    return `<div class="client-field"><span class="client-field-label">${label}</span><textarea data-key="${key}" placeholder="${placeholder}" ${!profile ? 'disabled' : ''}>${val.replace(/</g,'&lt;')}</textarea></div>`;
  }

  const profileKeys = Object.keys(profiles);
  const profileOpts = profileKeys.map(k => `<option value="${k}" ${k === activeId ? 'selected' : ''}>${profiles[k].name}</option>`).join('');
  const d = profile ? profile.data : {};
  const score = calcLeadScore(d);
  const cat = scoreCategory(score);
  const timeline = calcTimeline(d);
  const rFlows = profile ? relevantFlows(d) : [];

  content.innerHTML = `
    <h1>Buyer Profile</h1>
    <div class="profile-bar">
      <select id="profile-select"><option value="">\u2014 select client \u2014</option>${profileOpts}</select>
      <button id="new-profile-btn" class="btn-green">+ New Client</button>
      ${profile ? '<button id="delete-profile-btn" class="btn-danger">Delete</button>' : ''}
      <div style="flex:1"></div>
      <select id="load-test-btn" style="max-width:260px"><option value="">Load test profile...</option>${testProfiles.map((p, i) => `<option value="${i}">${p.name}</option>`).join('')}</select>
    </div>

    ${profile ? `
    <div class="client-section" style="border-color:#333">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        Score & Routing
        <span><span class="score-value">${score}</span><span style="color:#888;font-size:13px">/ 21</span></span>
      </h3>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <span class="score-badge ${cat.cls}">${cat.label}</span>
        <span style="font-size:13px;color:#888">${cat.cadence}</span>
      </div>
      <div style="font-size:13px;color:#888;margin-bottom:8px">
        <strong style="color:#e0e0e0">Timeline:</strong> ${timeline}
      </div>
      <div style="font-size:13px;color:#888">
        <strong style="color:#e0e0e0">Relevant flows:</strong>
        <div class="flow-tags">
          ${rFlows.map(f => {
            const flow = flows.find(fl => fl.id === f.id);
            const type = flow ? flow.type : 'strategic';
            return `<a class="flow-tag flow-tag-${type}" data-flow-id="${f.id}">${f.label}</a>`;
          }).join('')}
        </div>
      </div>
    </div>
    ` : `<div class="client-section" style="text-align:center;padding:40px 20px">
      <p style="color:#555;font-size:14px">Select a client or create a new one to get started.</p>
    </div>`}

    <div class="client-section">
      <h3>Profile</h3>
      ${field('name', 'Name', 'Full name(s)')}
      ${field('contact', 'Contact', 'Phone, email')}
      ${field('from', 'Relocating from', 'City, state or country')}
      ${field('source', 'Lead source', 'Referral, website, open house...')}
      ${sel('buyerType', 'Buyer type', [
        { value: 'first-time', label: 'First-time buyer' },
        { value: 'move-up', label: 'Move-up (owns current home)' },
        { value: 'relocating', label: 'Relocating (employer-driven)' },
        { value: 'investor-cash', label: 'Investor (cash)' },
        { value: 'investor-financed', label: 'Investor (financed)' },
        { value: 'foreign', label: 'Foreign buyer / NRA' },
        { value: 'retiree', label: 'Retiree / downsizer' },
      ])}
      ${field('hhi', 'Household income', '$___K')}
      ${field('kids', 'Kids / household', 'Ages, count')}
    </div>

    <div class="client-section">
      <h3>Lead Scoring</h3>
      ${sel('preApproval', 'Pre-approval', [
        { value: 'approved', label: 'Pre-approved, letter in hand (+3)' },
        { value: 'in-progress', label: 'Application started (+2)' },
        { value: 'planning', label: 'Planning to apply (+1)' },
        { value: 'none', label: 'No plans (+0)' },
      ], 'financing')}
      ${sel('timeline', 'Timeline', [
        { value: 'under-60', label: 'Under 60 days (+3)' },
        { value: '2-4mo', label: '2\u20134 months (+2)' },
        { value: '4-6mo', label: '4\u20136 months (+1)' },
        { value: '6plus', label: '6+ months or just looking (+0)' },
      ])}
      ${sel('motivation', 'Motivation', [
        { value: 'relocating', label: 'Relocating / lease ending / life event (+3)' },
        { value: 'lease-ending', label: 'Lease ending (+3)' },
        { value: 'wants-to-buy', label: 'Wants to buy, flexible timing (+2)' },
        { value: 'exploring', label: 'Casually exploring (+1)' },
        { value: 'none', label: 'No clear reason (+0)' },
      ])}
      ${sel('budgetClarity', 'Budget clarity', [
        { value: 'knows-exact', label: 'Knows payment + down payment (+3)' },
        { value: 'general-range', label: 'General range (+2)' },
        { value: 'whatever', label: '"Whatever we qualify for" (+1)' },
        { value: 'no-idea', label: 'No idea (+0)' },
      ])}
      ${sel('marketKnowledge', 'Market knowledge', [
        { value: 'visited', label: 'Knows areas, visited Orlando (+3)' },
        { value: 'researching', label: 'Researching online 2+ months (+2)' },
        { value: 'just-started', label: 'Just started looking (+1)' },
        { value: 'none', label: 'No research (+0)' },
      ])}
      ${sel('agentCommitment', 'Agent commitment', [
        { value: 'not-working', label: 'Not working with another agent (+3)' },
        { value: 'talked-few', label: 'Talked to a few (+2)' },
        { value: 'expired', label: 'Had agent, agreement expired (+1)' },
        { value: 'under-contract', label: 'Under contract with another (+0)' },
      ])}
      ${sel('responsiveness', 'Responsiveness', [
        { value: 'hours', label: 'Replies within hours (+3)' },
        { value: 'day', label: 'Replies within a day (+2)' },
        { value: 'slow', label: 'Slow responses (+1)' },
        { value: 'ghosting', label: 'Ghosting (+0)' },
      ])}
      ${profile && d.buyerType === 'move-up' ? sel('homeToSell', 'Current home status', [
        { value: 'sold', label: 'Already sold or under contract' },
        { value: 'listed', label: 'Currently listed' },
        { value: 'not-listed', label: 'Not yet listed' },
      ]) : ''}
    </div>

    <div class="client-section">
      <h3>Financial Snapshot</h3>
      ${field('budget', 'Budget range', '$___K\u2013$___K')}
      ${field('monthlyPayment', 'Monthly payment tolerance', '$___/mo', 'taxes')}
      ${sel('financing', 'Financing type', [
        { value: 'conventional', label: 'Conventional' },
        { value: 'fha', label: 'FHA' },
        { value: 'va', label: 'VA' },
        { value: 'cash', label: 'Cash' },
        { value: 'foreign-national', label: 'Foreign national loan' },
        { value: 'dscr', label: 'DSCR (investor)' },
      ], 'financing')}
      ${field('downPayment', 'Down payment', 'Amount and source')}
      ${field('lender', 'Lender', 'Name and contact')}
      ${d.buyerType === 'foreign' ? field('currencyPlan', 'Currency transfer plan', 'Wise, bank wire, timeline', 'brazilian') : ''}
    </div>

    <div class="client-section">
      <h3>Search Criteria</h3>
      ${field('neighborhoods', 'Target neighborhoods', 'Areas of interest', 'neighborhoods')}
      ${field('mustHaves', 'Must-haves', 'Beds, baths, pool, garage...')}
      ${field('dealBreakers', 'Deal-breakers', 'Flood zone, HOA limit, school zone...', 'risks')}
      ${field('commute', 'Commute requirements', 'Workplace, max drive time', 'infrastructure')}
      ${sel('propertyType', 'Property type', [
        { value: 'sfr', label: 'Single family' },
        { value: 'townhome', label: 'Townhome' },
        { value: 'condo', label: 'Condo' },
        { value: 'new-construction', label: 'New construction' },
      ])}
    </div>

    <div class="client-section">
      <h3>Notes</h3>
      ${ta('notes', 'Agent notes', 'Key observations, concerns, action items...')}
    </div>
  `;
  document.querySelector('main').scrollTop = 0;

  // Wire KB links
  content.querySelectorAll('.client-field-link').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); loadFile(a.dataset.linkId); });
  });
  // Wire flow tags
  content.querySelectorAll('.flow-tag').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); renderFlow(a.dataset.flowId); });
  });
  // Auto-save on input change
  content.querySelectorAll('input, select, textarea').forEach(el => {
    if (!el.dataset.key) return;
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      if (!profile) return;
      profile.data[el.dataset.key] = el.value;
      if (el.dataset.key === 'name' && el.value.trim()) profile.name = el.value.trim();
      const allProfiles = getProfiles();
      allProfiles[activeId] = profile;
      saveProfiles(allProfiles);
      const scoringFields = ['preApproval','timeline','motivation','budgetClarity','marketKnowledge','agentCommitment','responsiveness','buyerType','homeToSell'];
      if (scoringFields.includes(el.dataset.key)) renderClientPage(activeId);
      updateClientNav();
    });
  });
  // Profile switcher
  const profileSelect = document.getElementById('profile-select');
  if (profileSelect) profileSelect.addEventListener('change', () => {
    if (profileSelect.value) { setActiveClientId(profileSelect.value); renderClientPage(profileSelect.value); }
  });
  // New profile
  document.getElementById('new-profile-btn').addEventListener('click', () => {
    const id = createProfile('New Client'); updateClientNav(); renderClientPage(id);
  });
  // Delete
  const deleteBtn = document.getElementById('delete-profile-btn');
  if (deleteBtn) deleteBtn.addEventListener('click', () => {
    if (confirm('Delete this client profile?')) { deleteProfile(activeId); updateClientNav(); renderClientPage(); }
  });
  // Load test profile
  const loadTestBtn = document.getElementById('load-test-btn');
  if (loadTestBtn) loadTestBtn.addEventListener('change', () => {
    const idx = parseInt(loadTestBtn.value);
    if (isNaN(idx)) return;
    const tp = testProfiles[idx];
    const id = createProfile(tp.name);
    const allProfiles = getProfiles();
    const data = {};
    for (const k of Object.keys(tp)) if (k !== 'name') data[k] = tp[k];
    allProfiles[id].data = data;
    saveProfiles(allProfiles);
    updateClientNav();
    renderClientPage(id);
  });
}

// ─── Home Swap Calculator ───
function calcMortgagePayment(principal, annualRate, years) {
  const r = annualRate / 100 / 12;
  const n = years * 12;
  if (r === 0) return principal / n;
  return principal * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
}

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

      <h3>Your Current Situation</h3>
      <div class="calc-input-grid">
        <div class="calc-input-group">
          <label>Current Home Value</label>
          <div class="calc-input-wrap">
            <span class="calc-prefix">$</span>
            <input type="text" id="calc-home-value" class="has-prefix" placeholder="400,000" inputmode="numeric" />
          </div>
        </div>
        <div class="calc-input-group">
          <label>Mortgage Balance (what you owe)</label>
          <div class="calc-input-wrap">
            <span class="calc-prefix">$</span>
            <input type="text" id="calc-balance" class="has-prefix" placeholder="250,000" inputmode="numeric" />
          </div>
        </div>
        <div class="calc-input-group">
          <label>Current Monthly Payment</label>
          <div class="calc-input-wrap">
            <span class="calc-prefix">$</span>
            <input type="text" id="calc-current-payment" class="has-prefix" placeholder="2,100" inputmode="numeric" />
          </div>
        </div>
        <div class="calc-input-group">
          <label>When did you buy?</label>
          <select id="calc-purchase-year">
            <option value="">Select year...</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
            <option value="2016">2016</option>
            <option value="2015">2015 or earlier</option>
          </select>
          <div id="calc-rate-hint" class="calc-rate-hint"></div>
        </div>
        <div class="calc-input-group" style="grid-column: 1 / -1">
          <label>New Home Target Price</label>
          <div class="calc-input-wrap">
            <span class="calc-prefix">$</span>
            <input type="text" id="calc-target" class="has-prefix" placeholder="475,000" inputmode="numeric" />
          </div>
        </div>
      </div>

      <details class="calc-advanced">
        <summary>Adjust assumptions</summary>
        <div class="calc-advanced-grid">
          <div class="calc-adv-group">
            <label>Interest rate %</label>
            <input type="text" id="calc-rate" value="6.75" />
          </div>
          <div class="calc-adv-group">
            <label>Property tax rate %</label>
            <input type="text" id="calc-tax-rate" value="0.93" />
          </div>
          <div class="calc-adv-group">
            <label>Annual insurance $</label>
            <input type="text" id="calc-insurance" value="2400" />
          </div>
          <div class="calc-adv-group">
            <label>Selling costs %</label>
            <input type="text" id="calc-sell-costs" value="7" />
          </div>
          <div class="calc-adv-group">
            <label>Monthly HOA $</label>
            <input type="text" id="calc-hoa" value="0" />
          </div>
          <div class="calc-adv-group">
            <label>Loan term (years)</label>
            <input type="text" id="calc-term" value="30" />
          </div>
        </div>
      </details>
    </div>

    <div id="calc-results" class="calc-results">
      <div class="client-section" style="border-color:#333">
        <h3 style="color:#c9a84c">Your Equity</h3>
        <div id="calc-equity-details"></div>
      </div>

      <div class="client-section" style="border-color:#333">
        <h3 style="color:#6b8cae">New Home Financing</h3>
        <div id="calc-financing-details"></div>
      </div>

      <div class="client-section" style="border-color:#6b9e5a">
        <h3>The Bottom Line</h3>
        <div id="calc-bottom-line"></div>
        <div class="calc-buydown-row" style="margin-top:16px">
          <label>
            <input type="checkbox" id="calc-buydown-toggle" style="margin-right:6px" />
            Use 1 point to buy down the rate (−0.25%)
          </label>
          <span id="calc-buydown-cost" style="font-size:12px;color:#555"></span>
        </div>
      </div>

      <div class="client-section" style="border-color:#222">
        <h3 style="color:#6b8cae">Programs & Next Steps</h3>
        <div id="calc-programs"></div>
      </div>
    </div>
  `;
  document.querySelector('main').scrollTop = 0;

  // Parse dollar input → number
  function parseDollar(v) {
    return parseFloat(v.replace(/[^0-9.]/g, '')) || 0;
  }

  // Typical 30yr fixed rates by year (approximate annual averages)
  const historicalRates = {
    '2015': 3.85, '2016': 3.65, '2017': 3.99, '2018': 4.54, '2019': 3.94,
    '2020': 3.11, '2021': 2.96, '2022': 5.34, '2023': 6.81, '2024': 6.72, '2025': 6.65,
  };

  function recalc() {
    const homeValue = parseDollar(document.getElementById('calc-home-value').value);
    const balance = parseDollar(document.getElementById('calc-balance').value);
    const currentPayment = parseDollar(document.getElementById('calc-current-payment').value);
    const target = parseDollar(document.getElementById('calc-target').value);
    const purchaseYear = document.getElementById('calc-purchase-year').value;
    const rate = parseFloat(document.getElementById('calc-rate').value) || 6.75;
    const taxRate = parseFloat(document.getElementById('calc-tax-rate').value) || 0.93;
    const insurance = parseDollar(document.getElementById('calc-insurance').value);
    const sellCostsPct = parseFloat(document.getElementById('calc-sell-costs').value) || 7;
    const hoa = parseDollar(document.getElementById('calc-hoa').value);
    const term = parseInt(document.getElementById('calc-term').value) || 30;
    const buydown = document.getElementById('calc-buydown-toggle').checked;

    // Show rate hint based on purchase year
    const rateHint = document.getElementById('calc-rate-hint');
    const oldRate = historicalRates[purchaseYear];
    if (purchaseYear && oldRate) {
      const rateDiff = rate - oldRate;
      if (oldRate < 5) {
        rateHint.innerHTML = `You likely locked in around <strong>${oldRate}%</strong>. Today's rates are ~${rate}%, but your equity makes up for it.`;
      } else {
        rateHint.innerHTML = `Rates in ${purchaseYear} averaged <strong>${oldRate}%</strong> \u2014 similar to today. A move won't change your rate much.`;
      }
    } else {
      rateHint.textContent = '';
    }

    const results = document.getElementById('calc-results');
    if (!homeValue || !balance || !target) { results.classList.remove('visible'); return; }
    results.classList.add('visible');

    // Equity
    const grossEquity = homeValue - balance;
    const sellingCosts = homeValue * (sellCostsPct / 100);
    const netEquity = grossEquity - sellingCosts;
    const equityPct = (grossEquity / homeValue * 100);

    // Years of equity built
    const yearsOwned = purchaseYear ? (2026 - parseInt(purchaseYear)) : 0;

    // Financing
    const downPayment = Math.max(0, netEquity);
    const dpPct = (downPayment / target * 100);
    const effectiveRate = buydown ? Math.max(rate - 0.25, 0) : rate;
    const loanAmount = target - downPayment;
    const pointsCost = buydown ? (loanAmount * 0.01) : 0;
    const pi = loanAmount > 0 ? calcMortgagePayment(loanAmount, effectiveRate, term) : 0;
    const monthlyTax = target * (taxRate / 100) / 12;
    const monthlyInsurance = insurance / 12;
    const pmi = dpPct < 20 ? (loanAmount * 0.005 / 12) : 0;
    const newPayment = pi + monthlyTax + monthlyInsurance + hoa + pmi;
    const diff = newPayment - currentPayment;

    // Equity section
    document.getElementById('calc-equity-details').innerHTML = `
      <div class="calc-hero">
        <div class="calc-hero-card">
          <div class="val" style="color:#c9a84c">${fmt(grossEquity)}</div>
          <div class="lbl">Gross Equity</div>
        </div>
        <div class="calc-hero-card">
          <div class="val" style="color:#888">${fmt(sellingCosts)}</div>
          <div class="lbl">Selling Costs (${sellCostsPct}%)</div>
        </div>
        <div class="calc-hero-card">
          <div class="val" style="color:${netEquity > 0 ? '#6b9e5a' : '#c45c5c'}">${fmt(netEquity)}</div>
          <div class="lbl">Net Equity (Your Down Payment)</div>
        </div>
      </div>
      <div style="font-size:12px;color:#555;margin-bottom:4px">Equity vs Mortgage</div>
      <div class="calc-equity-bar">
        <div class="calc-equity-fill" style="width:${Math.min(equityPct, 100)}%;background:#c9a84c;border-radius:12px 0 0 12px"></div>
        <div class="calc-equity-fill" style="width:${Math.min(100 - equityPct, 100)}%;background:#333;border-radius:0 12px 12px 0"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#888">
        <span>Equity: ${equityPct.toFixed(0)}%</span>
        <span>Owed: ${(100 - equityPct).toFixed(0)}%</span>
      </div>
      ${yearsOwned > 0 ? `<div style="margin-top:12px;font-size:13px;color:#6b9e5a;background:#0d1a0d;padding:10px 14px;border-radius:6px;border-left:3px solid #6b9e5a">
        ${yearsOwned} year${yearsOwned > 1 ? 's' : ''} of ownership built <strong style="color:#fff">${fmt(grossEquity)}</strong> in equity${oldRate && oldRate < 5 ? `. You locked in at ~${oldRate}% \u2014 today's rates are higher, but your equity is your superpower.` : '.'}
      </div>` : ''}
    `;

    // Financing section
    document.getElementById('calc-financing-details').innerHTML = `
      <div class="calc-line-item"><span class="k">New home price</span><span class="v">${fmt(target)}</span></div>
      <div class="calc-line-item"><span class="k">Down payment from equity</span><span class="v green">${fmt(downPayment)} (${dpPct.toFixed(1)}%)</span></div>
      <div class="calc-line-item"><span class="k">Loan amount</span><span class="v">${fmt(loanAmount)}</span></div>
      <div class="calc-line-item"><span class="k">Interest rate</span><span class="v">${effectiveRate.toFixed(2)}%${buydown ? ' (bought down)' : ''}</span></div>
      <div class="calc-line-item"><span class="k">Principal & interest</span><span class="v">${fmt(pi)}/mo</span></div>
      <div class="calc-line-item"><span class="k">Property tax</span><span class="v">${fmt(monthlyTax)}/mo</span></div>
      <div class="calc-line-item"><span class="k">Insurance</span><span class="v">${fmt(monthlyInsurance)}/mo</span></div>
      ${hoa > 0 ? `<div class="calc-line-item"><span class="k">HOA</span><span class="v">${fmt(hoa)}/mo</span></div>` : ''}
      ${pmi > 0 ? `<div class="calc-line-item"><span class="k">PMI (est.)</span><span class="v red">${fmt(pmi)}/mo</span></div>` : ''}
      ${dpPct >= 20 ? `<div class="calc-line-item"><span class="k">PMI</span><span class="v green">Not required (${dpPct.toFixed(0)}% down)</span></div>` : ''}
    `;

    // Bottom line
    const diffClass = Math.abs(diff) < 500 ? 'calc-diff-green' : diff < 1000 ? 'calc-diff-orange' : 'calc-diff-red';
    const diffSign = diff >= 0 ? '+' : '';
    document.getElementById('calc-bottom-line').innerHTML = `
      <div class="calc-comparison">
        <div class="calc-compare-box">
          <div class="payment">${fmt(currentPayment)}</div>
          <div class="label">Current Payment</div>
        </div>
        <div class="calc-arrow">\u2192</div>
        <div class="calc-compare-box" style="border-color:${diff < 500 ? '#6b9e5a' : diff < 1000 ? '#c9a84c' : '#c45c5c'}">
          <div class="payment">${fmt(newPayment)}</div>
          <div class="label">New Estimated Payment</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:8px">
        <span class="calc-diff-badge ${diffClass}">${diffSign}${fmt(diff)}/mo</span>
        <span style="color:#888;font-size:14px">${diff < 500 ? 'Very manageable upgrade' : diff < 1000 ? 'Moderate increase' : 'Significant increase \u2014 consider a lower target or rate buydown'}</span>
      </div>
    `;

    // Buydown cost label
    document.getElementById('calc-buydown-cost').textContent = buydown
      ? `(1 point = ${fmt(pointsCost)} at closing)`
      : '';

    // Programs section
    const programs = [];
    programs.push({
      title: 'Bridge Loan / Buy-Before-You-Sell',
      desc: 'Programs like Knock, HomeLight, or local lender bridge loans let you buy your new home before selling your current one. Your equity is used as collateral. Ask your lender about bridge-to-sale options.'
    });
    if (dpPct < 20) {
      programs.push({
        title: 'Down Payment Assistance',
        desc: `Your net equity covers ${dpPct.toFixed(0)}% down. City of Orlando offers up to $45,000 in forgivable DPA (50% AMI required). Orange County offers up to $70,000 for very low income, $40,000 for low income.`
      });
    }
    programs.push({
      title: 'Rate Buydown with Points',
      desc: `Each point costs ~1% of the loan (${fmt(loanAmount * 0.01)}) and typically reduces your rate by 0.25%. Toggle the checkbox above to see the impact. Some builders offer free buydowns on new construction.`
    });
    if (netEquity > 50000) {
      programs.push({
        title: 'Strong Equity Position',
        desc: `With ${fmt(netEquity)} in net equity, you have significant negotiating power. You can use part for down payment and part to buy down your rate, covering closing costs, or keeping reserves.`
      });
    }

    document.getElementById('calc-programs').innerHTML = programs.map(p =>
      `<div class="calc-program-card"><h4>${p.title}</h4><p>${p.desc}</p></div>`
    ).join('');
  }

  // Wire up inputs and selects
  document.querySelectorAll('#content input').forEach(input => {
    input.addEventListener('input', recalc);
    input.addEventListener('change', recalc);
  });
  document.querySelectorAll('#content select').forEach(sel => {
    sel.addEventListener('change', recalc);
  });
}

// ─── Client nav in sidebar ───
function updateClientNav() {
  document.querySelectorAll('.client-nav-item, .client-nav-heading').forEach(el => el.remove());
  const profiles = getProfiles();
  const keys = Object.keys(profiles);
  if (keys.length === 0) return;
  const navLinks = document.getElementById('nav-links');
  const heading = document.createElement('h2');
  heading.textContent = 'Clients';
  heading.className = 'client-nav-heading';
  heading.style.cssText = 'font-size:11px;padding:16px 16px 6px;color:#555;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;';
  heading.addEventListener('click', () => renderClientPage());
  navLinks.appendChild(heading);
  keys.forEach(k => {
    const p = profiles[k];
    const a = document.createElement('a');
    a.href = '#client-page';
    a.className = 'flow-link client-nav-item';
    a.dataset.id = 'client-' + k;
    a.innerHTML = `<span>${p.name}</span>`;
    a.addEventListener('click', e => { e.preventDefault(); setActiveClientId(k); renderClientPage(k); });
    navLinks.appendChild(a);
  });
}
updateClientNav();

// Search
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
let searchTimeout;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 200);
});

async function doSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) {
    searchResults.style.display = 'none';
    document.getElementById('nav-links').style.display = '';
    return;
  }

  // Ensure all files are cached
  await Promise.all(files.map(f => fetchFile(f.id)));

  const results = [];
  for (const f of files) {
    const text = cache[f.id];
    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].toLowerCase().includes(q)) {
        results.push({ file: f, line: lines[i].trim(), lineNum: i });
        if (results.length > 30) break;
      }
    }
    if (results.length > 30) break;
  }

  searchResults.innerHTML = '';
  document.getElementById('nav-links').style.display = 'none';
  searchResults.style.display = '';

  if (results.length === 0) {
    searchResults.innerHTML = '<div style="padding:8px 0;color:#555;font-size:12px">No results</div>';
    return;
  }

  for (const r of results) {
    const div = document.createElement('div');
    div.className = 'search-result';
    div.style.cursor = 'pointer';
    const escaped = r.line.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const highlighted = escaped.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
    div.innerHTML = `<div class="file">${r.file.label}</div><div class="line">${highlighted.slice(0, 120)}</div>`;
    div.addEventListener('click', () => {
      loadFile(r.file.id);
      searchInput.value = '';
      searchResults.style.display = 'none';
      document.getElementById('nav-links').style.display = '';
    });
    searchResults.appendChild(div);
  }
}

// ─── PostMessage Bridge (mception portal ↔ viewer) ───
const ORLANDO_SAVED_KEY = 'orlando-saved-items';
function getOSavedItems() { return JSON.parse(localStorage.getItem(ORLANDO_SAVED_KEY) || '[]'); }
function addOSavedItem(item) {
  const items = getOSavedItems();
  const entry = { id: 'item-' + Date.now(), ...item, createdAt: new Date().toISOString() };
  items.push(entry);
  localStorage.setItem(ORLANDO_SAVED_KEY, JSON.stringify(items));
  return entry;
}

window.addEventListener('message', function(event) {
  if (event.data?.source !== 'mception-portal') return;
  const { type, payload, requestId } = event.data;

  if (type === 'navigate') {
    if (payload.pageId && fileMap[payload.pageId]) {
      if (payload.section) {
        loadFileWithAnchor(payload.pageId, payload.section);
      } else {
        loadFile(payload.pageId);
      }
    }
    respond({ status: 'ok', currentPage: currentFile });
  }

  if (type === 'save_item') {
    const item = addOSavedItem({
      title: payload.title || 'Untitled',
      type: payload.itemType || 'note',
      body: payload.content || '',
      source: 'portal-chat',
    });
    respond({ status: 'ok', itemId: item.id });
  }

  if (type === 'get_state') {
    respond({
      currentPage: currentFile,
      savedItems: getOSavedItems(),
      availablePages: files.map(f => ({ id: f.id, label: f.label })),
    });
  }

  function respond(data) {
    if (!requestId) return;
    parent.postMessage({
      source: 'mception-viewer',
      type: type === 'get_state' ? 'state_response' : 'action_response',
      requestId,
      payload: data,
    }, '*');
  }
});

// Tell portal we're ready
parent.postMessage({ source: 'mception-viewer', type: 'ready', payload: { project: 'orlando' } }, '*');
