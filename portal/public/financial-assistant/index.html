<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Cockpit</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0C0F14;
      --bg-card: #13161D;
      --bg-card-alt: #181C25;
      --gold: #D4A843;
      --gold-dim: #9A7B32;
      --blue: #4A7FB5;
      --dark-blue: #1E3A5F;
      --white: #F0EDE6;
      --gray: #8A8D94;
      --gray-light: #B0B3BA;
      --red: #C45C5C;
      --red-dim: #8B3A3A;
      --green: #7CB97A;
      --green-bg: rgba(124, 185, 122, 0.10);
      --yellow: #D4A843;
      --yellow-bg: rgba(212, 168, 67, 0.10);
      --red-bg: rgba(196, 92, 92, 0.10);
      --blue-bg: rgba(74, 127, 181, 0.10);
      --radius: 8px;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--white); line-height: 1.5;
      padding: 32px 52px 40px; max-width: 1100px; margin: 0 auto;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(212,168,67,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,168,67,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* HEADER */
    header { margin-bottom: 28px; padding-bottom: 16px; border-bottom: 2px solid var(--gold-dim); }
    header h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700;
      letter-spacing: -0.5px; color: var(--white);
    }
    .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--gray); margin-top: 6px; }
    .stale { color: var(--red); font-weight: 600; }

    /* SECTION HEADERS */
    .section-header {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--gold);
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .section-header::after {
      content: ''; flex: 1; height: 1px; background: rgba(212,168,67,0.25);
    }

    /* GRIDS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    @media (max-width: 700px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      body { padding: 20px; }
    }

    /* CARDS */
    .card {
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius); padding: 16px;
      border-top: 3px solid var(--gold-dim);
    }
    .card.card-red { border-top-color: var(--red); }
    .card.card-green { border-top-color: var(--green); }
    .card.card-blue { border-top-color: var(--blue); }
    .card h3 {
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 2px; color: var(--gray); margin-bottom: 6px;
    }
    .big {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--gold);
    }
    .med {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .small { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; color: var(--gray); margin-top: 3px; }
    .c-green { color: var(--green); }
    .c-red { color: var(--red); }
    .c-gold { color: var(--gold); }

    /* SECTIONS */
    .section {
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    }

    /* BAR ROWS */
    .bar-row {
      display: flex; align-items: center; padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.8rem;
    }
    .bar-row:last-child { border-bottom: none; }
    .bar-label { width: 160px; flex-shrink: 0; font-family: 'DM Sans', sans-serif; color: var(--gray-light); }
    .bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; margin: 0 12px; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-val {
      width: 80px; text-align: right; font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; font-variant-numeric: tabular-nums; flex-shrink: 0; color: var(--white);
    }

    /* TABLES */
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th {
      text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray);
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    td {
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-variant-numeric: tabular-nums; color: var(--gray-light);
    }
    tr:last-child td { border-bottom: none; }
    .amt-neg { color: var(--red); }
    .amt-pos { color: var(--green); }
    .acct-brady { color: var(--blue); }
    .acct-karissa { color: var(--gold); }
    .acct-kids { color: var(--gray); }

    /* FLAGS / BADGES */
    .flag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .flag-red { background: var(--red-bg); color: var(--red); }
    .flag-yellow { background: var(--yellow-bg); color: var(--gold); }
    .flag-green { background: var(--green-bg); color: var(--green); }
    .flag-blue { background: var(--blue-bg); color: var(--blue); }

    /* ALERT BOX */
    .alert-box {
      background: var(--bg-card); border: 1px solid rgba(196,92,92,0.2);
      border-top: 3px solid var(--red);
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 24px;
      font-size: 0.8rem; color: var(--gray-light);
    }
    .alert-box strong { color: var(--red); }

    /* BUDGET TIER ROWS */
    .budget-tier {
      display: flex; align-items: center; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .budget-tier:last-child { border-bottom: none; }
    .budget-tier-name {
      width: 220px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-light);
    }
    .budget-tier-bar { flex: 1; height: 10px; background: rgba(255,255,255,0.04); border-radius: 5px; overflow: hidden; margin: 0 14px; }
    .budget-tier-fill { height: 100%; border-radius: 5px; }
    .budget-tier-val {
      width: 80px; text-align: right; font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem; font-weight: 600; flex-shrink: 0; color: var(--white);
    }
    .budget-tier-items {
      font-size: 0.7rem; color: var(--gray); margin-left: 220px; padding: 2px 0 6px 14px;
      font-family: 'DM Sans', sans-serif;
    }

    /* BUDGET TOTALS */
    .budget-totals {
      display: flex; justify-content: flex-end; gap: 28px; padding-top: 12px;
      margin-top: 8px; border-top: 1px solid rgba(212,168,67,0.2);
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--gray);
    }
    .budget-totals strong {
      font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; color: var(--gold);
    }

    /* QUESTION ROWS */
    .q-row { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.8rem; color: var(--gray-light); }
    .q-row:last-child { border-bottom: none; }
    .q-row strong { color: var(--white); }

    /* ZEROED-OUT STYLE */
    .zeroed { text-decoration: line-through; color: var(--gray); }

    /* FOOTER */
    footer {
      text-align: center; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 28px; font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; letter-spacing: 1px; color: var(--gray);
    }

    /* FAMILY BUDGET BARS */
    .fb-row {
      display: flex; align-items: center; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .fb-row:last-child { border-bottom: none; }
    .fb-label { width: 180px; flex-shrink: 0; font-size: 0.78rem; color: var(--gray-light); }
    .fb-bar-outer { flex: 1; height: 8px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; margin: 0 12px; position: relative; }
    .fb-bar-budget { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; opacity: 0.25; }
    .fb-bar-actual { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; }
    .fb-bar-sub { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; }
    .fb-vals { width: 140px; flex-shrink: 0; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }
    .fb-notes { font-size: 0.65rem; color: var(--gray); margin-left: 180px; padding: 0 0 4px 12px; }
    .fb-tbd { border: 1px dashed rgba(255,255,255,0.12); border-radius: 4px; padding: 2px 6px; font-size: 0.6rem; color: var(--gray); }

    /* NO DATA */
    .no-data {
      text-align: center; padding: 60px 20px; color: var(--gray);
      font-family: 'DM Sans', sans-serif; font-size: 1rem;
    }
    .no-data code { color: var(--gold); }
  </style>
</head>
<body>

<div id="app"></div>

<script src="data.js"></script>
<script>
(function() {
  const D = window.COCKPIT_DATA;
  const app = document.getElementById('app');

  if (!D || !D.generated) {
    app.innerHTML = `<div class="no-data" style="text-align:left;max-width:620px;margin:40px auto;padding:40px 32px">
      <h2 style="font-family:'Space Grotesk',sans-serif;font-size:1.3rem;color:var(--white);margin-bottom:16px">No data loaded</h2>
      <p style="margin-bottom:20px;color:var(--gray-light);font-size:0.85rem;line-height:1.6">
        This dashboard is generated by the <code>financial-assistant</code> skill in Brady OS.
        It parses Monarch CSV exports and enriches with Gmail, Calendar, and Notion data.
      </p>
      <div style="background:var(--bg-card);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:12px">Setup</div>
        <ol style="color:var(--gray-light);font-size:0.8rem;line-height:1.8;padding-left:18px">
          <li>Export transactions from <strong style="color:var(--white)">Monarch Money</strong> as CSV</li>
          <li>Drop the file in <code>3-reference/skills/financial-assistant/data/</code></li>
        </ol>
      </div>
      <div style="background:var(--bg-card);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:12px">Run</div>
        <p style="color:var(--gray-light);font-size:0.8rem;margin-bottom:10px">
          Open a <strong style="color:var(--white)">Claude Code</strong> or <strong style="color:var(--white)">Conductor</strong> session pointed at the <code>brady-os</code> repo, then paste:
        </p>
        <div style="background:var(--bg);border:1px solid rgba(212,168,67,0.2);border-radius:6px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--gold);line-height:1.6;cursor:pointer;position:relative" onclick="navigator.clipboard.writeText(this.innerText.replace('Copied!','').trim())" title="Click to copy">
          Run the financial-assistant skill in full mode. Publish the HTML dashboard to portal/public/financial-assistant/.
        </div>
        <div style="font-size:0.65rem;color:var(--gray);margin-top:6px">Click the prompt above to copy it</div>
      </div>
      <div style="font-size:0.72rem;color:var(--gray);line-height:1.6">
        <strong style="color:var(--gray-light)">Requires:</strong> Gmail MCP, Google Calendar MCP, Notion MCP, local filesystem access<br>
        <strong style="color:var(--gray-light)">Best on:</strong> CoWork (Claude Desktop) on Mac &mdash; or any Claude Code session with MCP access
      </div>
    </div>`;
    return;
  }

  const $ = (amt) => {
    if (amt == null) return '\u2014';
    const abs = Math.abs(amt);
    if (abs >= 1000) return '$' + abs.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return '$' + abs.toLocaleString('en-US', { minimumFractionDigits: amt % 1 !== 0 ? 2 : 0 });
  };

  const $full = (amt) => {
    if (amt == null) return '\u2014';
    const abs = Math.abs(amt);
    return '$' + abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  const colorVar = (c) => {
    const map = { green: 'var(--green)', red: 'var(--red)', yellow: 'var(--gold)', muted: 'var(--gray)', accent: 'var(--blue)' };
    return map[c] || 'var(--gray)';
  };

  const flagClass = (f) => {
    const map = { red: 'flag-red', yellow: 'flag-yellow', green: 'flag-green', blue: 'flag-blue' };
    return map[f] || '';
  };

  const statusFlag = (s) => {
    const map = { resolved: 'flag-green', open: 'flag-red', partial: 'flag-yellow', stale: 'flag-yellow', done: 'flag-green', missing: 'flag-red' };
    return map[s] || '';
  };

  const statusLabel = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // Build HTML
  let html = '';

  // HEADER
  html += `<header>
    <h1>Financial Cockpit</h1>
    <div class="meta">Monarch data through ${D.dataThrough} &middot; Scraped ${D.scrapedDate}${D.csvStaleDays > 0 ? ` &middot; <span class="stale">CSV is ${D.csvStaleDays} days stale</span>` : ''}</div>
  </header>`;

  // ALERTS
  if (D.alerts && D.alerts.length) {
    D.alerts.forEach(a => {
      html += `<div class="alert-box"><strong>${a.title}:</strong> ${a.text}</div>`;
    });
  }

  // BUDGET SECTION
  if (D.budget) {
    const b = D.budget;
    html += `<div class="section-header">Budget</div>`;

    // Three summary cards
    html += `<div class="grid-3">
      <div class="card card-red">
        <h3>12-Mo Actual Avg</h3>
        <div class="big c-red">${$(b.summary.actualAvg12mo)}<span style="font-size:0.5em;color:var(--gray)">/mo</span></div>
        <div class="small">Trailing 12-month average</div>
      </div>
      <div class="card">
        <h3>Strip Frivolous/One-Time</h3>
        <div class="big c-gold">${$(b.summary.strippedFrivolous)}<span style="font-size:0.5em;color:var(--gray)">/mo</span></div>
        <div class="small">Remove impulse &amp; non-recurring</div>
      </div>
      <div class="card card-green">
        <h3>Zero-Income Floor</h3>
        <div class="big c-green">${$(b.summary.zeroIncomeFloor)}<span style="font-size:0.5em;color:var(--gray)">/mo</span></div>
        <div class="small">Bare minimum, kids at home</div>
      </div>
    </div>`;

    // Tier breakdown
    html += `<div class="section">
      <div class="section-header">Zero-Income Monthly Burn</div>`;

    const maxTier = Math.max(...b.tiers.map(t => t.amount));
    const tierColors = ['var(--blue)', 'var(--gold)', 'var(--gray-light)', 'var(--green)', 'var(--red)'];

    b.tiers.forEach((tier, i) => {
      const pct = maxTier > 0 ? (tier.amount / maxTier * 100) : 0;
      const isZeroed = tier.amount === 0;
      html += `<div class="budget-tier">
        <span class="budget-tier-name">${tier.name}</span>
        <span class="budget-tier-bar"><span class="budget-tier-fill" style="width:${pct}%;background:${tierColors[i]}"></span></span>
        <span class="budget-tier-val${isZeroed ? ' zeroed' : ''}">${$(tier.amount)}</span>
      </div>`;
      // Item list
      const itemNames = tier.items.map(it => it.name).join(', ');
      if (isZeroed) {
        html += `<div class="budget-tier-items zeroed">${itemNames}</div>`;
      } else {
        html += `<div class="budget-tier-items">${itemNames}</div>`;
      }
    });

    // Totals
    html += `<div class="budget-totals">
      <span>Monthly <strong>${$(b.monthlyTotal)}</strong></span>
      <span>Annualized <strong>${$(b.annualized)}</strong></span>
    </div>`;

    html += `</div>`; // close section
  }

  // FAMILY BUDGET — household vs business split
  if (D.familyBudget) {
    const fb = D.familyBudget;
    html += `<div class="section-header">Family Budget &middot; ${fb.month}</div>`;
    html += `<div class="grid-2">`;

    // Family spend column
    html += `<div class="section" style="margin-bottom:0">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue)">Household</span>
        <span class="med" style="color:var(--blue)">${$(fb.familyTotal)}<span style="font-size:0.6em;color:var(--gray)">/mo</span></span>
      </div>`;

    const maxFamBudget = Math.max(...fb.categories.map(c => c.budget || 0), ...fb.categories.map(c => c.actual || 0), 1);
    fb.categories.forEach(c => {
      const hasBudget = c.budget != null && c.budget > 0;
      const budgetPct = hasBudget ? (c.budget / maxFamBudget * 100) : 0;
      const actualPct = c.actual > 0 ? (c.actual / maxFamBudget * 100) : 0;
      const subPct = c.subscription ? (c.subscription / maxFamBudget * 100) : 0;
      const overBudget = hasBudget && c.actual > c.budget;
      const barColor = overBudget ? 'var(--red)' : 'var(--blue)';

      html += `<div class="fb-row">
        <span class="fb-label">${c.name}</span>
        <span class="fb-bar-outer">
          ${hasBudget ? `<span class="fb-bar-budget" style="width:${budgetPct}%;background:var(--blue)"></span>` : ''}
          ${subPct > 0 ? `<span class="fb-bar-sub" style="width:${subPct}%;background:var(--green);opacity:0.4"></span>` : ''}
          ${c.actual > 0 ? `<span class="fb-bar-actual" style="width:${actualPct}%;background:${barColor}"></span>` : ''}
        </span>
        <span class="fb-vals">
          ${c.actual > 0 ? `<span style="color:${overBudget ? 'var(--red)' : 'var(--white)'}">${$(c.actual)}</span>` : '<span style="color:var(--gray)">$0</span>'}
          ${hasBudget ? ` <span style="color:var(--gray)">/ ${$(c.budget)}</span>` : ` <span class="fb-tbd">TBD</span>`}
        </span>
      </div>`;
    });
    html += `</div>`;

    // Business spend column
    html += `<div class="section" style="margin-bottom:0">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)">Business</span>
        <span class="med" style="color:var(--gold)">${$(fb.businessTotal)}<span style="font-size:0.6em;color:var(--gray)">/mo</span></span>
      </div>`;

    const maxBizBudget = Math.max(...fb.businessCategories.map(c => c.budget || 0), ...fb.businessCategories.map(c => c.actual || 0), 1);
    fb.businessCategories.forEach(c => {
      const hasBudget = c.budget != null && c.budget > 0;
      const actualPct = c.actual > 0 ? (c.actual / maxBizBudget * 100) : 0;

      html += `<div class="fb-row">
        <span class="fb-label">${c.name}</span>
        <span class="fb-bar-outer">
          ${c.actual > 0 ? `<span class="fb-bar-actual" style="width:${actualPct}%;background:var(--gold)"></span>` : ''}
        </span>
        <span class="fb-vals">
          ${c.actual > 0 ? `<span style="color:var(--white)">${$(c.actual)}</span>` : '<span style="color:var(--gray)">$0</span>'}
          ${hasBudget ? ` <span style="color:var(--gray)">/ ${$(c.budget)}</span>` : ` <span class="fb-tbd">TBD</span>`}
        </span>
      </div>`;
    });

    if (fb.businessCategories.every(c => !c.actual && !c.budget)) {
      html += `<div style="text-align:center;padding:20px 0;color:var(--gray);font-size:0.75rem">No business expenses tracked yet</div>`;
    }
    html += `</div>`;
    html += `</div>`; // close grid-2
  }

  // REVENUE & RUNWAY
  if (D.revenue) {
    const r = D.revenue;
    html += `<div class="section-header">Revenue &amp; Runway &middot; ${r.month}</div>`;
    html += `<div class="grid-3">
      <div class="card card-green">
        <h3>Consulting Revenue</h3>
        <div class="med c-green">${$(r.consulting.collected)}</div>
        <div class="small">Collected &middot; ${$(r.consulting.invoiced)} invoiced &middot; ${$(r.consulting.pipeline)} pipeline</div>
      </div>
      <div class="card">
        <h3>Net Income</h3>
        <div class="med ${r.netIncome >= 0 ? 'c-green' : 'c-red'}">${r.netIncome >= 0 ? '' : '-'}${$(r.netIncome)}</div>
        <div class="small">Revenue minus all expenses</div>
      </div>
      <div class="card card-blue">
        <h3>Runway</h3>
        <div class="med" style="color:var(--blue)">${r.runwayMonths > 0 ? r.runwayMonths + ' mo' : '\u2014'}</div>
        <div class="small">At current burn rate</div>
      </div>
    </div>`;
    if (r.note) {
      html += `<div style="font-size:0.7rem;color:var(--gray);margin-bottom:20px;font-style:italic">${r.note}</div>`;
    }
  }

  // TOP-LINE ACTUALS
  if (D.topline) {
    const t = D.topline;
    html += `<div class="section-header">Actuals</div>`;
    html += `<div class="grid-4">
      <div class="card card-red">
        <h3>April Spend (MTD)</h3>
        <div class="big c-red">${$(t.aprilMTD.amount)}</div>
        <div class="small">${t.aprilMTD.transactions} transactions &middot; ${t.aprilMTD.days} days</div>
      </div>
      <div class="card card-red">
        <h3>March Total</h3>
        <div class="big c-red">${$(t.marchTotal.amount)}</div>
        <div class="small">${t.marchTotal.transactions} transactions</div>
      </div>
      <div class="card">
        <h3>April Returns</h3>
        <div class="med c-gold">${$(t.aprilReturns.amount)}</div>
        <div class="small">${t.aprilReturns.count} returns in ${t.aprilMTD.days} days</div>
      </div>
      <div class="card">
        <h3>Utah Spend</h3>
        <div class="med c-gold">${$(t.utahSpend.amount)}</div>
        <div class="small">${t.utahSpend.transactions} transactions &middot; ~${t.utahSpend.weeks} weeks</div>
      </div>
    </div>`;
  }

  // SPEND BY OWNER
  if (D.byOwner && D.byOwner.owners.length) {
    html += `<div class="grid-2">`;

    // Owner breakdown
    html += `<div class="card">
      <h3>${D.byOwner.month} by Account Owner</h3>`;
    D.byOwner.owners.forEach(o => {
      html += `<div class="bar-row">
        <span class="bar-label" style="color:${colorVar(o.color)}">${o.name}</span>
        <span class="bar-wrap"><span class="bar-fill" style="width:${o.pct}%;background:${colorVar(o.color)}"></span></span>
        <span class="bar-val">${$(o.amount)}</span>
      </div>`;
    });
    html += `</div>`;

    // Karissa velocity
    if (D.karissaVelocity && D.karissaVelocity.length) {
      html += `<div class="card card-red">
        <h3>Karissa Weekly Velocity (Post-Separation)</h3>`;
      D.karissaVelocity.forEach(w => {
        const c = w.pct >= 90 ? 'var(--red)' : 'var(--gold)';
        html += `<div class="bar-row">
          <span class="bar-label">${w.label}</span>
          <span class="bar-wrap"><span class="bar-fill" style="width:${w.pct}%;background:${c}"></span></span>
          <span class="bar-val">${$(w.amount)}</span>
        </div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
  }

  // TOP CATEGORIES
  if (D.categories && D.categories.length) {
    html += `<div class="section">
      <div class="section-header">Spending by Category</div>`;
    D.categories.forEach(c => {
      html += `<div class="bar-row">
        <span class="bar-label">${c.name}</span>
        <span class="bar-wrap"><span class="bar-fill" style="width:${c.pct}%;background:${colorVar(c.color)}"></span></span>
        <span class="bar-val">${$(c.amount)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // TOP MERCHANTS
  if (D.merchants && D.merchants.length) {
    html += `<div class="section">
      <div class="section-header">Top Merchants</div>
      <table>
        <tr><th>Merchant</th><th style="text-align:right">Amount</th><th>Notes</th></tr>`;
    D.merchants.forEach(m => {
      const noteHtml = m.flag
        ? `<span class="flag ${flagClass(m.flag)}">${m.note}</span>`
        : (m.note || '');
      html += `<tr>
        <td style="color:var(--white)">${m.name}</td>
        <td style="text-align:right" class="amt-neg">${$(m.amount)}</td>
        <td>${noteHtml}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  // UTAH ACTIVITY
  if (D.utah && D.utah.totalSpend > 0) {
    html += `<div class="section">
      <div class="section-header">Utah Activity (Karissa)</div>
      <div class="grid-3" style="margin-bottom:14px">
        <div class="card" style="text-align:center;border-top-color:var(--gold)">
          <h3>Total Utah Spend</h3>
          <div class="med c-gold">${$(D.utah.totalSpend)}</div>
          <div class="small">${D.utah.transactions} transactions</div>
        </div>
        <div class="card card-green" style="text-align:center">
          <h3>Utah Returns</h3>
          <div class="med c-green">${$(D.utah.returns.amount)}</div>
          <div class="small">${D.utah.returns.count} returns</div>
        </div>
        <div class="card" style="text-align:center;border-top-color:var(--gold)">
          <h3>Net Utah Spend</h3>
          <div class="med c-gold">${$(D.utah.netSpend)}</div>
          <div class="small">~${D.utah.weeks} weeks</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">`;
    D.utah.merchants.forEach(m => {
      html += `<span class="flag flag-yellow">${m}</span>`;
    });
    html += `</div>`;
    if (D.utah.address) {
      html += `<div style="font-size:0.72rem;color:var(--gray)">Address confirmed: <strong style="color:var(--white)">${D.utah.address}</strong></div>`;
    }
    html += `</div>`;
  }

  // RECURRING BILLS
  if (D.recurring && D.recurring.length) {
    html += `<div class="section">
      <div class="section-header">Recurring Bills</div>
      <table>
        <tr><th>Bill</th><th style="text-align:right">Amount</th><th>Method</th><th>AutoPay</th></tr>`;
    D.recurring.forEach(r => {
      const apStr = r.flag
        ? `<span class="flag flag-red">${r.flag}</span>`
        : (r.autopay ? 'Yes' : 'No');
      html += `<tr>
        <td style="color:var(--white)">${r.name}</td>
        <td style="text-align:right"${r.amount && r.amount > 2000 ? ' class="amt-neg"' : ''}>${$(r.amount)}</td>
        <td>${r.method}</td>
        <td>${apStr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  // OPEN QUESTIONS
  if (D.openQuestions && D.openQuestions.length) {
    html += `<div class="section">
      <div class="section-header">Open Questions & Investigations</div>`;
    D.openQuestions.forEach(q => {
      html += `<div class="q-row">
        <span class="flag ${statusFlag(q.status)}" style="width:70px;text-align:center;display:inline-block;margin-right:8px">${statusLabel(q.status)}</span>
        ${q.text}
      </div>`;
    });
    html += `</div>`;
  }

  // DATA SOURCES
  if (D.dataSources && D.dataSources.length) {
    html += `<div class="section">
      <div class="section-header">Data Sources & Freshness</div>
      <table>
        <tr><th>Source</th><th>Status</th><th>Coverage</th><th>Next Action</th></tr>`;
    D.dataSources.forEach(ds => {
      html += `<tr>
        <td style="color:var(--white)">${ds.name}</td>
        <td><span class="flag ${statusFlag(ds.status)}">${statusLabel(ds.status)}</span></td>
        <td>${ds.coverage || '\u2014'}</td>
        <td>${ds.action || '\u2014'}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  // RECENT TRANSACTIONS
  if (D.recentTransactions && D.recentTransactions.length) {
    html += `<div class="section">
      <div class="section-header">Recent Transactions</div>
      <table>
        <tr><th>Date</th><th>Merchant</th><th style="text-align:right">Amount</th><th>Category</th><th>Account</th></tr>`;
    D.recentTransactions.forEach(tx => {
      const amtClass = tx.amount >= 0 ? 'amt-pos' : 'amt-neg';
      const sign = tx.amount >= 0 ? '+' : '-';
      const ownerClass = tx.owner === 'brady' ? 'acct-brady' : (tx.owner === 'karissa' ? 'acct-karissa' : 'acct-kids');
      html += `<tr>
        <td>${tx.date}</td>
        <td style="color:var(--white)">${tx.merchant}</td>
        <td style="text-align:right" class="${amtClass}">${sign}${$full(tx.amount)}</td>
        <td>${tx.category}</td>
        <td class="${ownerClass}">${tx.account}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  // FOOTER
  html += `<footer>Financial Cockpit &middot; Brady OS &middot; Generated ${new Date(D.generated).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</footer>`;

  app.innerHTML = html;
})();
</script>

</body>
</html>
